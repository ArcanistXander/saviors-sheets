<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Vex’ahlia · Pathfinder Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: persistent header (identity left, portrait top-right, stat strip below), sticky tab bar, one panel grid per tab.
   Palette: pine-forest green for the ranger, dawn gold for the Mantle of the Dawn, storm blue for the Sky Sentinel Bow */
:root{
  --bg:#eceeea; --surface:#f8f9f6; --sunk:#e2e6df; --ink:#141a16; --muted:#56635a; --line:#cdd6cc;
  --accent:#2e6a47; --accent-ink:#ffffff; --accent-soft:#dcebe0;
  --bad:#b3261e; --bad-soft:#f6dedb; --buff:#1f5f86; --buff-soft:#d8e9f3; --good:#2c7a4b;
  --dawn:#9a5b0e; --dawn-soft:#f6ead2; --storm:#2f5b8c; --storm-soft:#dde7f3;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1210; --surface:#161b18; --sunk:#111512; --ink:#e5ebe6; --muted:#98a69c; --line:#29312c;
  --accent:#7fcf9e; --accent-ink:#08170e; --accent-soft:#1c2e23;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7cc4e6; --buff-soft:#15303b; --good:#7fcf9b;
  --dawn:#f0b85a; --dawn-soft:#30240f; --storm:#8fb8ea; --storm-soft:#16253a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1210; --surface:#161b18; --sunk:#111512; --ink:#e5ebe6; --muted:#98a69c; --line:#29312c;
  --accent:#7fcf9e; --accent-ink:#08170e; --accent-soft:#1c2e23;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7cc4e6; --buff-soft:#15303b; --good:#7fcf9b;
  --dawn:#f0b85a; --dawn-soft:#30240f; --storm:#8fb8ea; --storm-soft:#16253a; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.05rem;letter-spacing:.06em;color:var(--accent)}
h3{font-size:.95rem;letter-spacing:.05em}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:4.2em;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
textarea{width:100%;resize:vertical;min-height:4.5em;line-height:1.4}

/* header */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.ident{display:grid;gap:6px;min-width:0}
.namein{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;border:0;background:transparent;padding:0;width:100%;letter-spacing:.03em}
.namein:hover{background:var(--sunk)}
.sub{font-size:1.05rem;color:var(--muted)}
.sub b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{border:1px solid var(--bad);color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:1px 10px;font-size:.82rem}
.chip.buff{border-color:var(--buff);color:var(--buff);background:var(--buff-soft)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qt{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--buff);color:var(--buff);background:transparent;border-radius:999px;padding:4px 14px 4px 10px;font-weight:700;font-size:.9rem}
.qt::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor}
.qt[aria-pressed=true]{background:var(--buff);color:var(--surface)}
.qt[aria-pressed=true]::before{background:currentColor;border-color:var(--surface)}
.qt.dim{border-color:var(--accent);color:var(--accent)}
.qt.dim[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.qt.dawn{border-color:var(--dawn);color:var(--dawn)}
.qt.dawn[aria-pressed=true]{background:var(--dawn);color:var(--surface)}
.qt:disabled{opacity:.45;cursor:default}
details.more summary{cursor:pointer;color:var(--accent);font-size:.88rem}
.ovr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:4px;font-size:.82rem;color:var(--muted)}
.ovr input[type=number]{width:3.6em}
.ovr textarea{min-height:2.4em;font-size:.88rem}
.weapon .wtop{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 18px;align-items:center}
.weapon .wname{display:grid;gap:2px;min-width:0}
.weapon .wname input{font-weight:700;font-size:1.05rem;border-color:transparent;background:transparent;padding-left:0}
.weapon .wname input:hover,.weapon .wname input:focus{border-color:var(--line);background:var(--surface);padding-left:6px}
.weapon .wstat{display:grid;text-align:right}
.weapon .wstat b{font-size:1.2rem}
.weapon .wbtns{display:flex;gap:0}
.btn:disabled{opacity:.3;cursor:default}
@media (max-width:640px){.weapon .wtop{grid-template-columns:1fr 1fr}.weapon .wname{grid-column:1/-1}.weapon .wbtns{grid-column:1/-1}.weapon .wstat{text-align:left}}
.critbox{font-weight:700}
.fa{border-color:var(--accent)}
.fatbl td.tot{font-size:1.2rem}
.fatbl tr.xtra td{background:var(--sunk)}
.fatbl tr.storm td{background:var(--storm-soft)}
.roundtot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.rtot{font-size:1.6rem;color:var(--ink)}
.backup{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.pots td{vertical-align:middle}
.pots td:first-child{min-width:16em}
.nowrap{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.geartbl{table-layout:fixed;min-width:640px}
.geartbl .c-item{width:36%}.geartbl .c-desc{width:40%}.geartbl .c-loc{width:14%}.geartbl .c-wt{width:5.5em}.geartbl .c-x{width:2.5em}
.geartbl td input[type=text]{width:100%}
.geartbl td:first-child input{font-weight:700}
.geartbl tr.future td{color:var(--muted)}
.roll{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.88rem;padding:4px 0}
.roll select{font-size:.85rem}
.rgrp{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rf{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.rf input{width:3.6em}
.rres b{font-size:1.15rem;color:var(--ink)}
.crit{color:var(--good);font-style:normal;font-weight:700}
.miss{color:var(--bad);font-style:normal;font-weight:700}
.rollrow td{border-top:0;padding-top:0}
.rolltools{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hplog{display:grid;gap:2px;font-size:.86rem;border-top:1px solid var(--line);padding-top:6px}
.hplog div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.hplog b{color:var(--ink)}
.hplog .btn{justify-self:start}
.ord{display:inline-block;min-width:2.6em;padding:1px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem}
.lvlup{border-color:var(--accent)}
.summary{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.summary h3{font-size:1.05rem}
.summary ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:3px}

.art{width:170px;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.art .ph{padding:12px;color:var(--muted);font-size:.85rem;display:grid;gap:6px;justify-items:center}
.art .ph svg{width:34px;height:34px;opacity:.6}
.art .tools{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;justify-content:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .15s}
.art:hover .tools,.art:focus-within .tools{opacity:1}
.art .tools button{background:rgba(255,255,255,.9);color:#1c1a24;border:0;border-radius:4px;font-size:.78rem;padding:2px 8px}
.art.drag{outline:2px dashed var(--accent);outline-offset:3px}
.art .pick{position:absolute;inset:0;background:transparent;border:0}

.strip{display:flex;flex-wrap:wrap;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:8px 14px;border-right:1px solid var(--line);display:grid;gap:0;min-width:70px;flex:1 0 auto}
.stat:last-child{border-right:0}
.stat .v{font-size:1.35rem;font-weight:500;line-height:1.2}
.hpstat{flex:3 1 220px}
.hpbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .2s}
.hpbar i.low{background:var(--bad)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:18px;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:10px 14px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:.72rem;line-height:18px;text-align:center}
.status{margin-left:auto;align-self:center;font-size:.78rem;color:var(--muted);white-space:nowrap;padding-inline:8px}

.page{display:grid;gap:18px;margin-top:18px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel>header .muted{font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:center;padding:4px 4px;white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:4px;text-align:center;border-top:1px solid var(--line);vertical-align:middle}
td.tot{font-weight:700;font-size:1.08rem;min-width:3em}
.op{color:var(--muted);font-size:.8rem;padding:0 1px}
[data-d=down]{color:var(--bad)!important}
[data-d=up]{color:var(--buff)!important}
.abtbl td:first-child{font-family:var(--f-display);font-size:1.05rem;text-align:left}
.mod{display:inline-block;min-width:2.6em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.kv label{font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 14px}
.field{display:grid;gap:2px;min-width:0}
.field input,.field select{width:100%}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3>div{background:var(--sunk);border-radius:var(--r);padding:8px 4px}
.big3 .v{font-size:1.7rem;font-weight:500;line-height:1.1}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.note.warn{border-color:var(--bad);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 10px;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.x{border:0;background:transparent;color:var(--muted);padding:2px 6px}
.btn.x:hover{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs{width:16px;height:16px;accent-color:var(--accent)}
.skilltbl td:nth-child(2){text-align:left;white-space:nowrap}
.skilltbl input.sub{width:7.5em}
.untr{color:var(--muted);font-weight:400!important}
.counter{font-size:.9rem}
.counter b.over{color:var(--bad)}
.vers{font-size:.78rem;color:var(--accent);white-space:nowrap}
.cols2{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.actop{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:760px){.actop{grid-template-columns:1fr}}
.actop .big3 .v{font-size:2rem}
.acedit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.acedit .field input{width:100%}
@media (max-width:460px){.acedit{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acparts{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.acparts span{display:grid;justify-items:center;gap:1px;background:var(--sunk);border-radius:var(--r);padding:5px 4px}
.acparts small{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.acparts b{font-size:1.1rem}
.acparts span:first-child{background:var(--accent-soft)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr));gap:10px}
.ctile{display:grid;gap:4px;align-content:start;background:var(--sunk);border-radius:var(--r);padding:10px 12px;min-width:0}
.ctile .v{font-size:1.45rem;font-weight:600;line-height:1.15}
.ctile .rf{flex-wrap:wrap;font-size:.82rem;gap:3px}
.ctile select{max-width:100%;font-size:.85rem}
.ctile input[type=number]{width:3.3em;padding:2px 3px;font-size:.85rem}

/* abilities list */
.ab-list{display:grid;gap:0}
.ab{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ab:first-child{border-top:0}
.ab .lv{font-family:var(--f-display);color:var(--accent);font-size:.95rem;padding-top:1px}
.ab .nm{font-weight:700}
.ab .ty{font-size:.78rem;color:var(--muted);margin-left:4px}
.ab .ds{color:var(--ink);font-size:.93rem;margin-top:2px}
.ab.new .lv::after{content:"new";display:block;font-family:var(--f-body);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dawn)}
.pips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:8px;vertical-align:middle}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;padding:0}
.pip[aria-pressed=true]{background:var(--accent)}
.custom{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.custom .row input.nm{flex:1 1 200px;font-weight:700}

/* spells */
.spl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.spl input.nm{font-weight:700;width:100%}
.spl .ds{grid-column:1/-1;font-size:.88rem;color:var(--muted)}
.spl.cast input.nm{text-decoration:line-through;color:var(--muted)}
.slothd{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.slothd .dc{font-size:.85rem;color:var(--muted)}

/* conditions */
.condgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.cond{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0}
.cond .n{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.cond .e{font-size:.8rem;color:var(--muted);line-height:1.3}
.cond:hover{border-color:var(--accent)}
.cond[aria-pressed=true]{border-color:var(--bad);background:var(--bad-soft)}
.cond[aria-pressed=true] .n::after{content:"ON";font-size:.68rem;letter-spacing:.08em;color:var(--bad);align-self:center}
.cond.buffc[aria-pressed=true]{border-color:var(--buff);background:var(--buff-soft)}
.cond.buffc[aria-pressed=true] .n::after{color:var(--buff)}
.charge{display:inline-flex;align-items:center;gap:6px}
.charge b{min-width:2.2em;text-align:center;font-size:1.1rem}
.hpctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hpctl input{width:5em}
.net{display:grid;gap:3px;font-size:.92rem}
.net div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:3px}
.net .neg{color:var(--bad);font-weight:700}.net .pos{color:var(--buff);font-weight:700}
.down{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;gap:6px}
.down.alert{border-color:var(--bad);background:var(--bad-soft)}

/* Mantle of the Dawn: parchment and sunrise gold */
.mantle{border-color:var(--dawn);background:linear-gradient(160deg,var(--surface) 55%,var(--dawn-soft))}
.mantle>header h2{color:var(--dawn)}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;border:1px solid var(--dawn);color:var(--dawn);border-radius:999px;padding:0 8px}
.wpow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.wpow .nm{font-family:var(--f-display);font-size:1.08rem;letter-spacing:.03em}
.wpow .ds{grid-column:1/-1;font-size:.92rem}
.mantle .btn.pri{background:var(--dawn);border-color:var(--dawn);color:var(--surface)}
/* Sky Sentinel Bow: storm clouds */
.storm{border-color:var(--storm);background:linear-gradient(160deg,var(--surface) 55%,var(--storm-soft))}
.storm>header h2{color:var(--storm)}
.storm .tag{border-color:var(--storm);color:var(--storm)}
.storm .btn.pri{background:var(--storm);border-color:var(--storm);color:var(--surface)}
.fx-ray{position:fixed;z-index:60;pointer-events:none;width:3px;height:70px;border-radius:2px;background:linear-gradient(#fff6d0,#f0b85a 60%,transparent);transform:translate(-50%,-50%) rotate(var(--a));animation:fxRay 1.4s ease-out forwards}
@keyframes fxRay{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-110px)}}
@media (prefers-reduced-motion:reduce){.fx-ray{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="ident">
      <input class="namein" id="f-name" data-p="info.name" aria-label="Character name">
      <div class="sub" id="subline"></div>
      <div class="quick" id="quick" role="group" aria-label="Quick toggles"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="art" id="art"></div>
  </div>

  <div class="strip" id="strip">
    <div class="stat hpstat"><span class="lbl">Hit points</span><span class="v"><span data-o="hp.cur"></span> <span class="muted" style="font-size:1rem">/ <span data-o="hp.max"></span></span> <small class="muted" data-o="hp.extra"></small></span><div class="hpbar"><i id="hpfill"></i></div></div>
    <div class="stat"><span class="lbl">AC</span><span class="v" data-o="ac.total"></span></div>
    <div class="stat"><span class="lbl">Touch</span><span class="v" data-o="ac.touch"></span></div>

  // CMB/CMD: CMD takes her full Dex (the armor's cap is for AC only)
  const cmbAb=ab[S.cmbAbil==='dex'?'dex':'str'].mod;
  put('cmb',bab+cmbAb-szA+n(S.cmbMisc)+M.g('atk')+M.g('cmb'),true);
  const dexCMD=lose?Math.min(0,ab.dex.mod):ab.dex.mod;
  put('cmd',10+bab+ab.str.mod+dexCMD+dodge-szA+defT+othT+n(S.cmdMisc)+M.g('cmd'));
  // HP
  const hpAdj=(ab.con.mod-conMod())*L.total; put('hp.adj',hpAdj,true);
  const hpMax=hpBase()+hpAdj-5*M.neg; put('hp.max',hpMax); put('hp.cur',Math.min(n(S.hp.cur),hpMax));
  put('hp.why',0,false,hpAdj||M.neg?`${hpBase()} base${hpAdj?` ${sg(hpAdj)} from Con`:''}${M.neg?` −${5*M.neg} negative levels`:''}`:'');
  put('hp.extra',0,false,[n(S.hp.temp)?`+${n(S.hp.temp)} temp`:'',n(S.hp.nl)?`${n(S.hp.nl)} nonlethal`:''].filter(Boolean).join(' · '));
  // skills
  const cs=classSkillSet(); const acp=-Math.abs(n(S.armor.acp))-Math.abs(n(S.shield.acp));
  let spent=0;
  for(const s of SKILLS){const x=S.skills[s.k]||{};const r=n(x.ranks);spent+=r;
    const isC=isCS(s,cs)||!!x.csx; const cb=isC&&r>0?3:0; const am=ab[s.a].mod;
    let other=(s.acp?acp:0)+M.g('skill')+M.g('sk.'+s.k)+((s.a==='str'||s.a==='dex')?M.g('skillStrDex'):0)+(s.a==='cha'?M.g('skillCha'):0);
    if(s.k==='stealth')other+=SZ_STL[si]; if(s.k==='fly')other+=SZ_FLY[si];
    const t=r+cb+am+n(x.misc)+other;
    const untr=s.tr&&r<=0;
    put(`sk.${s.k}`,t,true,untr?'—':sg(t)); put(`sk.${s.k}.ab`,am,true); put(`sk.${s.k}.cb`,cb,false,cb?'+3':'—'); put(`sk.${s.k}.oth`,other,true);
    O[`sk.${s.k}`].cs=isC;}
  for(const s of SKILLS)put(`sk.${s.k}.vp`,0,false,'');
  const track=Math.max(1,Math.floor(L.ranger/2));
  if(L.ranger){const sv2=O['sk.survival'].n;put('sk.survival.vp',sv2,false,`${sg(sv2+track)} to follow tracks${L.ranger>=11?` · ${sg(sv2+track+10)} tracking her quarry`:''} · +2 more tracking animals (Animal Call)`);
    const sc=O['sk.spellcraft'].n;put('sk.spellcraft.vp',sc,false,`${sg(sc+2)} to identify magic items`);
    put('sk.handle.vp',0,false,`${sg(O['sk.handle'].n+4)} with Shadow`);}
  const intMod=Math.floor((n(S.ab.int.base)+n(S.ab.int.temp)-10)/2);
  const avail=S.classes.reduce((a,c)=>a+Math.max(1,n(c.sp)+intMod)*Math.max(0,Math.floor(n(c.level))),0)+n(S.fcbSkill);
  put('sk.spent',spent);put('sk.avail',avail);
  // attacks
  const atkCalc=(a,offHalf)=>{const am=ab[a.abil==='str'?'str':'dex'].mod;
    const hit=bab+am+szA+n(a.enh)+n(a.misc)+M.g('atk')+(a.kind==='melee'?M.g('atkMelee'):M.g('atkRanged'));
    const dmA=String(a.dmgAbil||'str');let da=0;
    if(dmA!=='none'){const sm=dmA.startsWith('dex')?ab.dex.mod:ab.str.mod;let mul=/15$/.test(dmA)?1.5:/05$/.test(dmA)?0.5:1;if(offHalf&&mul===1)mul=0.5;da=sm>0?Math.floor(sm*mul):sm;}
    const db=n(a.enh)+n(a.dmgMisc)+da+M.g('dmg')+(a.kind==='melee'?M.g('dmgMelee'):M.g('dmgRanged'));
    let dc=a.dice||'—';if(M.flags.gravity&&a.kind==='ranged')dc=SIZE_UP[dc]||dc;
    const crit=M.flags.falcon&&a.kind==='ranged'?'19–20/×3':a.crit;
    return {hit,db,crit,dice:dc,dmg:`${dc}${db?sg(db):''}${a.extra?' '+String(a.extra).trim():''}`};};
  S.attacks.forEach((a,i)=>{const r=atkCalc(a,false);
    const its=[];for(let b=r.hit,k=0;k<4&&(k===0||bab-5*k>=1);k++,b-=5)its.push(b);
    put(`atk.${i}.hit`,r.hit,true,its.map(sg).join('/')); put(`atk.${i}.first`,r.hit,true); put(`atk.${i}.dmg`,r.db,false,r.dmg); O[`atk.${i}.hit`].crit=r.crit;});
  // full attack with the bow: Manyshot, Rapid Shot, haste, then the iteratives
  const F=S.fa||{};const W=S.attacks.find(x=>x.id===F.weapon)||S.attacks.find(x=>x.kind==='ranged');const seq=[];let fa=null;
  if(W){const r=atkCalc(W,false),da=F.deadly?1+Math.floor(bab/4):0,pb=F.pb?1:0;
    const hit=r.hit+pb-da-(F.rapid?2:0),db=r.db+pb+2*da;
    const am=W.kind==='ranged'?ammoSel():{extra:''};const base=[String(W.extra||'').trim(),am.extra].filter(Boolean);
    const mk=(label,h,ex,note,cls)=>{const all=[...base,...ex];seq.push({label,hit:h,db,crit:r.crit,note:note||'',cls:cls||'',dmg:`${r.dice}${db?sg(db):''}${all.length?' '+all.join(' '):''}`})};
    const first=[F.evil?'+2d6 holy':'',F.string?`+1d8 ${F.stringType==='lightning'?'electricity':'fire'}`:''].filter(Boolean);
    if(F.storm){for(let k=0;k<3;k++)mk(`Storm Arrow ${k+1} of 3`,hit,[...(k?[]:first),'+1d6 electricity'],k?'its own attack roll':'the first arrow splits in three','storm')}
    else mk('1st attack',hit,first,F.evil?'the holy damage counts on the first arrow that hits each round':'');
    if(F.many)mk('Manyshot: 2nd arrow',hit,[],'same attack roll as the 1st; not multiplied on a crit','xtra');
    if(F.rapid)mk('Rapid Shot',hit,[],'','xtra');
    if(M.active.some(c=>c.id==='haste'))mk('Haste',hit,[],'','xtra');
    const nIt=Math.min(4,1+Math.max(0,Math.floor((bab-1)/5)));
    for(let k=1;k<nIt;k++)mk(`${ORD[k]} attack`,hit-5*k,[]);
    seq.forEach((x,j)=>{put(`seq.${j}.hit`,x.hit,true);put(`seq.${j}.dmg`,x.db,false,x.dmg)});
    fa={W,da,pb,hit,db,arrows:seq.length-(F.storm?2:0),ammo:am};}
  // ranger numbers
  put('track',track,true);
  put('empathy',L.ranger+ab.cha.mod,true);
  put('cl',casterLevel());
  for(let l=1;l<=4;l++)put('dc.'+l,10+l+ab.wis.mod);
  put('spatk.melee',bab+ab.str.mod+szA+M.g('atk')+M.g('atkMelee'),true);
  put('spatk.ranged',bab+ab.dex.mod+szA+M.g('atk')+M.g('atkRanged'),true);
  put('deadly',0,false,`−${1+Math.floor(bab/4)} / +${2*(1+Math.floor(bab/4))}`);
  return {O,M,L,ab,bab,lose,acp,si,base,seq,fa};
}

    add('Ranger',1,'Track','Ex',`${out('track')} on Survival checks to follow tracks (half her ranger level).`);
    add('Ranger',1,'Wild Empathy','Ex',`d20 ${out('empathy')} (ranger level + Cha) to improve an animal’s attitude, like Diplomacy. Magical beasts with Int 1–2 at −4.`);}

    add('Ranger',3,'Favored Terrain','Ex',`${ftL||'None set'}. In it: the bonus on initiative and on Knowledge (geography), Perception, Stealth and Survival, and she leaves no trail. ${Math.min(4,1+Math.floor((r-3)/5))} terrains at ranger ${r}; her paper sheet names two.`);}
  if(r>=4){add('Ranger',4,'Hunter’s Bond','Ex',`Animal companion: <b>${esc((S.comp||{}).name||'Shadow')}</b>, with an effective druid level of ${Math.max(1,r-3)} (Companion tab).`);

  if(r>=7)add('Ranger',7,'Woodland Stride','Ex','Moves through natural undergrowth at full speed without taking damage. Magically altered plants still hinder her.');
  if(r>=8)add('Ranger',8,'Swift Tracker','Ex','Moves at full speed while following tracks without a penalty, and at double speed with only −10 (instead of −20).');
  if(r>=9)add('Ranger',9,'Evasion','Ex','No damage on a successful Reflex save against a half-damage effect. Only in light armor or none: the Dawnforged Dragonscale counts as light.');
  if(r>=11)add('Ranger',11,'Quarry','Ex',`Standard action: mark one creature in sight as her quarry. She can take 10 on Survival to track it while moving at normal speed, gets ${sg(quarryB())} insight on attack rolls against it, and every critical threat against it is confirmed. One quarry at a time; a new one after the first dies or 1 hour passes.`);
  if(r>=12)add('Ranger',12,'Camouflage','Ex','Can use Stealth in any of her favored terrains, even without cover or concealment.');
  if(r>=16)add('Ranger',16,'Improved Evasion','Ex','On a failed Reflex save against a half-damage effect she takes only half. Light armor or none (see Evasion).');
  if(r>=17)add('Ranger',17,'Hide in Plain Sight','Ex','In any of her favored terrains she can use Stealth even while being observed.',{fresh:true});
  if(r>=19)add('Ranger',19,'Improved Quarry','Ex','Quarry as a free action, take 20 to track it, +4 insight on attacks against it.');
  if(r>=20)add('Ranger',20,'Master Hunter','Ex','Full-round attack against a favored enemy: Fort save or dies. Can always move at full speed while tracking.');

    if(a.uses&&o&&String(o.uses??'').trim()!=='')a.uses=Math.max(0,Math.floor(n(o.uses)));});

}

/* keep current HP in step with Con changes */
function syncConHP(){const a=compute(true).O['hp.adj'].n,prev=n(S.hp.conAdj);if(a===prev)return;
  S.hp.cur=n(S.hp.cur)+(a-prev);S.hp.conAdj=a;hpLog(a>prev?`Con up: +${a-prev} HP`:`Con back down: −${prev-a} HP`);}

function faPanel(C){
  const F=S.fa||{},L=C.seq||[],fa=C.fa;if(!fa)return '';

  const chk=(k,l,o={})=>`<label class="row" style="gap:6px"${o.title?` title="${esc(o.title)}"`:''}><input type="checkbox" class="cs" data-p="fa.${k}" ${F[k]?'checked':''}${o.dis?' disabled':''}>${l}</label>`;
  const stormUsed=n(S.used.storm)>=1,strUsed=n(S.used.string);
  const ammoOpts=[['sun','Sunlight arrows (Mantle, unlimited)'],...(S.ammo||[]).map((x,i)=>['a'+i,`${x.name||'Arrows'} (${n(x.left)} left)`])];
  return `<section class="panel fa"><header><h2>Full Attack</h2><span class="muted">One row per arrow, in order. Type each d20 and the dice you rolled.</span>${rollTools()}</header>
   <div class="row" style="align-items:end">${field('Weapon',sel('fa.weapon',opts,{label:'Full attack weapon'}))}${field('Arrows',sel('fa.ammo',ammoOpts,{label:'Arrows'}))}</div>
   <div class="row">${chk('rapid','Rapid Shot (−2)')}${chk('many','Manyshot')}${chk('deadly',`Deadly Aim (${C.O.deadly.t})`)}${chk('pb','Within 30 ft. (Point Blank +1)')}${chk('evil','Evil target (+2d6 holy)',{title:'Sun String: the first arrow that hits an evil creature each round'})}</div>
   <div class="row">${chk('storm',`Storm Arrow${stormUsed&&!F.storm?' (used today)':' (1/day)'}`,{dis:stormUsed&&!F.storm,title:'Sky Sentinel Bow: the first arrow splits into three, each +1d6 electricity'})}
    ${chk('string',`Bowstring +1d8 (${Math.max(0,2-strUsed)} of 2 left)`,{dis:strUsed>=2&&!F.string})}${F.string?sel('fa.stringType',[['fire','fire'],['lightning','lightning']],{label:'Bowstring damage type'}):''}</div>
   ${L.length?`<div class="scroll"><table class="fatbl"><thead><tr><th>Order</th><th class="l">Arrow</th><th>Attack</th><th class="l">Damage</th></tr></thead><tbody>
   ${L.map((x,j)=>`<tr class="${x.cls}"><td><span class="ord">${j+1}</span></td><td class="l"><b>${esc(x.label)}</b>${x.note?`<br><small class="muted">${esc(x.note)}</small>`:''}</td><td class="tot" data-o="seq.${j}.hit"></td><td class="l" data-o="seq.${j}.dmg"></td></tr><tr class="rollrow ${x.cls}"><td></td><td colspan="3" class="l">${rollBox('t'+j)}</td></tr>`).join('')}
   </tbody></table></div><div class="roundtot" id="rt-t"></div>

   <p class="note">Paper sheet (level 16): Rapid Shot 21/21/16/11/6, Manyshot 23/18/13/8 with 2d8+8 on the first attack, Storm Arrow 23/23/23 then 18/13/8. A Manyshot crit multiplies only one arrow. Crit damage here multiplies the weapon die and bonuses; the extra dice (fire, holy, elemental arrows) aren’t multiplied, so type them in their own box.</p>`:''}

function pSpells(){
  const C=compute(true),cl=casterLevel();
  const lv=[1,2,3,4].map(l=>({l,si:slotInfo(l,C)})).filter(x=>x.si.base!==null);
  if(!lv.length)return `<section class="panel"><p class="muted">Rangers cast spells from 4th level.</p></section>`;
  const lists=Object.keys(RS).map(l=>`<datalist id="rs-${l}">${Object.keys(RS[l]).map(nm=>`<option value="${esc(nm)}">`).join('')}</datalist>`).join('');
  const panels=lv.map(({l,si})=>{const P=prepOf(l),used=P.filter(x=>x.c).length;
    return `<section class="panel"><header class="slothd"><h2>${ORD[l-1]} level</h2><span class="dc">DC ${out('dc.'+l)} · ${si.total} a day${si.bonus?` (${si.base} + ${si.bonus} from Wis)`:''}</span><span class="muted">${Math.max(0,si.total-used)} left</span></header>
     ${P.length>si.total?`<p class="note warn">${P.length} prepared, but she has ${si.total} slots at this level.</p>`:''}
     <div>${P.map((x,i)=>{const d=x.d||rsDesc(x.n);return `<div class="spl${x.c?' cast':''}">${txt(`spells.${l}.${i}.n`,{cls:'nm',list:'rs-'+l,label:'Spell name',rr:1,ph:'Spell'})}
       ${x.c?`<button class="btn" data-act="spUncast" data-l="${l}" data-i="${i}">Undo cast</button>`:`<button class="btn pri" data-act="spCast" data-l="${l}" data-i="${i}">Cast</button>`}
       <button class="btn x" data-act="spDel" data-l="${l}" data-i="${i}" aria-label="Remove ${esc(x.n)}">✕</button>
       <div class="ds">${d?esc(d):`<span>No description. </span>`}${!rsDesc(x.n)?` ${txt(`spells.${l}.${i}.d`,{w:'100%',label:'Spell description',ph:'Range, duration (e.g. “Touch, 10 min/level”), effect'})}`:''}</div></div>`}).join('')||'<p class="muted" style="margin:0">Nothing prepared yet.</p>'}</div>
     <div class="row"><button class="btn" data-act="spAdd" data-l="${l}"${P.length>=si.total?' title="All slots are filled"':''}>Prepare a spell</button>
      ${field('Slots per day (override)',num(`spOv.${l}`,{w:'4em',rr:1,label:`${ORD[l-1]}-level slots override`,ph:String(si.rule)}))}</div>

function castTargets(nm,selfId,desc){
  const L=S.sdLog||[], e=L[L.length-1], personal=/^\s*personal\b/i.test(desc||'');

/* which table an item goes to, guessed from its name */
function bohCat(nm){nm=String(nm||'').toLowerCase();
  if(/map|book|journal|letter|note|scroll|diary|document/.test(nm))return 'books';
  if(/arrow|bolt|bow|sword|dagger|axe|spear|blade|knife/.test(nm))return 'weapon';
  if(/armor|armour|shield|breastplate|barding|scale|mail|plate/.test(nm))return 'armor';
  if(/acid|oil|flask|tanglefoot|alchemist|sunrod|tindertwig|poison/.test(nm))return 'alch';
  if(/ring|amulet|cloak|boots|crown|bracer|belt|glove|earring|circlet|necklace/.test(nm))return 'wear';
  if(/torch|rope|water|ration|flint|bedroll|backpack|food|tent|blanket|lantern|pot|kit|candle|chalk|soap/.test(nm))return 'supplies';
  return 'other';}
function bohData(){const b=S.boh=S.boh||clone(DEFAULT.boh);b.items=b.items||[];return b}

  const A=compute(true),B=compute(false);

let assets=null;
const DEFAULT_ART='img/vex.jpg';
function artSrc(){if(S.art===false)return null;if(!S.art)return DEFAULT_ART;if(S.art.url)return S.art.url;if(S.art.id)return '/_blob/'+S.art.id;return S.art.data||null}
function renderArt(){
  const el=document.getElementById('art');const src=artSrc();
  el.innerHTML=src?`<img src="${esc(src)}" alt="Portrait of ${esc(S.info.name||'Vex’ahlia')} with Shadow"><div class="tools"><button data-act="artPick">Change</button><button data-act="artRemove">Remove</button></div>`
   :`<button class="pick" data-act="artPick" aria-label="Add character art"></button><div class="ph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg><span>Add character art</span><small>Click or drop an image</small></div>`;
}
function shrink(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const OK_TYPES=['image/png','image/jpeg','image/gif','image/webp'];
async function setArt(file){
  if(!file||!/^image\//.test(file.type)){setStatus('Choose an image file (PNG, JPG, GIF or WebP).');return}
  setStatus('Adding art…');
  try{
    if(assets){let blob=file;
      if(!OK_TYPES.includes(file.type)||file.size>19e6){const d=await shrink(file,1600,.88);blob=await (await fetch(d)).blob();}
      const r=await assets.upload(blob,{type:blob.type||'image/jpeg'});const old=S.art&&S.art.id;S.art={id:r.id};
      if(old&&old!==r.id)assets.delete(old).catch(()=>{});
    } else { let d=await shrink(file,700,.82); if(d.length>180000)d=await shrink(file,480,.75); S.art={data:d}; }
    renderArt();scheduleSave(true);
  }catch(e){setStatus(e&&e.code==='too_large'?'That image is too large. Choose one under 20 MB.':'Couldn’t add that image. Try a PNG or JPG.')}
}

/* round total: adds the damage of every arrow that has damage entered and isn't marked MISS */
function roundTotals(C,roundDmg){
  ['t'].forEach(p=>{const box=document.getElementById('rt-'+p);if(!box)return;const parts=[];let sum=0,miss=0;
    document.querySelectorAll(`[data-rk^="${p}"]`).forEach(el=>{const k=el.dataset.rk;if(rowHit(k,C)===false){miss++;return}if(roundDmg[k]==null)return;
      parts.push(`#${+k.slice(1)+1} ${roundDmg[k]}`);sum+=roundDmg[k];});
    box.innerHTML=`<span class="lbl">Round total</span>`+(parts.length
      ?` <b class="rtot">${sum}</b> damage from ${parts.length} hit${parts.length>1?'s':''} <small class="muted">(${parts.join(' + ')})${miss?` · ${miss} miss${miss>1?'es':''} not counted`:''}</small>`
      :` <span class="muted">Type the damage for each arrow that hits and the total adds up here. Arrows marked MISS are left out.</span>`);});
}
/* true = hit, false = miss, null = unknown (no d20 yet, or no target AC entered) */
function rowHit(k,C){const info=rollInfo(k,C),r=rolls[k]||{};if(!info||!(n(r.d20)>=1))return null;const d=Math.floor(n(r.d20));
  if(d===1)return false;if(d===20)return true;if(rolls.ac===''||rolls.ac==null)return null;return d+info.hit>=n(rolls.ac)}
function critMult(c){const m=String(c||'').match(/[×x]\s*(\d)/i);return m?+m[1]:2}

/* golden rays for the Mantle */
function rays(x,y,count){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<(count||14);i++){const p=document.createElement('div');p.className='fx-ray';p.style.left=x+'px';p.style.top=y+'px';
    p.style.setProperty('--a',(i/(count||14)*360+Math.random()*10).toFixed(0)+'deg');p.style.animationDelay=(Math.random()*.15)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),1700)}}
function burstAt(b){if(!b)return;const rc=b.getBoundingClientRect();rays(rc.left+rc.width/2,rc.top+rc.height/2,16)}

/* long rest: heals character level + Con mod, clears nonlethal, resets daily uses and spell slots (hero points kept) */
function restHeal(){return Math.max(1,levels().total+conMod())}
function longRest(heal){
  let h=0;
  if(heal){const mx=hpMaxNow();const before=n(S.hp.cur);S.hp.cur=Math.min(mx,before+restHeal());h=S.hp.cur-before;S.hp.nl=0;}
  const keep={};Object.keys(S.used).forEach(k=>{if(k==='hero'||/^w\./.test(k))keep[k]=S.used[k]});S.used=keep;
  S.cond.aura=false;S.cond.batfly=false;S.fa.storm=false;S.fa.string=false;
  [1,2,3,4].forEach(l=>prepOf(l).forEach(x=>x.c=false));
  dayLog('Rested: spell slots, Revealing Light, Dawn’s Glare, Storm Arrow, the bowstring, the Cloak of the Bat and Wisdom of the Forest reset');
  return h;
}
function castSpell(l,i,btn){
  const x=prepOf(l)[i];if(!x||x.c)return;const si=slotInfo(l,compute(true)),used=prepOf(l).filter(p=>p.c).length;
  if(used>=si.total){setStatus(`No ${ORD[l-1]}-level slots left today.`);return}
  if(!String(x.n||'').trim()){setStatus('Name the spell first.');return}
  x.c=true;dayLog(`Cast ${x.n}`);const fx=SPELL_FX[x.n];
  if(fx){castTargets(x.n,fx,x.d||rsDesc(x.n));return}
  if(btn)burstAt(btn);render();
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset&&t.dataset.cap){const v=Math.floor(n(t.value)),c=n(t.dataset.cap);if(t.value!==''&&v>c)t.value=c;return;}
  if(t.dataset&&t.dataset.roll){const [k,f]=t.dataset.roll.split('.');
    if(!f){rolls[k]=t.type==='checkbox'?t.checked:(t.value===''?'':n(t.value));document.querySelectorAll(`[data-roll="${k}"]`).forEach(x=>{if(x!==t){if(x.type==='checkbox')x.checked=t.checked;else x.value=t.value}});
      updRolls(compute(true));return;}
    const r=rolls[k]=rolls[k]||{};
    if(t.type==='checkbox')r[f]=t.checked;
    else{let v=t.value===''?'':Math.floor(n(t.value));
      if(v!==''){const info=rollInfo(k,compute(true));let lo=1,hi=Infinity,lab='';
        if(f==='d20'){hi=20}
        else if((f==='dmg'||f==='xd')&&info){const rg=diceRange(info)[f==='dmg'?'w':'x'];lo=rg.min;hi=rg.max;lab=rg.txt}
        if(hi!==Infinity&&v>hi){if(f!=='d20')r.capped=`${lab} can only roll ${lo}–${hi}`;v=hi;t.value=hi;}
        else if(f!=='d20')r.capped=v<lo?`${lab} rolls at least ${lo}`:'';}
      r[f]=v;}
    updRolls(compute(true));return;}
  const p=t.dataset&&t.dataset.p;if(!p)return;
  let v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':n(t.value)):t.value;setP(p,v);
  if(t.tagName==='SELECT'&&/classes\.\d+\.preset/.test(p)&&PRESETS[v]){const i=+p.split('.')[1];Object.assign(S.classes[i],clone(PRESETS[v]),{preset:v,level:S.classes[i].level});}
  /* Storm Arrow and the bowstring spend a daily use when ticked */
  if(p==='fa.storm'&&v){if(n(S.used.storm)<1){S.used.storm=1;dayLog('Storm Arrow: the first arrow splits into three');}}
  if(p==='fa.string'&&v){const u=n(S.used.string);if(u<2){S.used.string=u+1;dayLog(`Bowstring: +1d8 ${S.fa.stringType||'fire'} (${2-S.used.string} left)`);}}
  if(t.type==='checkbox'||t.tagName==='SELECT'){render()}else refresh();
  scheduleSave();});
document.addEventListener('change',e=>{const t=e.target;
  /* a location of “In bag” puts the item in the Bag of Holding */
  const gm=t.dataset&&/^gear\.(\d+)\.loc$/.exec(t.dataset.p||'');if(gm&&inBagLoc(t.value)){toBag(+gm[1]);render();setStatus('Moved into the Bag of Holding (Gear & Notes › Bag of Holding)');scheduleSave();return;}
  if(t.dataset&&t.dataset.p&&t.hasAttribute('data-rr')&&t.tagName==='INPUT'&&t.type!=='checkbox'){const f=t.id;render();const el=document.getElementById(f);if(el)el.focus({preventScroll:true});}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,l=+b.dataset.l;
  const amt=id=>Math.max(0,Math.floor(n((document.getElementById(id)||{}).value)));
  const takeDmg=d=>{const tmp=n(S.hp.temp),use=Math.min(tmp,d);S.hp.temp=tmp-use;S.hp.cur=n(S.hp.cur)-(d-use);return use};
  const afterHit=()=>{if(n(S.hp.cur)<=-n(S.ab.con.base)&&!(S.mantle||{}).reprieve)setTimeout(()=>setStatus(`Down to ${n(S.hp.cur)} HP: that kills her, unless she uses the Dawn’s Reprieve (Overview tab)`),700);else if(n(S.hp.cur)<=0)setTimeout(()=>setStatus(`Down to ${n(S.hp.cur)} HP`),700)};
  switch(a){
   case 'tab':tab=b.dataset.t;ls.set('vex-tab',tab);render();window.scrollTo({top:Math.min(window.scrollY,document.getElementById('tabs').offsetTop),behavior:'instant'});return;
   case 'addClass':S.classes.push(Object.assign({preset:'Custom',level:1},{name:'New class',hd:8,bab:'3/4',fort:'poor',ref:'poor',will:'good',prestige:false,sp:2,skills:''}));render();break;
   case 'delClass':S.classes.splice(i,1);render();break;
   case 'addAtk':S.attacks.push({id:newId(),name:'',kind:'ranged',abil:'dex',enh:0,misc:0,dice:'1d8',dmgAbil:'none',dmgMisc:0,extra:'',crit:'×3',range:'',type:'',uses:0,notes:'',desc:''});render();break;
   case 'delAtk':S.attacks.splice(i,1);render();break;
   case 'mvAtk':{const j=i+n(b.dataset.d);if(j<0||j>=S.attacks.length)return;const t=S.attacks[i];S.attacks[i]=S.attacks[j];S.attacks[j]=t;render();break;}
   case 'addItem':S[b.dataset.k].push({name:'',desc:'',uses:0});render();break;
   case 'delItem':S[b.dataset.k].splice(i,1);render();break;
   case 'gearSub':gearSub=['on','bag'].includes(b.dataset.v)?b.dataset.v:'on';ls.set('vex-gearsub',gearSub);if(tab!=='gear'){tab='gear';ls.set('vex-tab',tab)}render();window.scrollTo({top:Math.min(window.scrollY,document.getElementById('tabs').offsetTop),behavior:'instant'});return;
   case 'toBag':toBag(i);render();break;
   case 'fromBag':fromBag(i);render();break;
   case 'bohAdd':{const L=bohData().items;L.push({cat:b.dataset.k||'other',item:'',qty:1,desc:'',wt:0});render();const el=document.getElementById(`i-boh_items_${L.length-1}_item`);if(el)el.focus();break;}
   case 'bohDel':{const L=bohData().items,x=L[i];if(!x)return;if(String(x.item||'').trim()&&!confirm(`Remove “${x.item}” for good?`))return;L.splice(i,1);render();break;}
   case 'addGear':S.gear.push({item:'',desc:'',loc:'',wt:0});render();break;
   case 'delGear':S.gear.splice(i,1);render();break;
   case 'use':{const k=b.dataset.k,u=n(S.used[k]);S.used[k]=(i===u-1)?u-1:i+1;
     const sp=(S.special||[]).findIndex(x=>/wisdom of the forest/i.test(x.name||''));
     const nm={aura:AURA,glare:'Dawn’s Glare',storm:'Storm Arrow',string:'Bowstring',bat:'Cloak of the Bat',['special.'+sp]:'Wisdom of the Forest'}[k];
     if(nm)dayLog(S.used[k]>u?`Used ${nm}`:k==='aura'?`Undid ${AURA}`:`Undid ${nm}`);
     if(k==='aura'&&!S.used[k])S.cond.aura=false;
     if(k==='storm'&&!S.used[k])S.fa.storm=false;
     if(k==='bat'&&!S.used[k])S.cond.batfly=false;
     render();break;}
   /* Mantle of the Dawn */
   case 'aura':{if(n(S.used.aura)>=1)return;S.used.aura=1;S.cond.aura=true;dayLog(`Cast ${AURA}`);burstAt(b);render();break;}
   case 'auraOff':S.cond.aura=false;dayLog(`${AURA} faded`);render();break;
   case 'reprieve':{if((S.mantle||{}).reprieve)return;
     if(!confirm('Use the Dawn’s Reprieve? It only comes back if the Dawnfather restores it.'))return;
     const mx=hpMaxNow(),h=Math.floor(mx/2);S.mantle.reprieve=true;S.hp.cur=Math.max(n(S.hp.cur),h);S.hp.nl=0;
     ['blinded','stunned','paralyzed'].forEach(k=>S.cond[k]=false);S.neg=0;
     const r6=dice(6,6),r17=dice(17,6);
     S.mantle.last=`Sunburst (Reflex DC 25, 80 ft.): <b>${r6}</b> to each enemy (${Math.floor(r6/2)} on a save, and blinded on a failed save), <b>${r17}</b> to undead (${Math.floor(r17/2)} on a save). Undead harmed by bright light are destroyed if they fail.`;
     hpLog(`Dawn’s Reprieve: denied death, healed to ${S.hp.cur}`);dayLog(`Dawn’s Reprieve: denied death, back to ${S.hp.cur} HP; sunburst ${r6} (undead ${r17})`);
     burstAt(b);const ar=document.getElementById('art').getBoundingClientRect();setTimeout(()=>rays(ar.left+ar.width/2,ar.top+ar.height*.4,22),200);
     tab='mantle';ls.set('vex-tab',tab);render();break;}
   case 'reprieveBack':S.mantle.reprieve=false;S.mantle.last='';dayLog('The Dawnfather restored the Dawn’s Reprieve');render();break;
   case 'stormGo':{if(n(S.used.storm)>=1&&!S.fa.storm)return;if(!S.fa.storm){S.fa.storm=true;if(n(S.used.storm)<1){S.used.storm=1;dayLog('Storm Arrow: the first arrow splits into three');}}tab='attacks';ls.set('vex-tab',tab);render();break;}
   case 'glare':{if(n(S.used.glare)>=1)return;S.used.glare=1;dayLog('Dawn’s Glare: the attacker saves (Fortitude DC 24) or is blinded for 1 round');burstAt(b);render();break;}
   case 'fort':{const r=1+Math.floor(Math.random()*100),ok=r<=50;S.fortLast=`d% <b>${r}</b>: ${ok?'<b>negated</b>. Roll the damage as a normal hit, with no sneak attack dice.':'it lands. Take the full critical or sneak attack damage.'}`;dayLog(`Fortification: ${r}, ${ok?'negated the crit or sneak attack':'the crit or sneak attack lands'}`);render();break;}
   case 'bat':{if(n(S.used.bat)>=1)return;S.used.bat=1;S.cond.batfly=true;dayLog('Cloak of the Bat: flying, 60 ft. for up to 7 minutes');render();break;}
   case 'batOff':S.cond.batfly=false;dayLog('Cloak of the Bat: landed');render();break;
   /* spells */
   case 'spAdd':(S.spells[l]=S.spells[l]||[]).push({n:'',c:false,d:''});render();{const el=document.getElementById(`i-spells_${l}_${S.spells[l].length-1}_n`);if(el)el.focus()}return;
   case 'spDel':S.spells[l].splice(i,1);render();break;
   case 'spCast':castSpell(l,i,b);break;
   case 'spUncast':{const x=prepOf(l)[i];if(!x)return;x.c=false;dayLog(`Undid cast: ${x.n}`);const fx=SPELL_FX[x.n];if(fx)S.cond[fx]=false;render();break;}
   case 'spRest':[1,2,3,4].forEach(k=>prepOf(k).forEach(x=>x.c=false));dayLog('Prepared spells again');render();break;
   /* arrows */
   case 'spendArrows':{const C=compute(true),fa=C.fa;if(!fa)return;const am=fa.ammo;if(am.idx==null){setStatus('Sunlight arrows cost nothing.');return}
     const x=S.ammo[am.idx];const take=Math.min(n(x.left),fa.arrows);x.left=n(x.left)-take;setStatus(`${x.name}: ${take} fired, ${x.left} left`);render();break;}
   case 'ammo':{const x=S.ammo[i];if(!x)return;x.left=Math.max(0,n(x.left)+n(b.dataset.d));render();break;}
   case 'ammoAdd':(S.ammo=S.ammo||[]).push({name:'',max:20,left:20,extra:'',notes:''});render();break;
   case 'ammoDel':S.ammo.splice(i,1);if(S.fa.ammo&&S.fa.ammo!=='sun')S.fa.ammo='sun';render();break;
   case 'ammoRefill':(S.ammo||[]).forEach(x=>x.left=n(x.max));render();break;
   /* favored enemies and terrains */
   case 'favDef':S.favDef=String(i);render();break;
   case 'feAdd':if((S.fe||[]).length<4)S.fe.push({name:'',b:2});render();break;
   case 'feDel':S.fe.splice(i,1);['fe0','fe1','fe2','fe3'].forEach(k=>S.cond[k]=false);if(n(S.favDef)>=S.fe.length)S.favDef='0';render();break;
   case 'ftAdd':if((S.ft||[]).length<3)S.ft.push({name:'',b:2});render();break;
   case 'ftDel':S.ft.splice(i,1);['ft0','ft1','ft2'].forEach(k=>S.cond[k]=false);render();break;
   /* companion */
   case 'cdmg':S.comp.hp=n(S.comp.hp)-amt('chpamt');render();break;
   case 'cdmgRes':S.comp.hp=n(S.comp.hp)-Math.max(0,amt('chpamt')-15);render();break;
   case 'cheal':S.comp.hp=Math.min(n(S.comp.hpMax),n(S.comp.hp)+amt('chpamt'));render();break;
   case 'cfull':S.comp.hp=n(S.comp.hpMax);render();break;
   case 'trAdd':(S.comp.tricks=S.comp.tricks||[]).push({n:'',dc:15});render();break;
   case 'trDel':S.comp.tricks.splice(i,1);render();break;
   case 'sdLogClear':S.sdLog=[];render();break;
   case 'rest':longRest(false);render();break;
   case 'addNote':setP(b.dataset.k,' ');render();{const el=document.getElementById('i-'+b.dataset.k.replace(/\W/g,'_'));if(el){el.value='';el.focus()}}break;
   case 'levelUp':levelUp();render();break;
   case 'undoLevel':undoLevel();render();break;
   case 'quick':{const id=b.dataset.id;setCond(id,!S.cond[id]);render();break;}
   case 'dmg':{const d=amt('hpamt');if(!d)return;const use=takeDmg(d);hpLog(`Took ${d} damage`+(use?` (${use} from temp HP)`:''));afterHit();render();break;}
   case 'dmgRes':{const d=amt('hpamt');if(!d)return;const ty=b.dataset.v,h=Math.max(0,d-10),use=takeDmg(h);hpLog(`Took ${h} (${d} ${ty} − 10 resisted)`+(use?` (${use} from temp HP)`:''));afterHit();render();break;}
   case 'clearLog':S.hpLog=[];render();break;
   case 'exportSheet':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const x=document.createElement('a');
     x.href=u;x.download=`${(S.info.name||'character').replace(/\W+/g,'-')}-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);setStatus('Backup downloaded');return;}
   case 'importSheet':document.getElementById('importfile').click();return;
   case 'miAdd':(S.mitems=S.mitems||[]).push({name:'',slot:'Slotless',target:'dex',bonus:2,type:'enh',on:true});render();break;
   case 'miDel':S.mitems.splice(i,1);render();break;
   case 'acAdd':(S.acItems=S.acItems||[]).push({name:'',slot:'Ring',type:'deflection',bonus:1,on:true});render();break;
   case 'acDel':S.acItems.splice(i,1);render();break;
   case 'potDrink':{const p=(S.potions||[])[i];if(!p||n(p.qty)<1)return;const dl=diceIn(p.dice),lo=dl.reduce((a,[c])=>a+c,0),hi=dl.reduce((a,[c,s])=>a+c*s,0);
     const el=document.getElementById('pot-roll-'+i);const x=Math.floor(n((el||{}).value));
     if(!(x>=lo&&x<=hi)){setStatus(`Type the ${p.dice} total (${lo}–${hi}).`);if(el)el.focus();return}
     const am=x+n(p.bonus),mx=hpMaxNow(),bf=n(S.hp.cur);S.hp.cur=Math.min(mx,bf+am);const h=S.hp.cur-bf;
     p.qty=n(p.qty)-1;hpLog(`Drank ${p.name}: ${x}+${n(p.bonus)} = ${am}, healed ${h}`);setTimeout(()=>setStatus(`${p.name}: healed ${h} HP`),800);render();break;}
   case 'potAdd':(S.potions=S.potions||[]).push({name:'Cure Light Wounds',dice:'1d8',bonus:1,qty:1});render();break;
   case 'potDel':S.potions.splice(i,1);render();break;
   case 'opDrink':{const p=(S.otherPotions||[])[i];if(!p||n(p.qty)<1)return;p.qty=n(p.qty)-1;if(p.on)S.cond[p.on]=true;
     const vb=p.verb==='Apply'?'Applied':p.verb==='Throw'?'Threw':'Drank';
     dayLog(`${vb} ${p.name}`);setStatus(`${vb} ${p.name}: ${p.qty} left`);render();break;}
   case 'opAdd':(S.otherPotions=S.otherPotions||[]).push({name:'',qty:1,effect:'',on:'',verb:'Drink'});render();break;
   case 'opDel':S.otherPotions.splice(i,1);render();break;
   case 'clearRolls':Object.keys(rolls).forEach(k=>{if(k!=='ac')delete rolls[k]});render();return;
   case 'heal':{const mx=hpMaxNow();if(!amt('hpamt'))return;const bf=n(S.hp.cur);S.hp.cur=Math.min(mx,n(S.hp.cur)+amt('hpamt'));hpLog(`Healed ${S.hp.cur-bf}`);S.hp.nl=Math.max(0,n(S.hp.nl)-amt('hpamt'));render();break;}
   case 'full':{const h=longRest(true);hpLog(`Long rest, healed ${h}`);setTimeout(()=>setStatus(`Long rest: healed ${h} HP, daily uses and spells reset`),800);render();break;}
   case 'cond':{const id=b.dataset.id;setCond(id,!S.cond[id]);render();break;}
   case 'clearCond':S.cond={};S.neg=0;render();break;
   case 'artPick':document.getElementById('artfile').click();return;
   case 'artRemove':{const old=S.art&&S.art.id;S.art=false;if(old&&assets)assets.delete(old).catch(()=>{});renderArt();break;}
   default:return;
  }
  scheduleSave();});
document.getElementById('artfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)setArt(f)});
document.getElementById('importfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.info||!d.classes)throw 0;S=load(d);render();scheduleSave(true);setStatus('Backup restored')}
    catch(err){setStatus('That file isn’t a character sheet backup.')}};r.readAsText(f)});
const artEl=document.getElementById('art');
artEl.addEventListener('dragover',e=>{e.preventDefault();artEl.classList.add('drag')});
artEl.addEventListener('dragleave',()=>artEl.classList.remove('drag'));
artEl.addEventListener('drop',e=>{e.preventDefault();artEl.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)setArt(f)});

boot();
})();
