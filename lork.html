<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Lork · Pathfinder Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: persistent header (identity left, portrait top-right, stat strip below), sticky tab bar, one panel grid per tab.
   Palette: bone and slate, half-orc moss for the accent, raven violet for the Death Walker's Ward */
:root{
  --bg:#ecedea; --surface:#f7f8f5; --sunk:#e1e4de; --ink:#161a17; --muted:#59625b; --line:#cfd5cc;
  --accent:#4d6b23; --accent-ink:#ffffff; --accent-soft:#e1ebcf;
  --bad:#b3261e; --bad-soft:#f6dedb; --buff:#1f5f86; --buff-soft:#d8e9f3; --good:#2c7a4b;
  --raven:#4a3f86; --raven-soft:#e4e0f3;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1210; --surface:#171b18; --sunk:#121513; --ink:#e6ebe4; --muted:#9aa69c; --line:#2a312b;
  --accent:#a8c66a; --accent-ink:#121a06; --accent-soft:#25301a;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7cc4e6; --buff-soft:#15303b; --good:#7fcf9b;
  --raven:#b7a8f0; --raven-soft:#221d36; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1210; --surface:#171b18; --sunk:#121513; --ink:#e6ebe4; --muted:#9aa69c; --line:#2a312b;
  --accent:#a8c66a; --accent-ink:#121a06; --accent-soft:#25301a;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7cc4e6; --buff-soft:#15303b; --good:#7fcf9b;
  --raven:#b7a8f0; --raven-soft:#221d36; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.05rem;letter-spacing:.06em;color:var(--accent)}
h3{font-size:.95rem;letter-spacing:.05em}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:4.2em;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
textarea{width:100%;resize:vertical;min-height:4.5em;line-height:1.4}

/* header */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.ident{display:grid;gap:6px;min-width:0}
.namein{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;border:0;background:transparent;padding:0;width:100%;letter-spacing:.03em}
.namein:hover{background:var(--sunk)}
.sub{font-size:1.05rem;color:var(--muted)}
.sub b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{border:1px solid var(--bad);color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:1px 10px;font-size:.82rem}
.chip.buff{border-color:var(--buff);color:var(--buff);background:var(--buff-soft)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qt{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--buff);color:var(--buff);background:transparent;border-radius:999px;padding:4px 14px 4px 10px;font-weight:700;font-size:.9rem}
.qt::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor}
.qt[aria-pressed=true]{background:var(--buff);color:var(--surface)}
.qt[aria-pressed=true]::before{background:currentColor;border-color:var(--surface)}
.qt.dim{border-color:var(--accent);color:var(--accent)}
.qt.dim[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.qt.rav{border-color:var(--raven);color:var(--raven)}
.qt.rav[aria-pressed=true]{background:var(--raven);color:var(--surface)}
details.more summary{cursor:pointer;color:var(--accent);font-size:.88rem}
.ovr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:4px;font-size:.82rem;color:var(--muted)}
.ovr input[type=number]{width:3.6em}
.ovr textarea{min-height:2.4em;font-size:.88rem}
.weapon .wtop{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 18px;align-items:center}
.weapon .wname{display:grid;gap:2px;min-width:0}
.weapon .wname input{font-weight:700;font-size:1.05rem;border-color:transparent;background:transparent;padding-left:0}
.weapon .wname input:hover,.weapon .wname input:focus{border-color:var(--line);background:var(--surface);padding-left:6px}
.weapon .wstat{display:grid;text-align:right}
.weapon .wstat b{font-size:1.2rem}
.weapon .wbtns{display:flex;gap:0}
.btn:disabled{opacity:.3;cursor:default}
@media (max-width:640px){.weapon .wtop{grid-template-columns:1fr 1fr}.weapon .wname{grid-column:1/-1}.weapon .wbtns{grid-column:1/-1}.weapon .wstat{text-align:left}}
.critbox,.sneakbox{font-weight:700}
.twf{border-color:var(--accent)}
.twftbl td.tot{font-size:1.2rem}
.twftbl tr.off td{background:var(--sunk)}
.roundtot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.rtot{font-size:1.6rem;color:var(--ink)}
.backup{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.pots td{vertical-align:middle}
.pots td:first-child{min-width:16em}
.nowrap{white-space:nowrap}
.geartbl{table-layout:fixed;min-width:640px}
.geartbl .c-item{width:36%}.geartbl .c-desc{width:40%}.geartbl .c-loc{width:14%}.geartbl .c-wt{width:5.5em}.geartbl .c-x{width:2.5em}
.geartbl td input[type=text]{width:100%}
.geartbl td:first-child input{font-weight:700}
.geartbl tr.future td{color:var(--muted)}
.roll{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.88rem;padding:4px 0}
.roll select{font-size:.85rem}
.rgrp{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rf{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.rf input{width:3.6em}
.rres b{font-size:1.15rem;color:var(--ink)}
.crit{color:var(--good);font-style:normal;font-weight:700}
.miss{color:var(--bad);font-style:normal;font-weight:700}
.rollrow td{border-top:0;padding-top:0}
.rolltools{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hplog{display:grid;gap:2px;font-size:.86rem;border-top:1px solid var(--line);padding-top:6px}
.hplog div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.hplog b{color:var(--ink)}
.hplog .btn{justify-self:start}
.ord{display:inline-block;min-width:2.6em;padding:1px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem}
.lvlup{border-color:var(--accent)}
.summary{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.summary h3{font-size:1.05rem}
.summary ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:3px}

.art{width:170px;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.art .ph{padding:12px;color:var(--muted);font-size:.85rem;display:grid;gap:6px;justify-items:center}
.art .ph svg{width:34px;height:34px;opacity:.6}
.art .tools{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;justify-content:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .15s}
.art:hover .tools,.art:focus-within .tools{opacity:1}
.art .tools button{background:rgba(255,255,255,.9);color:#1c1a24;border:0;border-radius:4px;font-size:.78rem;padding:2px 8px}
.art.drag{outline:2px dashed var(--accent);outline-offset:3px}
.art .pick{position:absolute;inset:0;background:transparent;border:0}

.strip{display:flex;flex-wrap:wrap;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:8px 14px;border-right:1px solid var(--line);display:grid;gap:0;min-width:70px;flex:1 0 auto}
.stat:last-child{border-right:0}
.stat .v{font-size:1.35rem;font-weight:500;line-height:1.2}
.hpstat{flex:3 1 220px}
.hpbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .2s}
.hpbar i.low{background:var(--bad)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:18px;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:10px 14px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:.72rem;line-height:18px;text-align:center}
.status{margin-left:auto;align-self:center;font-size:.78rem;color:var(--muted);white-space:nowrap;padding-inline:8px}

.page{display:grid;gap:18px;margin-top:18px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel>header .muted{font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:center;padding:4px 4px;white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:4px;text-align:center;border-top:1px solid var(--line);vertical-align:middle}
td.tot{font-weight:700;font-size:1.08rem;min-width:3em}
.op{color:var(--muted);font-size:.8rem;padding:0 1px}
[data-d=down]{color:var(--bad)!important}
[data-d=up]{color:var(--buff)!important}
.abtbl td:first-child{font-family:var(--f-display);font-size:1.05rem;text-align:left}
.mod{display:inline-block;min-width:2.6em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.kv label{font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 14px}
.field{display:grid;gap:2px;min-width:0}
.field input,.field select{width:100%}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3>div{background:var(--sunk);border-radius:var(--r);padding:8px 4px}
.big3 .v{font-size:1.7rem;font-weight:500;line-height:1.1}
.formula{font-size:.88rem;color:var(--muted);line-height:1.8}
.formula b{color:var(--ink)}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.note.warn{border-color:var(--bad);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 10px;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.x{border:0;background:transparent;color:var(--muted);padding:2px 6px}
.btn.x:hover{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs{width:16px;height:16px;accent-color:var(--accent)}
.skilltbl td:nth-child(2){text-align:left;white-space:nowrap}
.skilltbl input.sub{width:7.5em}
.untr{color:var(--muted);font-weight:400!important}
.counter{font-size:.9rem}
.counter b.over{color:var(--bad)}
.vers{font-size:.78rem;color:var(--accent);white-space:nowrap}
/* overview: abilities and HP side by side, then AC and combat across the full width */
.cols2{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.actop{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:760px){.actop{grid-template-columns:1fr}}
.actop .big3 .v{font-size:2rem}
.acedit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.acedit .field input{width:100%}
@media (max-width:460px){.acedit{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acparts{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.acparts span{display:grid;justify-items:center;gap:1px;background:var(--sunk);border-radius:var(--r);padding:5px 4px}
.acparts small{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.acparts b{font-size:1.1rem}
.acparts span:first-child{background:var(--accent-soft)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr));gap:10px}
.ctile{display:grid;gap:4px;align-content:start;background:var(--sunk);border-radius:var(--r);padding:10px 12px;min-width:0}
.ctile .v{font-size:1.45rem;font-weight:600;line-height:1.15}
.ctile .rf{flex-wrap:wrap;font-size:.82rem;gap:3px}
.ctile select{max-width:100%;font-size:.85rem}
.ctile input[type=number]{width:3.3em;padding:2px 3px;font-size:.85rem}

/* abilities list */
.ab-list{display:grid;gap:0}
.ab{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ab:first-child{border-top:0}
.ab .lv{font-family:var(--f-display);color:var(--accent);font-size:.95rem;padding-top:1px}
.ab .nm{font-weight:700}
.ab .ty{font-size:.78rem;color:var(--muted);margin-left:4px}
.ab .ds{color:var(--ink);font-size:.93rem;margin-top:2px}
.pips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:8px;vertical-align:middle}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;padding:0}
.pip[aria-pressed=true]{background:var(--accent)}
.custom{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.custom .row input.nm{flex:1 1 200px;font-weight:700}

/* conditions */
.condgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.cond{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0}
.cond .n{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.cond .e{font-size:.8rem;color:var(--muted);line-height:1.3}
.cond:hover{border-color:var(--accent)}
.cond[aria-pressed=true]{border-color:var(--bad);background:var(--bad-soft)}
.cond[aria-pressed=true] .n::after{content:"ON";font-size:.68rem;letter-spacing:.08em;color:var(--bad);align-self:center}
.cond.buffc[aria-pressed=true]{border-color:var(--buff);background:var(--buff-soft)}
.cond.buffc[aria-pressed=true] .n::after{color:var(--buff)}
.charge{display:inline-flex;align-items:center;gap:6px}
.charge b{min-width:2.2em;text-align:center;font-size:1.1rem}
.hpctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hpctl input{width:5em}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:28px;height:26px;padding:0}
.net{display:grid;gap:3px;font-size:.92rem}
.net div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:3px}
.net .neg{color:var(--bad);font-weight:700}.net .pos{color:var(--buff);font-weight:700}
.down{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;gap:6px}
.down.alert{border-color:var(--bad);background:var(--bad-soft)}

/* Death Walker's Ward: jet-black leather, raven sheen */
.ward{border-color:var(--raven);background:linear-gradient(160deg,var(--surface) 55%,var(--raven-soft))}
.ward>header h2{color:var(--raven)}
.ward .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;border:1px solid var(--raven);color:var(--raven);border-radius:999px;padding:0 8px}
.wpow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.wpow .nm{font-family:var(--f-display);font-size:1.08rem;letter-spacing:.03em}
.wpow .ds{grid-column:1/-1;font-size:.92rem}
.resgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,108px),1fr));gap:6px;grid-column:1/-1}
.resgrid button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;font-weight:700}
.resgrid button:hover{border-color:var(--raven)}
.resgrid button[aria-pressed=true]{border-color:var(--raven);background:var(--raven);color:var(--surface)}
.fx-feather{position:fixed;z-index:60;pointer-events:none;width:7px;height:22px;border-radius:50% 50% 45% 45%/85% 85% 15% 15%;background:linear-gradient(90deg,#120f17 44%,#4b4170 50%,#120f17 56%);transform:translate(-50%,-50%);animation:fxFeather 1.9s ease-in forwards}
@keyframes fxFeather{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r0))}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r1))}}
@media (prefers-reduced-motion:reduce){.fx-feather{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="ident">
      <input class="namein" id="f-name" data-p="info.name" aria-label="Character name">
      <div class="sub" id="subline"></div>
      <div class="quick" id="quick" role="group" aria-label="Quick toggles"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="art" id="art"></div>
  </div>

  <div class="strip" id="strip">
    <div class="stat hpstat"><span class="lbl">Hit points</span><span class="v"><span data-o="hp.cur"></span> <span class="muted" style="font-size:1rem">/ <span data-o="hp.max"></span></span> <small class="muted" data-o="hp.extra"></small></span><div class="hpbar"><i id="hpfill"></i></div></div>
    <div class="stat"><span class="lbl">AC</span><span class="v" data-o="ac.total"></span></div>
    <div class="stat"><span class="lbl">Touch</span><span class="v" data-o="ac.touch"></span></div>
    <div class="stat"><span class="lbl">Flat</span><span class="v" data-o="ac.ff"></span></div>
    <div class="stat"><span class="lbl">Miss chance</span><span class="v" data-o="miss"></span></div>
    <div class="stat"><span class="lbl">Init</span><span class="v" data-o="init"></span></div>
    <div class="stat"><span class="lbl">Fort</span><span class="v" data-o="sv.fort"></span></div>
    <div class="stat"><span class="lbl">Ref</span><span class="v" data-o="sv.ref"></span></div>
    <div class="stat"><span class="lbl">Will</span><span class="v" data-o="sv.will"></span></div>
    <div class="stat"><span class="lbl">CMB / CMD</span><span class="v"><span data-o="cmb"></span> / <span data-o="cmd"></span></span></div>
    <div class="stat"><span class="lbl">Speed</span><span class="v" data-o="speed"></span></div>
  </div>

/* ---------- rules engine ---------- */
function agg(list){
  const by={};list.forEach(e=>(by[e.t]=by[e.t]||[]).push(e));
  const out={};
  for(const t in by){let tot=0;const pos={},neg={};
    for(const e of by[t]){const ty=e.ty||'untyped';
      if(e.v>=0){ if(ty==='untyped'||ty==='dodge'||ty==='circumstance') tot+=e.v; else pos[ty]=Math.max(pos[ty]||0,e.v); }
      else { if(ty==='untyped') tot+=e.v; else neg[ty]=Math.min(neg[ty]||0,e.v); } }
    for(const k in pos) tot+=pos[k]; for(const k in neg) tot+=neg[k]; out[t]=tot;}
  return out;
}
function gather(map,neg){
  const list=[],flags={},active=[];
  for(const c of ALLC){ if(!map||!map[c.id]) continue;
    active.push(c); const fx=typeof c.fx==='function'?c.fx(S):(c.fx||[]);
    fx.forEach(([t,v,ty])=>list.push({t,v,ty})); (c.fl||[]).forEach(f=>flags[f]=true); }
  if(map)(S.mitems||[]).forEach(x=>{if(x.on&&n(x.bonus)&&x.target)list.push({t:x.target,v:n(x.bonus),ty:x.type||'untyped'})});
  neg=Math.max(0,Math.floor(n(neg)));
  if(neg) ['atk','save','skill','ability','cmd'].forEach(t=>list.push({t,v:-neg}));
  const tot=agg(list);
  return {g:t=>tot[t]||0,tot,flags,active,neg};
}
const babFor=(p,l)=>p==='full'?l:p==='1/2'?Math.floor(l/2):Math.floor(l*3/4);
const saveFor=(t,l,pr)=>t==='good'?(pr?Math.floor((l+1)/2):2+Math.floor(l/2)):(pr?Math.floor((l+1)/3):Math.floor(l/3));
function levels(){const by={};let total=0;for(const c of S.classes){const l=Math.max(0,Math.floor(n(c.level)));total+=l;by[c.preset]=(by[c.preset]||0)+l}return{total,by,rogue:by.Rogue||0}}
function classSkillSet(){const s=new Set();S.classes.forEach(c=>String(c.skills||'').split(',').forEach(x=>{x=x.trim().toLowerCase();if(x)s.add(x)}));return s}
const famOf=s=>s.n.toLowerCase();
const isCS=(s,cs)=>cs.has(famOf(s))||(/^knowledge/i.test(s.n)&&cs.has('knowledge (all)'));
function conMod(){return Math.floor((n(S.ab.con.base)+n(S.ab.con.temp)-10)/2)}
const avgHD=hd=>hd/2+1;
function hpBase(){
  if(S.hp.mode!=='auto')return n(S.hp.max);
  const con=conMod();let tot=0,first=true;
  S.classes.forEach(c=>{const hd=Math.max(1,n(c.hd)||8),l=Math.max(0,Math.floor(n(c.level)));for(let i=0;i<l;i++){tot+=Math.max(1,(first?hd:avgHD(hd))+con);first=false}});
  return tot+n(S.fcbHp)+n(S.hp.misc);
}
const AC_TYPES=[['natural','Natural armor'],['deflection','Deflection'],['armor','Armor'],['shield','Shield'],['dodge','Dodge'],['insight','Insight'],['luck','Luck'],['sacred','Sacred'],['profane','Profane']];
const AC_SLOTS=['Neck','Ring','Wrists','Body','Shoulders','Head','Headband','Eyes','Belt','Hands','Feet','Slotless'];
function acItemBonuses(){const o={};(S.acItems||[]).forEach(x=>{if(!x.on)return;const v=n(x.bonus),t=x.type;if(!t||!v)return;o[t]=t==='dodge'?(o[t]||0)+v:Math.max(o[t]||0,v)});return o}
const hasFeat=re=>(S.feats||[]).some(x=>re.test(x.name||''));
const sneakDice=()=>Math.ceil(levels().rogue/2);

function compute(useC){
  const O={};const put=(k,v,signed,t)=>{O[k]={n:v,t:t!=null?t:(signed?sg(v):String(v))}};
  const M=useC?gather(S.cond,S.neg):gather(null,0);
  const L=levels();
  const ab={};
  for(const a of ABIL){const s=S.ab[a]||{};let sc=n(s.base)+n(s.temp)+M.g(a);
    if(a==='dex'&&M.flags.dexZero)sc=0; if(a==='str'&&M.flags.strZero)sc=0; sc=Math.max(0,sc);
    const mod=Math.floor((sc-10)/2);ab[a]={sc,mod};put(`ab.${a}.sc`,sc);put(`ab.${a}.mod`,mod,true);}
  let si=SIZES.indexOf(S.info.size);if(si<0)si=4;
  const szA=SZ_ATK[si];put('size',szA,true);put('sizeName',si,false,SIZES[si]);
  let bab=0;const base={fort:0,ref:0,will:0};
  S.classes.forEach(c=>{const l=Math.max(0,Math.floor(n(c.level)));bab+=babFor(c.bab,l);
    ['fort','ref','will'].forEach(s=>base[s]+=saveFor(c[s],l,!!c.prestige))});
  put('bab',bab,true);
  const iter=[];for(let b=bab,i=0;i<4&&(i===0||b>=1);i++,b-=5)iter.push(b);
  put('bab.iter',bab,false,iter.map(sg).join('/'));
  put('lvl',L.total);
  // AC: uncanny dodge (rogue 4) keeps his Dex bonus when he's flat-footed
  const uncanny=L.rogue>=4;
  const IT=acItemBonuses();
  const armorB=Math.max(n(S.armor.bonus),IT.armor||0), shieldB=Math.max(n(S.shield.bonus),IT.shield||0);
  const natT=n(S.ac.natural)+(IT.natural||0)+M.g('acNat'),defT=Math.max(n(S.ac.deflection)+(IT.deflection||0),M.g('acDefl')),othT=(IT.insight||0)+(IT.luck||0)+(IT.sacred||0)+(IT.profane||0);
  const md=String(S.armor.maxDex).trim()===''?99:n(S.armor.maxDex);
  const dexAC=Math.min(ab.dex.mod,md);
  const lose=M.flags.loseDex||(M.flags.flatFooted&&!uncanny);
  const dexUse=lose?Math.min(0,dexAC):dexAC;
  const dodge=lose?0:n(S.ac.dodge)+M.g('acDodge')+(IT.dodge||0);
  const condAC=M.g('ac');
  const common=szA+defT+othT+n(S.ac.misc)+condAC;
  const ac=10+armorB+shieldB+dexUse+natT+dodge+common;
  const touch=10+dexUse+dodge+common;
  const ff=10+armorB+shieldB+Math.min(0,dexAC)+natT+common;
  put('ac.total',ac);put('ac.touch',touch);put('ac.ff',ff);
  put('ac.armor',armorB,true);put('ac.shield',shieldB,true);put('ac.dex',dexUse,true);put('ac.dodgeT',dodge,true);put('ac.nat',natT,true);put('ac.defl',defT,true);put('ac.oth',othT+n(S.ac.misc),true);put('ac.cond',condAC,true);
  put('ac.vsMelee',ac-(M.flags.prone?4:0));put('ac.vsRanged',ac+(M.flags.prone?4:0));
  put('miss',n(S.miss),false,n(S.miss)?n(S.miss)+'%':'—');
  // init, speed (the Ward's raven wings add a fly speed)
  put('init',ab.dex.mod+n(S.init.misc)+M.g('init'),true);
  const armSpd=n(S.armor.speed);
  let spd=(armSpd>0?Math.min(armSpd,n(S.info.speed)):n(S.info.speed))+n(S.speedMisc)+M.g('speed');if(M.flags.halfSpeed)spd=Math.floor(spd/2/5)*5;
  const wings=!!(useC&&S.cond.wings);
  put('speed',spd,false,spd+' ft.'+(wings?' · fly 60':''));put('speed.land',spd,false,spd+' ft.');
  // saves
  const svA={fort:'con',ref:'dex',will:'wis'};const sv={};
  for(const s of ['fort','ref','will']){const x=S.saves[s];const cond=M.g('save')+M.g(s);
    const t=base[s]+ab[svA[s]].mod+n(x.magic)+n(x.misc)+n(x.temp)+cond;sv[s]=t;
    put(`sv.${s}`,t,true);put(`sv.${s}.base`,base[s],true);put(`sv.${s}.ab`,ab[svA[s]].mod,true);put(`sv.${s}.cond`,cond,true);}
  // CMB/CMD
  const cmbAb=ab[S.cmbAbil==='dex'?'dex':'str'].mod;
  put('cmb',bab+cmbAb-szA+n(S.cmbMisc)+M.g('atk')+M.g('cmb'),true);
  put('cmd',10+bab+ab.str.mod+dexUse+dodge-szA+defT+othT+n(S.cmdMisc)+M.g('cmd'));
  // HP
  const hpAdj=(ab.con.mod-conMod())*L.total; put('hp.adj',hpAdj,true);
  const hpMax=hpBase()+hpAdj-5*M.neg; put('hp.max',hpMax); put('hp.cur',Math.min(n(S.hp.cur),hpMax));
  put('hp.why',0,false,hpAdj||M.neg?`${hpBase()} base${hpAdj?` ${sg(hpAdj)} from Con`:''}${M.neg?` −${5*M.neg} negative levels`:''}`:'');
  put('hp.extra',0,false,[n(S.hp.temp)?`+${n(S.hp.temp)} temp`:'',n(S.hp.nl)?`${n(S.hp.nl)} nonlethal`:''].filter(Boolean).join(' · '));
  // skills
  const cs=classSkillSet(); const acp=-Math.abs(n(S.armor.acp))-Math.abs(n(S.shield.acp));
  let spent=0;
  for(const s of SKILLS){const x=S.skills[s.k]||{};const r=n(x.ranks);spent+=r;
    const isC=isCS(s,cs)||!!x.csx; const cb=isC&&r>0?3:0; const am=ab[s.a].mod;
    let other=(s.acp?acp:0)+M.g('skill')+M.g('sk.'+s.k)+((s.a==='str'||s.a==='dex')?M.g('skillStrDex'):0)+(s.a==='cha'?M.g('skillCha'):0);

    O[`sk.${s.k}`].cs=isC;}
  const tf=L.rogue?Math.max(1,Math.floor(L.rogue/2)):0;

    put('sk.perception.vp',pc,false,`${sg(pc+tf)} to find traps`);}
  const intMod=Math.floor((n(S.ab.int.base)+n(S.ab.int.temp)-10)/2);
  const avail=S.classes.reduce((a,c)=>a+Math.max(1,n(c.sp)+intMod)*Math.max(0,Math.floor(n(c.level))),0)+n(S.fcbSkill);
  put('sk.spent',spent);put('sk.avail',avail);
  // attacks
  const atkCalc=(a,offHalf)=>{const am=ab[a.abil==='str'?'str':'dex'].mod;
    const hit=bab+am+szA+n(a.enh)+n(a.misc)+M.g('atk')+(a.kind==='melee'?M.g('atkMelee'):M.g('atkRanged'));

    const db=n(a.enh)+n(a.dmgMisc)+da+M.g('dmg')+(a.kind==='melee'?M.g('dmgMelee'):M.g('dmgRanged'));
    return {hit,db,dmg:`${a.dice||'—'}${db?sg(db):''}${a.extra?' '+String(a.extra).trim():''}`};};
  S.attacks.forEach((a,i)=>{const r=atkCalc(a,false);
    const its=[];for(let b=r.hit,k=0;k<4&&(k===0||bab-5*k>=1);k++,b-=5)its.push(b);

function autoAbilities(L){
  const A=[];const add=(cls,lvl,name,ty,ds,o={})=>A.push(Object.assign({cls,lvl,name,ty,ds},o));
  const r=L.rogue;
  if(r>=1){add('Rogue',1,'Sneak Attack','Ex',`<b>${out('sneak')}</b> extra damage when the target is flanked or denied its Dex bonus to AC. Ranged sneak attacks only within 30 ft. Tick “Sneak attack” on the Attacks tab to add a box for the dice.`);
    add('Rogue',1,'Trapfinding','Ex',`${out('trapfind')} on Perception checks to find traps and on Disable Device checks. Can disarm magic traps.`);}
  if(r>=2){add('Rogue',2,'Evasion','Ex','On a successful Reflex save against an effect that deals half damage on a save, he takes no damage instead. Only in light armor or no armor.');
    add('Rogue',2,'Rogue Talents','Ex',`${Math.floor(r/2)} talents at rogue ${r}, one every even level. His are listed under Rogue Talents below.`);}
  if(r>=3)add('Rogue',3,'Trap Sense','Ex',`${out('trapsense')} on Reflex saves and a dodge bonus to AC against traps. Turn on “Against a trap” on the Conditions tab. His paper sheet says +4; the rules give +1 per three rogue levels.`);
  if(r>=4)add('Rogue',4,'Uncanny Dodge','Ex','Can’t be caught flat-footed, and keeps his Dex bonus to AC against invisible attackers. The Flat-footed card on the Conditions tab leaves his AC alone.');
  if(r>=8)add('Rogue',8,'Improved Uncanny Dodge','Ex',`Can’t be flanked, except by a rogue of at least level ${r+4}.`);
  if(r>=10)add('Rogue',10,'Advanced Talents','Ex','Can choose advanced rogue talents, such as Skill Mastery, in place of normal ones.');
  if(r>=20)add('Rogue',20,'Master Strike','Ex','A sneak attack can also put the target to sleep, paralyze it or slay it (Fort save negates), once per creature per day.');
  A.forEach(a=>{a.key=a.key||('ab.'+a.name.replace(/\W+/g,''));a.base=a.uses;const o=(S.ov||{})[ok(a.key)];
    if(a.uses&&o&&String(o.uses??'').trim()!=='')a.uses=Math.max(0,Math.floor(n(o.uses)));});
  return A.sort((a,b)=>a.lvl-b.lvl);
}

function shrink(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const OK_TYPES=['image/png','image/jpeg','image/gif','image/webp'];
async function setArt(file){

      if(!OK_TYPES.includes(file.type)||file.size>19e6){const d=await shrink(file,1600,.88);blob=await (await fetch(d)).blob();}
      const r=await assets.upload(blob,{type:blob.type||'image/jpeg'});const old=S.art&&S.art.id;S.art={id:r.id};
      if(old&&old!==r.id)assets.delete(old).catch(()=>{});
    } else { let d=await shrink(file,700,.82); if(d.length>180000)d=await shrink(file,480,.75); S.art={data:d}; }
    renderArt();scheduleSave(true);
  }catch(e){setStatus(e&&e.code==='too_large'?'That image is too large. Choose one under 20 MB.':'Couldn’t add that image. Try a PNG or JPG.')}
}

let dbRef=null,statusText='',saveTimer=null,saving=false,dirty=false,readOnly=false;
function setStatus(t){statusText=t;const el=document.getElementById('status');if(el)el.textContent=t}
function scheduleSave(now){if(readOnly)return;dirty=true;setStatus('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(flush,now?50:700)}
async function flush(){
  if(saving||!dirty)return;saving=true;dirty=false;setStatus('Saving…');
  const data=clone(S);pushLink();
  try{
    if(dbRef){await dbRef.set(data);setStatus('Saved');}
    else{setStatus(ls.set('lork-sheet',JSON.stringify(data))?'Saved in this browser':'Not saved: storage is blocked here');}
  }catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;setStatus('View only: changes aren’t saved');}
    else if(e&&e.code==='unavailable'){dirty=true;setStatus('Connection hiccup, retrying…');setTimeout(flush,1500+Math.random()*1000);}
    else{dirty=true;setStatus('Not saved. Edit any field to try again.');}
  }
  saving=false;if(dirty&&!readOnly)flush();
}
const newId=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  try{
    const [db,as]=await Promise.all([cl.use('db'),cl.use('assets').catch(()=>null)]);assets=as;
    if(db){dbRef=db.doc('sheets/lork');const snap=await dbRef.get();
      if(snap.exists&&!dirty){S=load(clone(snap.data()));render();}
      setStatus(dirty?'Unsaved changes':'Saved');if(dirty)flush();watchPartyRest(db);watchDmConds(db);pushLink();}
    else{document.getElementById('backup').hidden=false;setStatus('Edits save in this browser');}
  }catch(e){setStatus('Couldn’t load saved sheet; showing local copy')}

/* level up: snapshot before/after so the summary lists exactly what changed */
let lastSummary='';
function snap(){const C=compute(false);return{lvl:C.L.total,bab:C.bab,base:{...C.base},avail:C.O['sk.avail'].n,hp:hpBase(),sneak:sneakDice(),
  ab:autoAbilities(C.L).map(a=>a.name+(a.uses?` (${a.uses}/day)`:'')),L:C.L}}
function levelUp(){
  const $=id=>document.getElementById(id);const v=$('lu-cls').value,how=($('lu-hp')||{}).value||'avg',roll=n(($('lu-roll')||{}).value),fcb=$('lu-fcb').value;
  if(how==='roll'&&!(roll>=1)){setStatus('Enter the hit die roll first.');$('lu-roll').focus();return}
  const before=snap();let idx,added=false;
  if(v.startsWith('row:'))idx=+v.slice(4);
  else{added=true;S.classes.push(v.startsWith('preset:')?Object.assign({preset:v.slice(7),level:0},clone(PRESETS[v.slice(7)])):{preset:'Custom',level:0,name:'New class',hd:8,bab:'3/4',fort:'poor',ref:'poor',will:'good',prestige:false,sp:2,skills:''});idx=S.classes.length-1}
  const c=S.classes[idx];c.level=Math.floor(n(c.level))+1;
  const hd=Math.max(1,n(c.hd)||8);const die=how==='max'?hd:how==='roll'?Math.min(hd,Math.floor(roll)):avgHD(hd);
  if(fcb==='hp')S.fcbHp=n(S.fcbHp)+1; if(fcb==='skill')S.fcbSkill=n(S.fcbSkill)+1;
  let gain=0;
  if(S.hp.mode!=='auto'){gain=Math.max(1,die+conMod())+(fcb==='hp'?1:0);S.hp.max=n(S.hp.max)+gain;}
  const after=snap();const delta=after.hp-before.hp;S.hp.cur=n(S.hp.cur)+delta;
  (S.levelLog=S.levelLog||[]).push({row:idx,added,gain,delta,fcb});

/* attack & damage roll helper: rolls live only in this view (not saved) */
const rolls={};
function threatFrom(crit){const m=String(crit||'').match(/(\d+)\s*[–-]\s*20/);return m?+m[1]:20}
function diceIn(str){return [...String(str||'').matchAll(/(\d*)d(\d+)/g)].map(m=>[+(m[1]||1),+m[2]])}
function rollBox(key,its){const r=rolls[key]||{};
  return `<div class="roll" data-rk="${key}">
   ${its&&its.length>1?`<select data-roll="${key}.it" aria-label="Which attack">${its.map((l,k)=>`<option value="${k}"${n(r.it)===k?' selected':''}>${ORD[k]} attack ${l}</option>`).join('')}</select>`:''}
   <span class="rgrp"><label class="rf">d20 <input type="number" min="1" max="20" data-roll="${key}.d20" value="${r.d20??''}" aria-label="d20 roll"></label><span class="rres" id="ra-${key}"></span></span>
   <label class="rf critbox"><input type="checkbox" class="cs" data-roll="${key}.crit" ${r.crit?'checked':''}> Crit</label>
   <span class="rgrp"><label class="rf">Damage dice <input type="number" min="0" data-roll="${key}.dmg" value="${r.dmg??''}" aria-label="Total of weapon damage dice rolled"></label>${rolls.sneak?`<label class="rf sneakbox">Sneak <span class="snn"></span> <input type="number" min="0" data-roll="${key}.sn" value="${r.sn??''}" aria-label="Sneak attack dice total"></label>`:''}<span class="rres" id="rd-${key}"></span></span>
  </div>`}
function rollInfo(key,C){
  if(key[0]==='t'){const x=(C.twf||[])[+key.slice(1)];return x?{hit:x.hit,db:x.db,dmgT:x.dmg,crit:x.w.crit}:null}
  const i=+key.slice(1),a=S.attacks[i];if(!a||!C.O[`atk.${i}.hit`])return null;const it=n((rolls[key]||{}).it);
  return{hit:C.O[`atk.${i}.hit`].n-5*it,db:C.O[`atk.${i}.dmg`].n,dmgT:C.O[`atk.${i}.dmg`].t,crit:a.crit};
}
function updRolls(C){
  const sn=rolls.sneak?sneakDice():0;const roundDmg={};
  document.querySelectorAll('[data-rk]').forEach(el=>{const k=el.dataset.rk,info=rollInfo(k,C);if(!info)return;const r=rolls[k]||{};
    const A=document.getElementById('ra-'+k),D=document.getElementById('rd-'+k);
    if(n(r.d20)>=1){const d=Math.floor(n(r.d20)),th=threatFrom(info.crit),h=rowHit(k,C);
      A.innerHTML=`= <b>${d+info.hit}</b> to hit${h===true?' <em class="crit">HIT</em>':h===false?' <em class="miss">MISS</em>':''}${d===20?' <em class="crit">natural 20, threat: roll to confirm</em>':d===1?' <em class="miss">natural 1</em>':d>=th?' <em class="crit">threat: roll to confirm</em>':''}`;}
    else A.innerHTML=`<span class="muted">${sg(info.hit)}</span>`;
    const mult=r.crit?critMult(info.crit):1,rg=diceRange(info);
    const di=el.querySelector(`[data-roll="${k}.dmg"]`);if(di){di.max=rg.max;di.min=rg.min;di.title=`${rg.txt}: ${rg.min}–${rg.max}`}
    const sb=el.querySelector('.sneakbox');let snRoll=0;
    if(sb){sb.querySelector('.snn').textContent=`+${sn}d6`;const si=sb.querySelector('input');si.max=sn*6;si.min=sn;
      snRoll=r.sn!==''&&r.sn!=null?Math.min(sn*6,Math.floor(n(r.sn))):0;}
    if(r.dmg!==''&&r.dmg!=null){const dice=Math.floor(n(r.dmg));roundDmg[k]=Math.max(1,dice*mult+info.db+snRoll);
      D.innerHTML=`= <b>${roundDmg[k]}</b> damage${r.crit?' <em class="crit">critical</em>':''} <small class="muted">(dice ${dice}${mult>1?` ×${mult}`:''} ${sg(info.db)}${snRoll?` + sneak ${snRoll}`:''})</small>${r.capped?` <small class="miss">${esc(r.capped)}</small>`:''}`;}
    else D.innerHTML=`<span class="muted">${esc(info.dmgT)}${sn?` +${sn}d6 sneak`:''}${r.crit?` · crit: weapon dice ×${critMult(info.crit)}`:''}</span>`;});
  roundTotals(C,roundDmg);
}
/* round total: adds the damage of every attack in the sequence that has damage entered and isn't marked MISS */
function roundTotals(C,roundDmg){
  ['t'].forEach(p=>{const box=document.getElementById('rt-'+p);if(!box)return;const parts=[];let sum=0,miss=0;
    document.querySelectorAll(`[data-rk^="${p}"]`).forEach(el=>{const k=el.dataset.rk;if(rowHit(k,C)===false){miss++;return}if(roundDmg[k]==null)return;
      parts.push(`${ORD[+k.slice(1)]} ${roundDmg[k]}`);sum+=roundDmg[k];});
    box.innerHTML=`<span class="lbl">Round total</span>`+(parts.length
      ?` <b class="rtot">${sum}</b> damage from ${parts.length} hit${parts.length>1?'s':''} <small class="muted">(${parts.join(' + ')})${miss?` · ${miss} miss${miss>1?'es':''} not counted`:''}</small>`
      :` <span class="muted">Type the damage for each attack that hits and the total adds up here. Attacks marked MISS are left out.</span>`);});
}
/* true = hit, false = miss, null = unknown (no d20 yet, or no target AC entered) */
function rowHit(k,C){const info=rollInfo(k,C),r=rolls[k]||{};if(!info||!(n(r.d20)>=1))return null;const d=Math.floor(n(r.d20));
  if(d===1)return false;if(d===20)return true;if(rolls.ac===''||rolls.ac==null)return null;return d+info.hit>=n(rolls.ac)}
function critMult(c){const m=String(c||'').match(/[×x]\s*(\d)/i);return m?+m[1]:2}
/* lowest and highest the weapon's damage dice can roll (sneak attack has its own box) */
function diceRange(info){const list=diceIn(info.dmgT);return{min:list.reduce((a,[c])=>a+c,0),max:list.reduce((a,[c,s])=>a+c*s,0),txt:list.map(([c,s])=>`${c}d${s}`).join(' + ')}}

   case 'opAdd':(S.otherPotions=S.otherPotions||[]).push({name:'',qty:1,effect:'',on:'',verb:'Drink'});render();break;
   case 'opDel':S.otherPotions.splice(i,1);render();break;
   case 'clearRolls':Object.keys(rolls).forEach(k=>{if(k!=='ac'&&k!=='sneak')delete rolls[k]});render();return;
   case 'heal':{const mx=hpMaxNow();if(!amt('hpamt'))return;const bf=n(S.hp.cur);S.hp.cur=Math.min(mx,n(S.hp.cur)+amt('hpamt'));hpLog(`Healed ${S.hp.cur-bf}`);S.hp.nl=Math.max(0,n(S.hp.nl)-amt('hpamt'));render();break;}
   case 'full':{const h=longRest(true);hpLog(`Long rest, healed ${h}`);setTimeout(()=>setStatus(`Long rest: healed ${h} HP, daily uses reset`),800);render();break;}
   case 'cond':{const id=b.dataset.id;S.cond[id]=!S.cond[id];render();break;}
   case 'neg':S.neg=Math.max(0,n(S.neg)+n(b.dataset.d));render();break;
   case 'clearCond':S.cond={};S.neg=0;render();break;
   case 'artPick':document.getElementById('artfile').click();return;
   case 'artRemove':{const old=S.art&&S.art.id;S.art=false;if(old&&assets)assets.delete(old).catch(()=>{});renderArt();break;}
   default:return;
  }
  scheduleSave();});
document.getElementById('artfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)setArt(f)});
document.getElementById('importfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.info||!d.classes)throw 0;S=load(d);render();scheduleSave(true);setStatus('Backup restored')}
    catch(err){setStatus('That file isn’t a character sheet backup.')}};r.readAsText(f)});
const artEl=document.getElementById('art');
artEl.addEventListener('dragover',e=>{e.preventDefault();artEl.classList.add('drag')});
artEl.addEventListener('dragleave',()=>artEl.classList.remove('drag'));
artEl.addEventListener('drop',e=>{e.preventDefault();artEl.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)setArt(f)});

boot();
})();
</script>
