<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Drax · Pathfinder Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: persistent header (identity left, portrait top-right, stat strip below), sticky tab bar, one panel grid per tab */
:root{
  --bg:#ecebf1; --surface:#f8f7fb; --sunk:#e2e0ea; --ink:#1c1a24; --muted:#615c70; --line:#d3cfdd;
  --accent:#5a3fa0; --accent-ink:#ffffff; --accent-soft:#e2dbf4;
  --bad:#b3261e; --bad-soft:#f6dedb; --buff:#16657f; --buff-soft:#d7ecf3; --good:#2c7a4b;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --surface:#1b1824; --sunk:#16131f; --ink:#e9e6f2; --muted:#a49eb6; --line:#2e2a3b;
  --accent:#b49cf0; --accent-ink:#17121f; --accent-soft:#2c2342;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7ccbe6; --buff-soft:#173039; --good:#7fcf9b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1b1824; --sunk:#16131f; --ink:#e9e6f2; --muted:#a49eb6; --line:#2e2a3b;
  --accent:#b49cf0; --accent-ink:#17121f; --accent-soft:#2c2342;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7ccbe6; --buff-soft:#173039; --good:#7fcf9b; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.05rem;letter-spacing:.06em;color:var(--accent)}
h3{font-size:.95rem;letter-spacing:.05em}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:4.2em;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
textarea{width:100%;resize:vertical;min-height:4.5em;line-height:1.4}

/* header */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.ident{display:grid;gap:6px;min-width:0}
.namein{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;border:0;background:transparent;padding:0;width:100%;letter-spacing:.03em}
.namein:hover{background:var(--sunk)}
.sub{font-size:1.05rem;color:var(--muted)}
.sub b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{border:1px solid var(--bad);color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:1px 10px;font-size:.82rem}
.chip.buff{border-color:var(--buff);color:var(--buff);background:var(--buff-soft)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qt{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--buff);color:var(--buff);background:transparent;border-radius:999px;padding:4px 14px 4px 10px;font-weight:700;font-size:.9rem}
.qt::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor}
.qt[aria-pressed=true]{background:var(--buff);color:var(--surface)}
.qt[aria-pressed=true]::before{background:currentColor;border-color:var(--surface)}
.qt.dim{border-color:var(--accent);color:var(--accent)}
.qt.dim[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.souls{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.88rem}
details.more summary{cursor:pointer;color:var(--accent);font-size:.88rem}
details.more p{white-space:pre-line;margin:.4em 0 0;font-size:.92rem}
.ovr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:4px;font-size:.82rem;color:var(--muted)}
.ovr input[type=number]{width:3.6em}
.ovr textarea{min-height:2.4em;font-size:.88rem}
.weapon .wtop{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 18px;align-items:center}
.weapon .wname{display:grid;gap:2px;min-width:0}
.weapon .wname input{font-weight:700;font-size:1.05rem;border-color:transparent;background:transparent;padding-left:0}
.weapon .wname input:hover,.weapon .wname input:focus{border-color:var(--line);background:var(--surface);padding-left:6px}
.weapon .wstat{display:grid;text-align:right}
.weapon .wstat b{font-size:1.2rem}
.weapon .wbtns{display:flex;gap:0}
.btn:disabled{opacity:.3;cursor:default}
@media (max-width:640px){.weapon .wtop{grid-template-columns:1fr 1fr}.weapon .wname{grid-column:1/-1}.weapon .wbtns{grid-column:1/-1}.weapon .wstat{text-align:left}}
.twf{border-color:var(--accent)}
.spl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.spt td.tot{font-size:1.15rem}
.spt tr.future td{color:var(--muted)}
.splv{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.splhd{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.splhd b{font-size:1.05rem}
.prepl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:6px}
.vstog{display:grid;gap:2px;border:1px dashed var(--accent);border-radius:6px;padding:6px 10px;margin-bottom:8px}
.vsbox[hidden],.concx[hidden]{display:none}
.featpick{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px;scroll-margin-top:60px}
.featpick h3{margin:0;font-size:1.05rem}
.pbtns{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.emptog{border:1px dashed var(--accent);border-radius:6px;padding:2px 8px}
.spatk{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.spatk:first-of-type{border-top:0;padding-top:0}
#empower-rules,#ring-storing,#spell-attacks,#conc{scroll-margin-top:60px;transition:box-shadow .3s}
#empower-rules{border-color:var(--accent)}
#empower-rules.flash{box-shadow:0 0 0 3px var(--accent)}
span.pip{display:inline-block}
.prep{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 6px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:5px 6px 6px 10px;font-size:.92rem}
.prep.cast .pn{text-decoration:line-through;color:var(--muted)}
.prep .btn,.spr .btn{padding:1px 8px;font-size:.8rem}
.pd{grid-column:1/-1;font-size:.82rem;color:var(--muted);line-height:1.35}
.fxtag{color:var(--accent);font-weight:600;letter-spacing:.03em}
.splist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:6px;margin-top:6px}
.spr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px 7px 10px;font-size:.92rem}
.spr[hidden]{display:none}
.spb{font:inherit;font-size:.84rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.spb:hover:not(:disabled){border-color:var(--accent)}
.spb:disabled{opacity:.45;cursor:not-allowed}
.spb.fx{border-color:var(--accent);color:var(--accent)}
.bigchg{font-size:2.2rem;font-weight:700;line-height:1.1}
.bigchg .muted{font-size:1.1rem;font-weight:500}
.critbox{font-weight:700}
.roundtot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.rtot{font-size:1.6rem;color:var(--ink)}
.flyline{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);margin-top:2px}
.flyline .pips{margin-left:2px}
.flyline .pip{width:12px;height:12px}
.handslot{margin-top:4px}
.fv-actions{display:flex;flex-wrap:wrap;gap:8px}
#flurry-rules{scroll-margin-top:60px;border-color:var(--accent);transition:box-shadow .3s}
#flurry-rules.flash{box-shadow:0 0 0 3px var(--accent)}
.pots td{vertical-align:middle}
.pots td:first-child{min-width:16em}
.geartbl{table-layout:fixed;min-width:640px}
.geartbl .c-item{width:36%}.geartbl .c-desc{width:40%}.geartbl .c-loc{width:14%}.geartbl .c-wt{width:5.5em}.geartbl .c-x{width:2.5em}
.geartbl td input[type=text]{width:100%}
.geartbl td:first-child input{font-weight:700}
.nowrap{white-space:nowrap}
.backup{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.roll{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.88rem;padding:4px 0}
.roll select{font-size:.85rem}
.rgrp{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rf{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.rf input{width:3.6em}
.rres b{font-size:1.15rem;color:var(--ink)}
.crit{color:var(--good);font-style:normal;font-weight:700}
.miss{color:var(--bad);font-style:normal;font-weight:700}
.rollrow td{border-top:0;padding-top:0}
.rolltools{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.drbox{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:8px 10px;font-size:.88rem}
.hplog{display:grid;gap:2px;font-size:.86rem;border-top:1px solid var(--line);padding-top:6px}
.hplog div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.hplog b{color:var(--ink)}
.hplog .btn{justify-self:start}
.twftbl td.tot{font-size:1.2rem}
.twftbl tr.off td{background:var(--sunk)}
.ord{display:inline-block;min-width:2.6em;padding:1px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem}
.lvlup{border-color:var(--accent)}
.summary{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.summary h3{font-size:1.05rem}
.summary ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:3px}
.power .ty{font-size:.85rem;color:var(--muted)}
.pstats{display:flex;flex-wrap:wrap;gap:6px}
.pstats span{background:var(--sunk);border-radius:4px;padding:3px 9px;font-size:.88rem}
.pstats b{color:var(--accent);font-weight:700;margin-right:4px}
.rules p{margin:0 0 .5em;font-size:.94rem}
.spell{background:var(--sunk);border-radius:var(--r);padding:10px 12px;margin-top:6px}
.spell dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 8px;font-size:.88rem}
.spell dt{color:var(--muted)}
.spell dd{margin:0}
.spell p{white-space:pre-line;font-size:.92rem;margin:0 0 6px}
.locked{opacity:.55}
.prog tr.cur td{background:var(--accent-soft);font-weight:700}
.prog tr.future td{color:var(--muted)}
.example{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;background:var(--accent-soft);border-radius:var(--r);padding:6px 10px}
.example button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;padding:1px 8px;font-size:.8rem}

.art{width:170px;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ph{padding:12px;color:var(--muted);font-size:.85rem;display:grid;gap:6px;justify-items:center}
.art .ph svg{width:34px;height:34px;opacity:.6}
.art .tools{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;justify-content:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .15s}
.art:hover .tools,.art:focus-within .tools{opacity:1}
.art .tools button{background:rgba(255,255,255,.9);color:#1c1a24;border:0;border-radius:4px;font-size:.78rem;padding:2px 8px}
.art.drag{outline:2px dashed var(--accent);outline-offset:3px}
.art .pick{position:absolute;inset:0;background:transparent;border:0}

.strip{display:flex;flex-wrap:wrap;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:8px 14px;border-right:1px solid var(--line);display:grid;gap:0;min-width:70px;flex:1 0 auto}
.stat:last-child{border-right:0}
.stat .v{font-size:1.35rem;font-weight:500;line-height:1.2}
.hpstat{flex:3 1 220px}
.hpbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .2s}
.hpbar i.low{background:var(--bad)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:18px;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:10px 14px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:.72rem;line-height:18px;text-align:center}
.status{margin-left:auto;align-self:center;font-size:.78rem;color:var(--muted);white-space:nowrap;padding-inline:8px}

.page{display:grid;gap:18px;margin-top:18px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel>header .muted{font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:center;padding:4px 4px;white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:4px;text-align:center;border-top:1px solid var(--line);vertical-align:middle}
td.tot{font-weight:700;font-size:1.08rem;min-width:3em}
.op{color:var(--muted);font-size:.8rem;padding:0 1px}
[data-d=down]{color:var(--bad)!important}
[data-d=up]{color:var(--buff)!important}
.abtbl td:first-child{font-family:var(--f-display);font-size:1.05rem;text-align:left}
.mod{display:inline-block;min-width:2.6em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.kv label{font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 14px}
.field{display:grid;gap:2px;min-width:0}
.field input,.field select{width:100%}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3>div{background:var(--sunk);border-radius:var(--r);padding:8px 4px}
.big3 .v{font-size:1.7rem;font-weight:500;line-height:1.1}
.formula{font-size:.88rem;color:var(--muted);line-height:1.8}
.formula b{color:var(--ink)}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.note.warn{border-color:var(--bad);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 10px;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.x{border:0;background:transparent;color:var(--muted);padding:2px 6px}
.btn.x:hover{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs{width:16px;height:16px;accent-color:var(--accent)}
.skilltbl td:nth-child(2){text-align:left;white-space:nowrap}
.skilltbl input.sub{width:7.5em}
.untr{color:var(--muted);font-weight:400!important}
.counter{font-size:.9rem}
.counter b.over{color:var(--bad)}

/* abilities list */
.ab-list{display:grid;gap:0}
.ab{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ab:first-child{border-top:0}
.ab .lv{font-family:var(--f-display);color:var(--accent);font-size:.95rem;padding-top:1px}
.ab .nm{font-weight:700}
.ab .ty{font-size:.78rem;color:var(--muted);margin-left:4px}
.ab .ds{color:var(--ink);font-size:.93rem;margin-top:2px}
.pips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:8px;vertical-align:middle}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;padding:0}
.pip[aria-pressed=true]{background:var(--accent)}
.custom{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.custom .row input.nm{flex:1 1 200px;font-weight:700}

/* conditions */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.condgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.cond{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0}
.cond .n{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.cond .e{font-size:.8rem;color:var(--muted);line-height:1.3}
.cond:hover{border-color:var(--accent)}
.cond[aria-pressed=true]{border-color:var(--bad);background:var(--bad-soft)}
.cond[aria-pressed=true] .n::after{content:"ON";font-size:.68rem;letter-spacing:.08em;color:var(--bad);align-self:center}
/* overview: abilities and HP side by side, then AC and combat across the full width */
.cols2{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.actop{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:760px){.actop{grid-template-columns:1fr}}
.actop .big3 .v{font-size:2rem}
.acedit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.acedit .field input{width:100%}
@media (max-width:460px){.acedit{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acparts{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.acparts span{display:grid;justify-items:center;gap:1px;background:var(--sunk);border-radius:var(--r);padding:5px 4px}
.acparts small{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.acparts b{font-size:1.1rem}
.acparts span:first-child{background:var(--accent-soft)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr));gap:10px}
.ctile{display:grid;gap:4px;align-content:start;background:var(--sunk);border-radius:var(--r);padding:10px 12px;min-width:0}
.ctile .v{font-size:1.45rem;font-weight:600;line-height:1.15}
.ctile .rf{flex-wrap:wrap;font-size:.82rem}
.ctile select{max-width:100%;font-size:.85rem}
.ctile input[type=number]{width:3.3em;padding:2px 3px;font-size:.85rem}
.ctile .rf{gap:3px}
.cond.buffc[aria-pressed=true]{border-color:var(--buff);background:var(--buff-soft)}
.cond.buffc[aria-pressed=true] .n::after{color:var(--buff)}
.cond:disabled{opacity:.45;cursor:not-allowed}
.cond:disabled .n::after{content:"IMMUNE";font-size:.68rem;letter-spacing:.08em;color:var(--muted);align-self:center}
.net{display:grid;gap:4px}
.net div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:4px}
.net .neg{color:var(--bad);font-weight:700}
.net .pos{color:var(--buff);font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:4px}

/* companion statblock */
.block{display:grid;gap:4px}
.block .bar{font-family:var(--f-display);letter-spacing:.08em;font-size:.82rem;border-bottom:1.5px solid var(--accent);color:var(--accent);margin-top:8px;padding-bottom:2px}
.block p{margin:0;font-size:.95rem}
.block b{font-weight:700}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:.92rem}
.hpctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hpctl input{width:4.5em}

@media (max-width:640px){
  .art{width:104px}
  .stat{padding:6px 10px;min-width:60px}
  .stat .v{font-size:1.15rem}
  .head{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function sorcRow(L){const r=[null];for(let s=1;s<=9;s++){const st=s===1?1:2*s;if(L<st)break;r.push(L>=20?6:Math.min(6,3+(L-st)))}return r}
function slotRow(tbl,L){if(L<1)return [];L=Math.min(20,L);return tbl==='sorc'?sorcRow(L):((SPT[tbl]||[])[L-1]||[])}
const abScore=a=>n(S.ab[a].base)+n(S.ab[a].temp);
const abMod=a=>Math.floor((abScore(a)-10)/2);
function casterRows(){
  return S.classes.map(c=>({c,cast:CAST[c.preset]||c.cast,L:Math.max(0,Math.floor(n(c.level)))})).filter(x=>x.cast&&x.L>0).map(x=>{
    const ab=abScore(x.cast.abil),mod=Math.floor((ab-10)/2),row=slotRow(x.cast.tbl,x.L),key=x.c.preset;const lv=[];
    for(let s=0;s<row.length;s++){const base=row[s];
      if(s===0){lv.push({s,base});continue}
      const can=base!=null&&ab>=10+s;const bonus=can?(mod>=s?Math.floor((mod-s)/4)+1:0):0;const adj=n(getP(`spells.${key}.adj.${s}`));
      lv.push({s,base,bonus,adj,can,total:can?Math.max(0,base+bonus+adj):0,dc:10+s+mod});}
    const cl=x.cast.tbl==='four'?Math.max(0,x.L-3):x.L;

  if(sf&&w>=7){

    add(C,7,'Blessed Fortitude (Sacred Fist)','Ex','If he succeeds on a Fortitude save against an effect that has a reduced effect on a successful save, he avoids the effect entirely.');
  }
  if(sf&&w>=9)add(C,9,'Miraculous Fortitude (Sacred Fist)','Ex','Even when he fails a Fortitude save against such an effect, he takes only the reduced effect.');
  if(w>=10)add(C,10,'Major Blessings','Su','Gains the major blessing power of both his blessings.');
  if(w>=20)add(C,20,'Aspect of War','Su','Once per day as a swift action, channels an aspect of war for 1 minute (see the Advanced Class Guide).');
}

    for(let i=0;i<mainN;i++){flurry.push(mk(i?`Flurry, −${5*i}`:'Flurry',top-5*i));
      if(i<extra)flurry.push(mk(i?`Extra attack, −${5*i}`:'Extra attack',top-5*i));

    {const ff=featMods(fA,bab).ff;if(ff&&flurry.length)flurry[0].hit+=ff;}
    flurry.forEach((x,j)=>{put(`fl.${j}.hit`,x.hit,true);put(`fl.${j}.dmg`,x.db,false,x.dmg)});}
  // class-ability numbers
  put('sneak',Math.ceil(L.rogue/2),false,`+${Math.ceil(L.rogue/2)}d6`);
  const dco=(k,v)=>{const o=(S.ov||{})[ok(k)];return o&&String(o.dc??'').trim()!==''?n(o.dc):v};
  put('dc.illusion',dco('sd.illusion',11+ab.cha.mod));put('dc.call',dco('sd.call',(L.sd>=10?17:14)+ab.cha.mod));put('dc.power',dco('sd.power',15+ab.cha.mod));
  put('trapsense',Math.floor(L.rogue/3),true);put('trapfind',Math.max(1,Math.floor(L.rogue/2)),true);

function compCompute(O,put,P,useC){
  const M=useC?gather(S.comp.cond,S.comp.neg,'comp'):gather({},0,'comp');
  let dex=14+M.g('dex'); if(M.flags.dexZero)dex=0; const dm=Math.floor((dex-10)/2), wm=1, chm=2, im=-2;
  put('c.dex',dex);put('c.dexm',dm,true);
  const defl=Math.max(1,chm);
  const lose=M.flags.loseDex||M.flags.flatFooted;
  const dexU=lose?Math.min(0,dm):dm, dodge=lose?0:1+M.g('acDodge');
  const ca=M.g('ac');
  const ac=10+dexU+defl+dodge+ca+(M.flags.mageArmor?4:0)+(M.flags.shieldSpell?4:0);
  put('c.ac',ac);put('c.touch',10+dexU+defl+dodge+ca);put('c.ff',10+Math.min(0,dm)+defl+ca+(M.flags.mageArmor?4:0)+(M.flags.shieldSpell?4:0));
  const hpMax=Math.max(1,Math.floor(P.hpMax/2))-5*M.neg; put('c.hpmax',hpMax); put('c.hp',Math.max(-99,hpMax-n(S.comp.dmg)));
  put('c.hpsrc',Math.floor(P.hpMax/2));
  put('c.bab',P.bab,true);
  const f=P.base.fort+chm+M.g('save')+M.g('fort'), r=P.base.ref+dm+M.g('save')+M.g('ref'), w=P.base.will+wm+M.g('save')+M.g('will');
  put('c.fort',f,true);put('c.ref',r,true);put('c.will',w,true);
  put('c.bfort',P.base.fort,true);put('c.bref',P.base.ref,true);put('c.bwill',P.base.will,true);
  put('c.init',dm+M.g('init'),true);
  const hit=P.bab+dm+M.g('atk')+M.g('atkMelee');const its=[];for(let b=hit,k=0;k<4&&(k===0||P.bab-5*k>=1);k++,b-=5)its.push(b);
  put('c.touchatk',hit,true,its.map(sg).join('/'));
  put('c.cmb',P.bab+dm+M.g('atk')+M.g('cmb'),true);
  put('c.cmd',10+P.bab+dexU+dodge+defl+M.g('cmd'));
  let spd=40+M.g('speed');if(M.flags.halfSpeed)spd=Math.floor(spd/10)*5;put('c.speed',spd,false,`fly ${spd} ft. (good)`);
  const light=S.comp.light==='dim'?4:S.comp.light==='bright'?-4:0;const sk=M.g('skill');
  put('c.fly',9+dm+sk+M.g('skillStrDex'),true);put('c.perc',7+wm+sk,true);put('c.stealth',6+dm+light+sk+M.g('skillStrDex'),true);
  put('c.status',0,false,!P.L.sd||P.L.sd<3?'Locked':S.comp.status==='active'?'Active':S.comp.status==='dismissed'?'Dismissed':'Destroyed');
}

function autoAbilities(L){
  const A=[];const add=(cls,lvl,name,ty,ds,o={})=>A.push(Object.assign({cls,lvl,name,ty,ds},o));
  const r=L.rogue,d=L.sd;
  if(r>=1){add('Rogue',1,'Sneak Attack','Ex',`Deals ${out('sneak')} extra damage when the target is flanked or denied its Dex bonus to AC. Ranged sneak attacks only within 30 ft.`);
    add('Rogue',1,'Trapfinding','Ex',`Adds ${out('trapfind')} to Perception checks to find traps and to Disable Device checks. Can disarm magic traps.`);}
  if(r>=2||d>=2)add(r>=2?'Rogue':'Shadowdancer',r>=2?2:2,'Evasion','Ex','On a successful Reflex save against an effect that deals half damage on a save, she takes no damage instead. Only in light armor or no armor.');
  if(r>=3)add('Rogue',3,'Trap Sense','Ex',`${out('trapsense')} on Reflex saves and a dodge bonus to AC against traps.`);
  if(uncannyFrom(L)){const imp=L.rogue>=8||L.sd>=5||(L.rogue>=4&&L.sd>=2);
    add(L.rogue>=4?'Rogue':'Shadowdancer',L.rogue>=4?4:2,'Uncanny Dodge','Ex','Can’t be caught flat-footed and keeps her Dex bonus to AC against invisible attackers. The flat-footed condition on the Conditions tab respects this.');
    if(imp)add('Shadowdancer',L.sd>=5?5:2,'Improved Uncanny Dodge','Ex',`Can’t be flanked except by a rogue of at least level ${out('impud')}. Rogue and shadowdancer levels stack for this.`);}
  if(r>=10)add('Rogue',10,'Advanced Talents','Ex','Can choose advanced rogue talents in place of normal ones.');
  if(d>=1)add('Shadowdancer',1,'Hide in Plain Sight','Su','Can use Stealth while observed, with nothing to hide behind, as long as she is within 10 ft. of dim light. She can’t hide in her own shadow.');
  if(d>=2)add('Shadowdancer',2,'Darkvision','Ex','Gains darkvision 60 ft. If she already has darkvision, its range increases by 30 ft. (drow 120 ft. + 30 = 150 ft.).');
  if(d>=3)add('Shadowdancer',3,'Shadow Illusion','Sp',`Creates visible illusions from shadows, as <i>silent image</i>. Caster level ${d}. Will DC ${out('dc.illusion')}.`,{key:'sd.illusion',uses:Math.floor(d/2)});
  if(d>=3)add('Shadowdancer',3,'Summon Shadow','Su','Summons a shadow companion that shares her alignment and can’t create spawn. See the Shadow Companion tab.');
  if(d>=4)add('Shadowdancer',4,'Shadow Call','Sp',`Creates creatures and effects from raw shadow, as <i>${d>=10?'greater shadow conjuration':'shadow conjuration'}</i>. Caster level ${d}. Will DC ${out('dc.call')}.`,{key:'sd.call',uses:1+Math.floor((d-4)/2)});
  if(d>=4){const ft=d>=10?320:d>=8?160:d>=6?80:40;add('Shadowdancer',4,'Shadow Jump','Su',`Travels between shadows as <i>dimension door</i>, both ends in dim light. ${ft} ft. per day in 10-ft. increments (one pip per 10 ft.).`,{key:'sd.jump',uses:ft/10});}
  if(d>=5)add('Shadowdancer',5,'Defensive Roll','Ex','Once per day, when a blow would drop her to 0 hp or less, she can attempt a Reflex save (DC = damage dealt) to take half damage. Must be aware of the attack.',{key:'sd.roll',uses:1});
  if(d>=7)add('Shadowdancer',7,'Slippery Mind','Ex','If she fails a save against an enchantment, she gets a second save one round later.');
  if(d>=8)add('Shadowdancer',8,'Shadow Power','Sp',`Uses shadow to deal damage, as <i>shadow evocation</i>. Caster level ${d}. Will DC ${out('dc.power')}.`,{key:'sd.power',uses:1+Math.floor((d-8)/2)});
  if(d>=10){add('Shadowdancer',10,'Improved Evasion','Ex','Takes half damage even on a failed Reflex save.');
    add('Shadowdancer',10,'Shadow Master','Su','In dim light: DR 10/— and +2 luck bonus on saves. Her critical hits blind the target for 1d6 rounds. Use the “In dim light” toggle at the top to apply the save bonus.',{key:'sd.master'});}
  const talents=[r>=2?Math.floor(r/2):0,[3,6,9].filter(x=>d>=x).length];
  if(talents[0]+talents[1]) add('Rogue / Shadowdancer',Math.min(r>=2?2:99,d>=3?3:99),'Rogue Talents','Ex',`She has ${talents[0]+talents[1]} rogue talents (${talents[0]} from rogue, ${talents[1]} from shadowdancer). Record them under Talents below.`);
  wpAbilities(add,L);
  A.forEach(a=>{a.key=a.key||('ab.'+a.name.replace(/\W+/g,''));a.base=a.uses;const o=(S.ov||{})[ok(a.key)];a.dc=/sd\.(illusion|call|power)/.test(a.key);
    if(a.uses&&o&&String(o.uses??'').trim()!=='')a.uses=Math.max(0,Math.floor(n(o.uses)));});
  return A.sort((a,b)=>a.lvl-b.lvl);
}

  text:'Creates the visual illusion of an object, creature, or force, as visualized by the caster. The illusion makes no sound, smell, texture, or temperature. The caster can move the image within the limits of the effect’s size.'},

  text:'Uses material from the Plane of Shadow to shape quasi-real illusions of creatures, objects, or forces. It can mimic any sorcerer or wizard conjuration (summoning) or conjuration (creation) spell of 3rd level or lower. Shadow conjurations are actually one-fifth (20%) as strong as the real things, but creatures who believe them are affected at full strength.\n\nAny creature that interacts with the spell can make a Will save to recognize its true nature. Damaging spells have normal effects unless the creature succeeds on that save; a disbeliever takes only one-fifth (20%) damage, and any special effect other than damage is only 20% likely to occur. Whatever the result of the disbelief save, the creature also gets any save the mimicked spell allows, but the DC uses shadow conjuration’s level (4th). Effects created this way allow spell resistance even if the mimicked spell doesn’t.\n\nShadow objects and substances work normally except against disbelievers, against whom they are 20% likely to work.\n\nA shadow creature has one-fifth the hit points of a normal creature of its kind, whether or not it’s recognized as shadowy. It deals normal damage and has all normal abilities and weaknesses. Against a creature that recognizes it as a shadow, its damage is one-fifth (20%), its special abilities that don’t deal lethal damage are only 20% likely to work (roll for each use and each target), and its AC bonuses are one-fifth as large.\n\nA creature that succeeds on its save sees the shadow conjurations as transparent images over vague, shadowy forms. Objects automatically succeed on their Will saves.\n\nTypical choices: summon monster I–III, grease, mage armor, obscuring mist, glitterdust, web, acid arrow, sleet storm, stinking cloud.'},

  return {w:wT,bab:Math.max(realBab,wT),realBab,fl:Math.max(0,wT-3),ab:Object.fromEntries(ABIL.map(a=>[a,C.ab[a].sc])),rk:k=>n((S.skills[k]||{}).ranks)}}
function featUnmet(f,Q){const r=f.req||{},u=[];
  (r.feats||[]).forEach(x=>{if(!hasFeatName(x))u.push(x)});
  if(r.bab&&Q.bab<r.bab)u.push(`BAB +${r.bab}`);
  if(r.fl&&Q.fl<r.fl)u.push(`fighter level ${r.fl} (counts as ${Q.fl})`);
  ABIL.forEach(a=>{if(r[a]&&Q.ab[a]<r[a])u.push(`${ABN[a]} ${r[a]} (has ${Q.ab[a]})`)});
  Object.entries(r.ranks||{}).forEach(([k,[v,lab]])=>{if(Q.rk(k)<v)u.push(`${lab} ${v} ranks (has ${Q.rk(k)})`)});

    </div>`}).join('');
  return `<section class="panel"><header><h2>${prep?'Prepared Spells':'Spells Known'}</h2><span class="muted">Slots set by ${esc(r.name)} level ${r.L} and ${ABN[r.cast.abil]} ${r.ab}</span><button class="btn" data-act="spClear" data-k="${r.key}" style="margin-left:auto">Clear prepared</button></header>

}

/* ---------- spell attacks: Spiritual Weapon and Spiritual Ally attack with his BAB + Wisdom ---------- */
function spellAtks(C){
  const cl=spCL(),wis=C.ab.wis.mod,sa=S.spAtk||{};const its=[];for(let b=C.bab,i=0;i<4&&(i===0||b>=1);i++,b-=5)its.push(b);
  const fl=Math.min(5,Math.floor(cl/3));
  const mk=(dmg,crit,emp)=>its.map(b=>({bab:b,hit:b+wis,db:fl,xf:0,dmg,crit,emp:!!emp&&hasEmpower()}));
  return {cl,wis,fl,its,h:mk('1d8',sa.wCrit||'20/×3',sa.hEmp),y:mk('1d10','20/×2',sa.yEmp)};
}
function prepStatus(nm){let tot=0,ready=0;Object.values(S.spells||{}).forEach(sp=>Object.values(sp.prep||{}).forEach(P=>P.forEach(p=>{if(p.n===nm){tot++;if(!p.c)ready++}})));
  const inRing=((S.ring||{}).stored||[]).filter(x=>x.n===nm).length;
  return tot||inRing?[tot?`${ready} of ${tot} prepared ready`:'',inRing?`${inRing} in his ring`:''].filter(Boolean).join(' · '):'not prepared today'}
function spellAtkPanel(C){

   <p class="formula">Damage = ${die} force + ${X.fl} (1 per 3 caster levels: CL ${X.cl} ÷ 3 = ${Math.floor(X.cl/3)}, max +5)${list[0].emp?' then <b>× 1½</b> (Empowered)':''}</p>

   ${list.map((x,j)=>`<tr><td><span class="ord">${ORD[j]}</span></td><td class="tot">${sg(x.hit)}</td><td class="l">${die}${sg(x.db)} force${x.emp?' × 1½':''}</td></tr><tr class="rollrow"><td></td><td colspan="2" class="l">${rollBox(p+j)}</td></tr>`).join('')}
   </tbody></table></div><div class="roundtot" id="rt-${p}"></div></div>`;
  return `<section class="panel twf" id="spell-attacks"><header><h2>Spell Attacks</h2><span class="muted">Spiritual Weapon and Spiritual Ally use his BAB + Wisdom</span>${rollTools()}</header>
   ${blk('h',X.h,esc(sa.wName||'Spiritual Weapon'),'Spiritual Weapon','1d8',sa.wCrit||'20/×3')}
   <div class="row">${field('Weapon shape',txt('spAtk.wName',{w:'16em',rr:1,label:'Spiritual weapon shape'}))}${field('Critical (as a real weapon of that shape)',txt('spAtk.wCrit',{w:'6em',rr:1,label:'Spiritual weapon critical'}))}</div>
   ${blk('y',X.y,'Spiritual Ally','Spiritual Ally','1d10','20/×2')}
   <div class="rules">
    <p><b>Spiritual Weapon</b> (2nd level · medium range · 1 round/level): a weapon of force shaped like his god’s weapon. It attacks once in the round he casts it, then on each of his turns after that with his BAB + Wisdom, which gives it ${X.its.length} attacks (${X.h.map(x=>sg(x.hit)).join(' / ')}). Sending it at a new target is a move action. It strikes as a spell, so damage reduction doesn’t stop it and it hits incorporeal foes. It can’t flank, can’t be attacked, and dispel magic can end it. If it goes out of range or he stops directing it, it flies back and hovers by him.</p>

/* ---------- Ring of Spell Storing: up to 5 spell levels, stays filled through rests ---------- */
const RING_MAX=5;
const ringUsed=()=>((S.ring||{}).stored||[]).reduce((a,x)=>a+n(x.lv),0);
const ringRoom=()=>RING_MAX-ringUsed();
function ringStoreFrom(k,s,i){const P=prepOf(k,s),p=P[i];if(!p||p.c||s<1||s>ringRoom())return false;
  p.c=true;S.used[`sp.${k}.${s}`]=P.filter(x=>x.c).length;
  (S.ring=S.ring||{stored:[]}).stored=S.ring.stored||[];S.ring.stored.push({n:p.n,lv:s,emp:!!p.emp,src:S.info.name||'Drax'});return true}
function ringPanel(){
  const R=S.ring=S.ring||{stored:[]};R.stored=R.stored||[];const used=ringUsed(),room=RING_MAX-used;
  const opts=[];Object.entries(S.spells||{}).forEach(([k,sp])=>Object.entries(sp.prep||{}).forEach(([s,P])=>{s=+s;P.forEach((p,i)=>{if(s>0&&!p.c&&s<=room)opts.push([`${k}|${s}|${i}`,`${p.emp?'Empowered ':''}${p.n} (${lvName(s)} slot)`])})}));
  return `<section class="panel" id="ring-storing"><header><h2>Ring of Spell Storing</h2><span class="muted">${used} / ${RING_MAX} spell levels stored · ${room} free</span></header>
   <div class="pips" style="margin:0" role="img" aria-label="${used} of ${RING_MAX} spell levels stored">${Array.from({length:RING_MAX},(_,i)=>`<span class="pip" aria-pressed="${i<used}"></span>`).join('')}</div>
   ${R.stored.length?`<div class="prepl">${R.stored.map((x,i)=>{const f=fxForSpell(x.n),d=spDesc(x.n);return `<div class="prep"><span class="pn">${x.emp?'Empowered ':''}${esc(x.n)} <small class="muted">${n(x.lv)} level${n(x.lv)===1?'':'s'}${x.src?` · from ${esc(x.src)}`:''}</small>${f?' <small class="fxtag">BUFF</small>':''}</span><span class="pbtns"><button class="btn pri" data-act="ringCast" data-i="${i}">Cast from ring</button><button class="btn x" data-act="ringDel" data-i="${i}" aria-label="Discard ${esc(x.n)}">✕</button></span>${d?`<span class="pd">${esc(d)}${x.emp?' <b>Empowered:</b> rolled numbers ×1½.':''}</span>`:''}</div>`}).join('')}</div>`:'<p class="muted" style="margin:0">The ring is empty.</p>'}
   <div class="row"><label class="rf">Cast a prepared spell into it <select id="ring-pick" aria-label="Prepared spell to store">${opts.length?opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join(''):`<option value="">${room?'No ready prepared spell fits':'Ring is full'}</option>`}</select></label><button class="btn pri" data-act="ringStore"${opts.length?'':' disabled'}>Store (uses that slot)</button></div>
   <div class="row"><label class="rf">Or from a scroll or another caster <input type="text" id="ring-name" list="ring-all" placeholder="Spell name" style="width:12em"></label><datalist id="ring-all">${Object.values(WP_SPELLS).flat().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label class="rf">Level <input type="number" id="ring-lvl" min="1" max="${Math.max(1,room)}" value="1" style="width:3.6em"></label><button class="btn" data-act="ringAdd"${room<1?' disabled':''}>Add</button></div>
   <div class="rules">
    <p><b>Ring of Spell Storing</b> <span class="muted">(ring slot · 50,000 gp)</span>: holds up to five levels of spells that the wearer can cast. Any spellcaster can cast spells into it, as long as the total stays at 5 levels or less. A metamagic spell takes up space equal to its modified level, so an Empowered 2nd-level spell uses 4. A spell can also be put in from a scroll.</p>
    <p>The wearer always knows which spells are inside. Casting a stored spell takes that spell’s casting time (at least a standard action) and needs no components or focus. Once cast, it’s gone until someone casts a new spell in. Stored spells stay through rests. Storing one of his prepared spells uses up that slot for the day, just as casting it would.</p>
    <p class="muted">The item text gives a stored spell the lowest caster level that can cast it. Many GMs let a spell he puts in himself keep his own caster level (${spCL()}), so check with your GM. He can normally wear only two magic rings at once.</p>
   </div></section>`;
}

/* ---------- Empower Spell: rules and examples with his numbers (Gear & Notes) ---------- */
function empowerNotes(){
  if(!hasEmpower())return '';
  const cl=spCL(),avg=(c,s)=>c*(s+1)/2;
  const ex=[
   ['Cure Moderate Wounds',2,2,8,Math.min(10,cl),'healing'],
   ['Cure Serious Wounds',3,3,8,Math.min(15,cl),'healing'],
   ['Cure Critical Wounds',4,4,8,Math.min(20,cl),'healing'],
   ['Spiritual Weapon',2,1,8,Math.min(5,Math.floor(cl/3)),'damage per hit'],
   ['Aid',2,1,8,Math.min(10,cl),'temporary HP'],
   ['Searing Light (vs. undead)',3,Math.min(10,cl),6,0,'damage'],
  ];
  const row=([nm,lv,c,s,fl,what])=>{const a=avg(c,s)+fl;return `<tr><td class="l">${nm}</td><td>${ORD[lv-1]} → <b>${ORD[lv+1]}</b></td><td class="l">${c}d${s}${fl?` + ${fl}`:''} ${what}</td><td class="l">(${c}d${s}${fl?` + ${fl}`:''}) × 1½</td><td>${a} → <b>${Math.floor(a*1.5)}</b></td></tr>`};
  return `<section class="panel" id="empower-rules"><header><h2>Empower Spell: Rules &amp; Breakdown</h2><span class="muted">Metamagic feat · numbers use his caster level ${cl}</span>
     <button class="btn" data-act="tab" data-t="spells" style="margin-left:auto">Back to Spells</button></header>
   <div class="rules">
    <p><b>What it does:</b> every rolled number in the spell is 50% bigger. Roll the spell normally, then multiply the result by 1½ and round down. The flat part that goes with the roll counts too, like the + caster level on a cure spell.</p>
    <p><b>What it doesn’t change:</b> save DCs, opposed rolls, and anything that isn’t rolled. Shield of Faith, Divine Favor, Divine Power’s bonus, Bull’s Strength and Prayer give the same bonus either way, so empowering them wastes the slot.</p>
    <p><b>The cost:</b> an empowered spell uses a slot <b>two levels higher</b> than the spell’s real level. A 1st-level spell goes in a 3rd-level slot, a 2nd in a 4th, a 3rd in a 5th and a 4th in a 6th. His highest slot is 6th, so 5th- and 6th-level spells can’t be empowered.</p>
    <p><b>Preparing:</b> as a prepared caster he picks which spells are empowered when he prepares them each day, and the spell keeps its normal casting time. Fervor can still quick-cast an empowered spell on himself.</p>
    <p><b>Other details:</b> a spell can only be empowered once. Empowered and Maximized together (his Maximize Metamagic Rod) gives the maximum result plus half of a normal roll. In the Ring of Spell Storing, an empowered spell takes up its higher slot level.</p>
   </div>
   <div class="scroll"><table class="twftbl"><thead><tr><th class="l">Example spell</th><th>Slot</th><th class="l">Normal</th><th class="l">Empowered</th><th>Average</th></tr></thead><tbody>
    ${ex.map(row).join('')}
   </tbody></table></div>
   <p class="note">Averages are before the × 1½ and after, rounded down. Caps from his caster level are already applied (for example cure serious wounds adds at most +15).</p>
  </section>`;
}
function spellFxPanel(){

   <div class="row" style="gap:6px 18px"><span>AC <b data-o="ac.total"></b></span><span>Touch <b data-o="ac.touch"></b></span><span>Flat-footed <b data-o="ac.ff"></b></span><span>Fort <b data-o="sv.fort"></b></span><span>Ref <b data-o="sv.ref"></b></span><span>Will <b data-o="sv.will"></b></span><span>CMD <b data-o="cmd"></b></span></div>

function flurryBreakdown(){

  const L=C.L,w=L.by.Warpriest||0,flBab=C.O.flbab?C.O.flbab.n:C.bab;if(!a||!F.length)return '';
  const M=C.M,abil=a.abil==='str'?'str':'dex',am=C.ab[abil].mod,szA=C.O.size.n,enh=n(a.enh),misc=n(a.misc);
  const souls=a.soulsMax?Math.min(n(a.soulsMax),n(a.souls)):0;
  const cond=M.g('atk')+(a.kind==='melee'?M.g('atkMelee'):M.g('atkRanged'));
  const fm=featMods(a,C.bab);const fixed=-2+am+szA+enh+misc+souls+cond+fm.hit;const ftH=j=>fm.hit+(j===0?fm.ff:0);
  const atkFx=M.active.filter(c=>{const fx=typeof c.fx==='function'?c.fx(S):(c.fx||[]);return fx.some(f=>/^atk/.test(f[0]))||c.size}).map(cname);
  const dmgFx=M.active.filter(c=>{const fx=typeof c.fx==='function'?c.fx(S):(c.fx||[]);return fx.some(f=>f[0]==='dmg')}).map(cname);
  const strDmg=a.dmgAbil==='str'?C.ab.str.mod:0,dCond=M.g('dmg'),r0=F[0];

  const baseDie=a.sacredDice&&w?sacredDie(w):a.dice;
  const extraN=1+(w>=8?1:0)+(w>=15?1:0),iters=[];for(let b=flBab,k=0;k<4&&(k===0||b>=1);k++,b-=5)iters.push(b);
  const sgn=v=>v?sg(v):'+0';
  return `<section class="panel" id="flurry-rules"><header><h2>Flurry of Blows: Rules &amp; Breakdown</h2><span class="muted">How every number on the Attacks tab is built · updates live</span>

    <p><b>The monk ability it points to</b> <span class="muted">(Core Rulebook, monk)</span>: As a full-attack action, the monk makes one additional attack, using any mix of unarmed strikes and special monk weapons, as if he had the Two-Weapon Fighting feat (even without its prerequisites). At 8th level he makes two additional attacks, as if he had Improved Two-Weapon Fighting, and at 15th level three, as if he had Greater Two-Weapon Fighting. He adds his full Strength bonus to damage on every flurry attack, off-hand or not. He can swap in disarm, sunder and trip maneuvers for unarmed attacks. Only unarmed strikes and monk weapons can be used, and natural attacks can’t be added. For these attacks a monk treats his base attack bonus from monk levels as equal to his monk level.</p>
    <p><b>What the Sacred Fist exception changes:</b> that last rule doesn’t apply. Drax flurries with his normal warpriest base attack bonus (¾ of his level), not his warpriest level. Everything else works like the monk’s flurry.</p>

   <div class="kv">

    <label>Enhancement</label><span><b>${sgn(enh)}</b>${a.id==='unarmed'?' (Amulet of Mighty Fists)':''}</span>

   </tbody></table></div>
   <div class="kv">

    <label>Damage bonus</label><span><b>${sgn(strDmg+enh+n(a.dmgMisc)+dCond+fm.dmg)}</b> = Str ${sgn(strDmg)} (full Strength on every flurry attack) ${sgn(enh)} enhancement${n(a.dmgMisc)?` ${sg(n(a.dmgMisc))} other`:''}${dCond?` ${sg(dCond)} (${dmgFx.map(esc).join(', ')})`:''}${fm.dmg?` ${sg(fm.dmg)} (${fm.dparts.map(esc).join(', ')})`:''}</span>

   </div>
   <div class="rules">
    <p><b>Why there are ${F.length} attacks:</b> his base attack bonus of ${sg(flBab)} gives ${iters.length} normal attacks (${iters.map(sg).join(', ')}). Flurry adds ${extraN} extra attack${extraN>1?'s':''}, paired with the first ${Math.min(extraN,iters.length)} of those, all at −2${fl.ki?'. Spending 1 ki adds one more at his highest bonus':''}${M.active.some(c=>c.id==='haste')?'. Haste adds one more at his highest bonus':''}.</p>

function artSrc(){if(!S.art)return typeof DEFAULT_ART==='string'?DEFAULT_ART:null;if(S.art.none)return null;if(S.art.url)return S.art.url;if(S.art.id)return '/_blob/'+S.art.id;return S.art.data||null}

function shrink(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const OK_TYPES=['image/png','image/jpeg','image/gif','image/webp'];
async function setArt(file){
  if(!file||!/^image\//.test(file.type)){setStatus('Choose an image file (PNG, JPG, GIF or WebP).');return}
  setStatus('Adding art…');
  try{
    if(assets){let blob=file;
      if(!OK_TYPES.includes(file.type)||file.size>19e6){const d=await shrink(file,1600,.88);blob=await (await fetch(d)).blob();}
      const r=await assets.upload(blob,{type:blob.type||'image/jpeg'});const old=S.art&&S.art.id;S.art={id:r.id};
      if(old&&old!==r.id)assets.delete(old).catch(()=>{});
    } else { let d=await shrink(file,700,.82); if(d.length>180000)d=await shrink(file,480,.75); S.art={data:d}; }
    renderArt();scheduleSave(true);
  }catch(e){setStatus(e&&e.code==='too_large'?'That image is too large. Choose one under 20 MB.':'Couldn’t add that image. Try a PNG or JPG.')}
}

let dbRef=null,statusText='',saveTimer=null,saving=false,dirty=false,readOnly=false;
function setStatus(t){statusText=t;const el=document.getElementById('status');if(el)el.textContent=t}
function scheduleSave(now){if(readOnly)return;dirty=true;setStatus('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(flush,now?50:700)}
async function flush(){
  if(saving||!dirty)return;saving=true;dirty=false;setStatus('Saving…');
  const data=clone(S);pushLink();
  try{
    if(dbRef){await dbRef.set(data);setStatus('Saved');}
    else{setStatus(ls.set(CHAR+'-sheet',JSON.stringify(data))?'Saved in this browser':'Not saved: storage is blocked here');}
  }catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;setStatus('View only: changes aren’t saved');}
    else if(e&&e.code==='unavailable'){dirty=true;setStatus('Connection hiccup, retrying…');setTimeout(flush,1500+Math.random()*1000);}
    else{dirty=true;setStatus('Not saved. Edit any field to try again.');}
  }
  saving=false;if(dirty&&!readOnly)flush();
}
let migrated=false;
const newId=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(d){
  if(!d)return clone(DEFAULT);
  const s=merge(DEFAULT,d);
  (s.attacks||[]).forEach(a=>{if(!a.id)a.id=newId()});
  if((d.v||1)<2){migrated=true;
    /* v2: Thermo-Gloves become a button; fly uses move to the Speed box */
    s.attacks.forEach(a=>{if(a.id==='unarmed'){a.extra=String(a.extra||'').replace(/\+\s*2 cold\s*\+\s*2 fire/i,'').trim();a.thermo=true;a.notes=DEFAULT.attacks[0].notes}});
    (s.talents||[]).forEach(t=>{if(/winged boots/i.test(t.name||'')){t.uses=0;t.desc=DEFAULT.talents[0].desc}});
    if(typeof s.atkNotes==='string')s.atkNotes=s.atkNotes.replace(/\nThermo-Gloves add[^\n]*/,'')+'\nThermo-Gloves (button under Ability Scores): +2 cold and +2 fire on unarmed strikes, but his Strength drops to his base 16.\nTitan-Stone Knuckles (button under Ability Scores): Strength fixed at 28.';
    s.v=2;}
  if((d.v||1)<3){migrated=true;
    /* v3: the +10 Str was the Titan-Stone Knuckles (fixed 26); unarmed damage from the sacred weapon chart; potions get their own table */
    if(n(s.ab.str.temp)===10)s.ab.str.temp=0;
    if(s.hands!=='thermo')s.hands='titan';
    s.attacks.forEach(a=>{if(a.id==='unarmed'||a.id==='knuckles'){a.sacredDice=true;a.dice='2d6'}});
    if(typeof s.atkNotes==='string')s.atkNotes=s.atkNotes.replace(/Strength fixed at 28/g,'Strength fixed at 26').replace(/^Flurry on his sheet:[^\n]*/,DEFAULT.atkNotes.split('\n')[0]);
    s.gear=(s.gear||[]).filter(g=>!/^potion of/i.test(g.item||''));
    if(!d.potions)s.potions=clone(DEFAULT.potions);
    s.v=3;}
  if((d.v||1)<4){migrated=true;
    /* v4: rings, amulets and bracers move into the AC items table; their old AC fields are cleared so nothing counts twice */
    const it=[];
    if(n(s.ac.deflection)){it.push({name:'Ring of Protection +'+n(s.ac.deflection),slot:'Ring',type:'deflection',bonus:n(s.ac.deflection),on:true});s.ac.deflection=0;}
    if(n(s.ac.natural)){it.push({name:'Amulet of Natural Armor +'+n(s.ac.natural),slot:'Neck',type:'natural',bonus:n(s.ac.natural),on:true});s.ac.natural=0;}

function levelUp(){

function undoLevel(){

document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='sync-phrase'){(S.sync=S.sync||{}).phrase=t.value.trim();syncLast='';syncState={ok:true,msg:'',at:null};render();scheduleSave(true);setTimeout(()=>syncSend(true),100);return;}
  if(t.dataset&&t.dataset.p&&t.hasAttribute('data-rr')&&t.tagName==='INPUT'&&t.type!=='checkbox'){const f=t.id;render();const el=document.getElementById(f);if(el)el.focus({preventScroll:true});}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
  const amt=id=>Math.max(0,Math.floor(n((document.getElementById(id)||{}).value)));
  switch(a){
   case 'tab':tab=b.dataset.t;ls.set(CHAR+'-tab',tab);render();window.scrollTo({top:Math.min(window.scrollY,document.getElementById('tabs').offsetTop),behavior:'instant'});return;
   case 'hideExample':S.example=false;render();break;
   case 'addClass':S.classes.push(Object.assign({preset:'Custom',level:1},{name:'New class',hd:8,bab:'3/4',fort:'poor',ref:'poor',will:'good',prestige:false,sp:2,skills:''}));render();break;
   case 'delClass':S.classes.splice(i,1);render();break;
   case 'addAtk':S.attacks.push({id:newId(),name:'',kind:'melee',abil:'str',enh:0,misc:0,dice:'1d6',dmgAbil:'str',dmgMisc:0,extra:'',crit:'×2',range:'',type:'',uses:0,notes:'',desc:''});render();break;
   case 'delAtk':S.attacks.splice(i,1);render();break;
   case 'addItem':S[b.dataset.k].push({name:'',desc:'',uses:0});render();break;
   case 'delItem':S[b.dataset.k].splice(i,1);render();break;
   case 'addGear':S.gear.push({item:'',desc:'',loc:'',wt:0});render();break;
   case 'delGear':S.gear.splice(i,1);render();break;
   case 'use':{const k=b.dataset.k,u=n(S.used[k]);S.used[k]=(i===u-1)?u-1:i+1;
     if(k==='wp.fervor'){const f=fervorState(),d=S.used[k]-u;spLog(`Fervor pips ${d>0?'marked '+d+' used':'cleared '+(-d)} (${f.left} of ${f.uses} left)`);}
     render();break;}
   case 'rest':longRest(false);render();break;
   case 'spPrep':case 'spPrepN':{const k=b.dataset.k,s=+b.dataset.s;const inp=document.getElementById(`spadd-${k}-${s}`);
     /* empowered: the spell goes into a slot two levels higher */
     const emp=hasEmpower()&&spEmp.has(k+'-'+s)&&prepCap(k,s+2)>0,tgt=emp?s+2:s,P=prepOf(k,tgt);
     let nm=a==='spPrepN'?b.dataset.n:(inp&&inp.value||'').trim();if(!nm||P.length>=prepCap(k,tgt))return;
     const all=(k==='Warpriest'?WP_SPELLS[s]:[])||[];nm=all.find(x=>x.toLowerCase()===nm.toLowerCase().replace(/'/g,'’'))||nm;
     P.push(emp?{n:nm,c:false,emp:true,lv:s}:{n:nm,c:false});spLog('Prepared '+(emp?'Empowered ':'')+nm+' ('+lvName(tgt)+' slot)');render();{const el=document.getElementById(`spadd-${k}-${s}`);if(el&&a==='spPrep')el.focus()}break;}
   case 'spUnprep':{const k=b.dataset.k,s=+b.dataset.s,P=prepOf(k,s);const gone=P[i];if(gone)spLog('Unprepared '+(gone.emp?'Empowered ':'')+gone.n+' ('+lvName(s)+' slot)');P.splice(i,1);if(s)S.used[`sp.${k}.${s}`]=P.filter(x=>x.c).length;render();break;}
   case 'spCast':{const k=b.dataset.k,s=+b.dataset.s,P=prepOf(k,s),p=P[i];if(!p)return;const f=fxForSpell(p.n);
     if(s){p.c=!p.c;if(p.c)p.ct=new Date().toISOString();else delete p.ct;S.used[`sp.${k}.${s}`]=P.filter(x=>x.c).length;if(f)S.cond[f.id]=p.c;spLog((p.c?'Cast ':'Undid cast: ')+(p.emp?'Empowered ':'')+p.n+' ('+lvName(s)+' slot)');}
     else if(f)S.cond[f.id]=!S.cond[f.id];
     render();break;}
   case 'goConc':tab='spells';ls.set(CHAR+'-tab',tab);render();setTimeout(()=>{const el=document.getElementById('conc');if(el){el.scrollIntoView({block:'start'});const i=document.getElementById('conc-d20');if(i)i.focus({preventScroll:true})}},60);return;
   case 'takeFeat':{const f=FEATDB.find(x=>x.id===b.dataset.id),w=levels().by.Warpriest||0;if(!f||hasFeat(f.id)||Math.floor(w/3)-n(S.bonusFeatsUsed)<1)return;
     if(featUnmet(f,featQ(w)).length)return;
     (S.feats=S.feats||[]).push({name:f.name,desc:`${featBen(f)}${f.auto?` Sheet: ${f.auto}.`:''} (Warpriest ${w} bonus feat.)`,key:f.id,gain:w,uses:f.uses?f.uses():0});
     S.bonusFeatsUsed=n(S.bonusFeatsUsed)+1;
     lastSummary+=`<div class="summary"><b>Added ${esc(f.name)}</b> to his feats.${f.auto?` The sheet now applies: ${esc(f.auto)}.`:''}</div>`;render();break;}
   case 'ringStore':{const v=(document.getElementById('ring-pick')||{}).value||'';const [k,s,ix]=v.split('|');if(!k)return;if(ringStoreFrom(k,+s,+ix)){const x=S.ring.stored.at(-1);spLog('Stored '+(x.emp?'Empowered ':'')+x.n+' in the Ring of Spell Storing ('+x.lv+' level'+(x.lv>1?'s':'')+')');render();}break;}
   case 'ringStoreP':if(ringStoreFrom(b.dataset.k,+b.dataset.s,i)){const x=S.ring.stored.at(-1);spLog('Stored '+(x.emp?'Empowered ':'')+x.n+' in the Ring of Spell Storing ('+x.lv+' level'+(x.lv>1?'s':'')+')');render();}break;
   case 'ringAdd':{const nm=((document.getElementById('ring-name')||{}).value||'').trim();const lv=Math.floor(n((document.getElementById('ring-lvl')||{}).value));
     if(!nm||lv<1||lv>ringRoom())return;(S.ring=S.ring||{stored:[]}).stored=S.ring.stored||[];
     const all=Object.values(WP_SPELLS).flat();S.ring.stored.push({n:all.find(x=>x.toLowerCase()===nm.toLowerCase().replace(/'/g,'’'))||nm,lv,emp:false,src:'scroll / another caster'});render();break;}
   case 'ringCast':{const R=(S.ring||{}).stored||[];const x=R.splice(i,1)[0];if(!x)return;const f=fxForSpell(x.n);if(f)S.cond[f.id]=true;spLog('Cast '+(x.emp?'Empowered ':'')+x.n+' from the Ring of Spell Storing');render();break;}
   case 'dmSend':dmOpen=!dmOpen;render();if(dmOpen)setTimeout(()=>{const el=document.getElementById('dm-code');if(el){el.focus();el.select()}},50);return;
   case 'dmCopy':{const el=document.getElementById('dm-code');if(!el)return;el.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
     if(navigator.clipboard)navigator.clipboard.writeText(el.value).then(()=>setStatus('Code copied for the DM'),()=>setStatus(ok?'Code copied for the DM':'Select the code and copy it'));else setStatus(ok?'Code copied for the DM':'Select the code and copy it');return;}
   case 'spLogClear':S.spLog=[];render();break;
   case 'syncNow':syncSend(true);return;
   case 'ringDel':((S.ring||{}).stored||[]).splice(i,1);render();break;
   case 'goEmpower':tab='gear';ls.set(CHAR+'-tab',tab);render();setTimeout(()=>{const el=document.getElementById('empower-rules');if(el){el.scrollIntoView({block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}},60);return;
   case 'spClear':{const sp=S.spells[b.dataset.k];if(sp)sp.prep={};spLog('Cleared all prepared spells');render();break;}
   case 'addNote':setP(b.dataset.k,' ');render();{const el=document.getElementById('i-'+b.dataset.k.replace(/\W/g,'_'));if(el){el.value='';el.focus()}}break;
   case 'levelUp':levelUp();render();break;
   case 'undoLevel':undoLevel();render();break;
   case 'mvAtk':{const j=i+n(b.dataset.d);if(j<0||j>=S.attacks.length)return;const t=S.attacks[i];S.attacks[i]=S.attacks[j];S.attacks[j]=t;render();break;}
   case 'quick':S.cond[b.dataset.id]=!S.cond[b.dataset.id];if(b.dataset.id==='enlarge'&&S.cond.enlarge)S.cond.reduce=false;render();break;
   case 'chg':{const c=S.cabal,mx=n(c.max),d=n(b.dataset.d);c.cur=Math.max(0,mx?Math.min(mx,n(c.cur)+d):n(c.cur)+d);chgLog(d<0?'Spent 1 charge':'Regained 1 charge');render();break;}
   case 'chgFull':{const c=S.cabal;if(!n(c.max))return;c.cur=n(c.max);chgLog('Recharged to full');render();break;}
   case 'chgSet':{const c=S.cabal,u=n(c.cur);c.cur=(i===u-1)?u-1:i+1;chgLog(`Set to ${c.cur}`);render();break;}
   case 'chgUse':{const c=S.cabal,p=c.powers[i];if(!p)return;const cost=n(p.cost);if(n(c.cur)<cost)return;c.cur=n(c.cur)-cost;chgLog(`Used ${p.name||'a power'} (−${cost})`);render();break;}
   case 'addPower':S.cabal.powers=S.cabal.powers||[];S.cabal.powers.push({name:'',cost:1,desc:''});render();break;
   case 'delPower':S.cabal.powers.splice(i,1);render();break;
   case 'chgClearLog':S.cabal.log=[];render();break;
   case 'souls':{const at=S.attacks[i];at.souls=Math.max(0,Math.min(n(at.soulsMax)||3,n(at.souls)+n(b.dataset.d)));render();break;}
   case 'dmg':{const raw=amt('hpamt');if(!raw)return;const drEl=document.getElementById('hp-dr');
     const type=(document.getElementById('hp-type')||{}).value||'phys';lastDmgType=type;const tl=(DMG_TYPES.find(x=>x[0]===type)||['',''])[1].toLowerCase();
     const dr=type==='phys'&&S.cond.dimlight&&levels().sd>=10&&drEl&&drEl.checked?10:0;let d=Math.max(0,raw-dr);
     const rs=resistFor(type);let rTxt='';
     if(rs&&rs.half){const nd=Math.floor(d/2);rTxt=`, halved (${rs.src}) to ${nd}`;d=nd;}
     else if(rs&&rs.amt){const nd=Math.max(0,d-rs.amt);rTxt=`, resist ${rs.amt} stopped ${d-nd}`;d=nd;}
     const tmp=n(S.hp.temp),use=Math.min(tmp,d);S.hp.temp=tmp-use;S.hp.cur=n(S.hp.cur)-(d-use);
     hpLog(`${raw} ${type==='phys'?'':tl+' '}damage${dr?`, DR stopped ${Math.min(raw,dr)}`:''}${rTxt}: took ${d}`+(use?` (${use} from temp HP)`:''));render();break;}
   case 'clearLog':S.hpLog=[];render();break;
   case 'fv':{const f=fervorState();if(f.left<1)return;const x=Math.max(0,Math.floor(n((document.getElementById('fv-roll')||{}).value)));const k=b.dataset.k;
     if(k!=='spell'&&!x){setStatus('Type the dice total first.');return}
     S.used['wp.fervor']=n(S.used['wp.fervor'])+1;
     if(k==='self'){const h=fvHealSelf(x);hpLog(`Fervor healed ${h}`);fvLog(`Healed himself ${h} (rolled ${x})`);}
     else if(k==='ally')fvLog(`Healed an ally ${x}`);else if(k==='harm')fvLog(`Harmed with a touch for ${x}`);else fvLog('Cast a spell on himself (swift)');
     render();break;}
   case 'ch':{const f=fervorState();if(f.left<2)return;const x=Math.max(0,Math.floor(n((document.getElementById('ch-roll')||{}).value)));if(!x){setStatus('Type the dice total first.');return}
     const self=(document.getElementById('ch-self')||{}).checked;S.used['wp.fervor']=n(S.used['wp.fervor'])+2;
     if(b.dataset.k==='heal'){let t=`Channeled to heal ${x}`;if(self){const h=fvHealSelf(x);hpLog(`Channel energy healed ${h}`);t+=`, himself +${h}`}fvLog(t)}
     else fvLog(`Channeled to harm ${x} (Will DC ${f.dc} half)`);
     render();break;}
   case 'cabState':{const c=S.cabal,st=CABAL[b.dataset.v];if(!st)return;c.state=b.dataset.v;c.max=st.max;c.cur=Math.min(st.max,n(c.cur));if(!st.sr)c.srOn=false;if(!st.absorbRes)c.absorbRes='';cabalLog(`Cloak is now ${st.label}`);render();break;}
   case 'cabStrike':{const c=S.cabal,k=Math.max(1,Math.floor(n((document.getElementById('cab-n')||{}).value)));if(n(c.cur)<k){setStatus(`Only ${n(c.cur)} charges left.`);return}
     c.cur=n(c.cur)-k;c.lastStrike=k;cabalLog(`Lightning strike: ${k} charge${k>1?'s':''}, +${k}d6 lightning`);render();break;}
   case 'cabAbsorb':{const c=S.cabal,st=cabalSt();if(c.absorbUsed)return;const lv=Math.max(0,Math.min(9,Math.floor(n((document.getElementById('cab-lvl')||{}).value))));
     const bf=n(c.cur);c.cur=Math.min(st.max,bf+lv);c.absorbUsed=true;let t=`Absorbed a level ${lv} spell: +${n(c.cur)-bf} charges`;
     if(st.absorbRes){const ty=(document.getElementById('cab-type')||{}).value;if(ty){c.absorbRes=ty;t+=`, half damage from ${ty} until end of next turn`}}
     cabalLog(t);render();break;}
   case 'cabEndRes':S.cabal.absorbRes='';render();break;
   case 'cabShortRest':S.cabal.absorbUsed=false;cabalLog('Short rest: absorb ready');render();break;
   case 'cabSR':{const c=S.cabal;if(b.dataset.v==='on'){if(n(S.used['cabal.sr'])>=1)return;S.used['cabal.sr']=1;c.srOn=true;cabalLog(`Spell resistance ${cabalSR()} for 1 minute`)}else c.srOn=false;render();break;}
   case 'cabDawn':{const c=S.cabal,st=cabalSt();const r=Math.floor(n((document.getElementById('cab-dawn')||{}).value));if(!(r>=1&&r<=st.die)){setStatus(`Type a d${st.die} roll (1–${st.die}).`);return}
     const bf=n(c.cur);c.cur=Math.min(st.max,bf+r+st.plus);cabalLog(`Dawn: rolled ${r}${st.plus?` + ${st.plus}`:''}, regained ${n(c.cur)-bf}`);render();break;}
   case 'potDrink':{const p=(S.potions||[])[i];if(!p||n(p.qty)<1)return;const dl=diceIn(p.dice),lo=dl.reduce((a,[c])=>a+c,0),hi=dl.reduce((a,[c,s])=>a+c*s,0);
     const el=document.getElementById('pot-roll-'+i);const x=Math.floor(n((el||{}).value));
     if(!(x>=lo&&x<=hi)){setStatus(`Type the ${p.dice} total (${lo}–${hi}).`);if(el)el.focus();return}
     const amt=x+n(p.bonus),h=fvHealSelf(amt);p.qty=n(p.qty)-1;hpLog(`Drank ${p.name}: ${x}+${n(p.bonus)} = ${amt}, healed ${h}`);setTimeout(()=>setStatus(`${p.name}: healed ${h} HP`),800);render();break;}
   case 'goFlurryRules':tab='gear';ls.set(CHAR+'-tab',tab);render();setTimeout(()=>{const el=document.getElementById('flurry-rules');if(el){el.scrollIntoView({block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}},60);return;
   case 'acAdd':(S.acItems=S.acItems||[]).push({name:'',slot:'Ring',type:'deflection',bonus:1,on:true});render();break;
   case 'acDel':S.acItems.splice(i,1);render();break;
   case 'potAdd':(S.potions=S.potions||[]).push({name:'Cure Light Wounds',dice:'1d8',bonus:1,qty:1});render();break;
   case 'potDel':S.potions.splice(i,1);render();break;
   case 'fvClearLog':S.fvLog=[];render();break;
   case 'hands':S.hands=S.hands===b.dataset.v?'':b.dataset.v;render();break;
   case 'exportSheet':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');
     a.href=u;a.download=`${(S.info.name||'character').replace(/\W+/g,'-')}-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);setStatus('Backup downloaded');return;}
   case 'importSheet':document.getElementById('importfile').click();return;
   case 'rnd':{const k=b.dataset.k,C=compute(true),info=rollInfo(k,C);if(!info)return;const r=rolls[k]=rolls[k]||{};
     if(b.dataset.w==='d20'){r.d20=1+Math.floor(Math.random()*20);}
     else{const list=diceIn(info.dmgT);if(rolls.sneak)list.push([Math.ceil(levels().rogue/2),6]);if(info.jab)list.push([info.jab,6]);const x=rollDice(list);r.dmg=x.tot;r.parts=x.parts.join(', ');}
     const inp=document.querySelector(`[data-roll="${k}.${b.dataset.w}"]`);if(inp)inp.value=b.dataset.w==='d20'?r.d20:r.dmg;updRolls(C);return;}
   case 'clearRolls':Object.keys(rolls).forEach(k=>{if(k!=='sneak')delete rolls[k]});render();return;
   case 'heal':{const mx=hpBase()-5*Math.max(0,n(S.neg));if(!amt('hpamt'))return;const bf=n(S.hp.cur);S.hp.cur=Math.min(mx,n(S.hp.cur)+amt('hpamt'));hpLog(`Healed ${S.hp.cur-bf}`);S.hp.nl=Math.max(0,n(S.hp.nl)-amt('hpamt'));render();break;}
   case 'full':{const h=longRest(true);hpLog(`Long rest, healed ${h}`);setTimeout(()=>setStatus(`Long rest: healed ${h} HP, daily uses reset`),800);render();break;}
   case 'cdmg':S.comp.dmg=n(S.comp.dmg)+amt('chpamt');render();break;
   case 'cheal':S.comp.dmg=Math.max(0,n(S.comp.dmg)-amt('chpamt'));render();break;
   case 'cfull':S.comp.dmg=0;render();break;
   case 'light':S.comp.light=b.dataset.v;render();break;
   case 'goCompCond':condScope='comp';tab='conditions';render();return;
   case 'scope':condScope=b.dataset.v;render();return;
   case 'cond':{const m=condScope==='comp'?S.comp.cond:S.cond;m[b.dataset.id]=!m[b.dataset.id];
     if(b.dataset.id==='enlarge'&&m.enlarge)m.reduce=false;if(b.dataset.id==='reduce'&&m.reduce)m.enlarge=false;render();break;}
   case 'neg':{const p=condScope==='comp'?'comp.neg':'neg';setP(p,Math.max(0,n(getP(p))+n(b.dataset.d)));render();break;}
   case 'clearCond':if(condScope==='comp'){S.comp.cond={};S.comp.neg=0}else{S.cond={};S.neg=0}render();break;
   case 'artPick':document.getElementById('artfile').click();return;
   case 'artRemove':{const old=S.art&&S.art.id;S.art={none:true};if(old&&assets)assets.delete(old).catch(()=>{});renderArt();break;}
   default:return;
  }
  scheduleSave();});
document.getElementById('artfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)setArt(f)});
document.getElementById('importfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.info||!d.classes)throw 0;S=load(d);render();scheduleSave(true);setStatus('Backup restored')}
    catch(err){setStatus('That file isn’t a character sheet backup.')}};r.readAsText(f)});
const artEl=document.getElementById('art');
artEl.addEventListener('dragover',e=>{e.preventDefault();artEl.classList.add('drag')});
artEl.addEventListener('dragleave',()=>artEl.classList.remove('drag'));
artEl.addEventListener('drop',e=>{e.preventDefault();artEl.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)setArt(f)});

boot();
})();
