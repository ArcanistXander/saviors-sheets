<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Sinafey · Pathfinder Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: persistent header (identity left, portrait top-right, stat strip below), sticky tab bar, one panel grid per tab */
:root{
  --bg:#ecebf1; --surface:#f8f7fb; --sunk:#e2e0ea; --ink:#1c1a24; --muted:#615c70; --line:#d3cfdd;
  --accent:#5a3fa0; --accent-ink:#ffffff; --accent-soft:#e2dbf4;
  --bad:#b3261e; --bad-soft:#f6dedb; --buff:#16657f; --buff-soft:#d7ecf3; --good:#2c7a4b;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --surface:#1b1824; --sunk:#16131f; --ink:#e9e6f2; --muted:#a49eb6; --line:#2e2a3b;
  --accent:#b49cf0; --accent-ink:#17121f; --accent-soft:#2c2342;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7ccbe6; --buff-soft:#173039; --good:#7fcf9b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1b1824; --sunk:#16131f; --ink:#e9e6f2; --muted:#a49eb6; --line:#2e2a3b;
  --accent:#b49cf0; --accent-ink:#17121f; --accent-soft:#2c2342;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7ccbe6; --buff-soft:#173039; --good:#7fcf9b; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.05rem;letter-spacing:.06em;color:var(--accent)}
h3{font-size:.95rem;letter-spacing:.05em}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:4.2em;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
textarea{width:100%;resize:vertical;min-height:4.5em;line-height:1.4}

/* header */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.ident{display:grid;gap:6px;min-width:0}
.namein{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;border:0;background:transparent;padding:0;width:100%;letter-spacing:.03em}
.namein:hover{background:var(--sunk)}
.sub{font-size:1.05rem;color:var(--muted)}
.sub b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{border:1px solid var(--bad);color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:1px 10px;font-size:.82rem}
.chip.buff{border-color:var(--buff);color:var(--buff);background:var(--buff-soft)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qt{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--buff);color:var(--buff);background:transparent;border-radius:999px;padding:4px 14px 4px 10px;font-weight:700;font-size:.9rem}
.qt::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor}
.qt[aria-pressed=true]{background:var(--buff);color:var(--surface)}
.qt[aria-pressed=true]::before{background:currentColor;border-color:var(--surface)}
.qt.dim{border-color:var(--accent);color:var(--accent)}
.qt.dim[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.souls{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.88rem}
details.more summary{cursor:pointer;color:var(--accent);font-size:.88rem}
details.more p{white-space:pre-line;margin:.4em 0 0;font-size:.92rem}
.ovr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:4px;font-size:.82rem;color:var(--muted)}
.ovr input[type=number]{width:3.6em}
.ovr textarea{min-height:2.4em;font-size:.88rem}
.weapon .wtop{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 18px;align-items:center}
.weapon .wname{display:grid;gap:2px;min-width:0}
.weapon .wname input{font-weight:700;font-size:1.05rem;border-color:transparent;background:transparent;padding-left:0}
.weapon .wname input:hover,.weapon .wname input:focus{border-color:var(--line);background:var(--surface);padding-left:6px}
.weapon .wstat{display:grid;text-align:right}
.weapon .wstat b{font-size:1.2rem}
.weapon .wbtns{display:flex;gap:0}
.btn:disabled{opacity:.3;cursor:default}
@media (max-width:640px){.weapon .wtop{grid-template-columns:1fr 1fr}.weapon .wname{grid-column:1/-1}.weapon .wbtns{grid-column:1/-1}.weapon .wstat{text-align:left}}
.twf{border-color:var(--accent)}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.evolvl{display:grid;gap:4px}
.evolvl h3{color:var(--accent);margin-top:6px}
details.evo{border-top:1px solid var(--line);padding:6px 0}
details.evo summary{color:var(--ink);font-size:.95rem}
.evotag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);margin-left:4px}
.evotag.mine{border-color:var(--accent);color:var(--accent)}
.power{position:relative;overflow:hidden;transition:opacity .5s ease,transform .5s ease,filter .5s ease}
.fx-shade{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;border-radius:inherit;
  background:radial-gradient(ellipse at 50% 60%,rgba(10,5,22,.86),rgba(4,2,10,.96));box-shadow:inset 0 0 40px rgba(120,80,200,.35)}
.power.fx-vanish{opacity:0;transform:scale(.96);filter:blur(4px);transition:opacity .12s ease,transform .12s ease,filter .12s ease}
.power.fx-return{opacity:1;transform:none;filter:none;transition:opacity .7s ease,transform .7s ease,filter .7s ease}
.fx-bamf{position:fixed;z-index:51;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:46px;letter-spacing:.08em;
  color:#efe4ff;text-shadow:0 0 12px #8a5cff,0 0 28px #4b2a8a,0 2px 0 #1a0f2e;animation:fxBamf 1.3s ease-out forwards}
@keyframes fxBamf{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15) rotate(-4deg)}
  70%{opacity:1;transform:translate(-50%,-75%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-95%) scale(.95) rotate(-4deg)}}
.fx-shadowling{position:absolute;z-index:5;left:50%;bottom:6px;pointer-events:none;opacity:0;transform:translate(-50%,30px) scale(.7);filter:blur(6px) drop-shadow(0 0 10px rgba(150,100,240,.7));
  transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.3,1.2),filter .7s ease}
.fx-shadowling.in{opacity:1;transform:translate(-50%,0) scale(1);filter:blur(0) drop-shadow(0 0 10px rgba(150,100,240,.7))}
.fx-shadowling.out{opacity:0;transform:translate(-50%,-14px) scale(.9);filter:blur(8px) drop-shadow(0 0 4px rgba(150,100,240,.3));transition:opacity .85s ease,transform .85s ease,filter .85s ease}
.fx-shadowling .eye{fill:#d8c2ff;filter:drop-shadow(0 0 3px #b28cff)}
.fx-shadowling .arm{transform-origin:56px 56px;animation:fxWave .9s ease-in-out .6s 4 alternate}
.fx-shadowling .body{animation:fxBob 1.8s ease-in-out infinite}
@keyframes fxWave{from{transform:rotate(-8deg)}to{transform:rotate(32deg)}}
@keyframes fxBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.fx-shadowling .arm,.fx-shadowling .body{animation:none}}
.critbox,.sneakbox{font-weight:700}
.roundtot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.rtot{font-size:1.6rem;color:var(--ink)}
.backup{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.pots td{vertical-align:middle}
.pots td:first-child{min-width:16em}
.nowrap{white-space:nowrap}
.geartbl{table-layout:fixed;min-width:640px}
.geartbl .c-item{width:36%}.geartbl .c-desc{width:40%}.geartbl .c-loc{width:14%}.geartbl .c-wt{width:5.5em}.geartbl .c-x{width:2.5em}
.geartbl td input[type=text]{width:100%}
.geartbl td:first-child input{font-weight:700}
.geartbl tr.future td{color:var(--muted)}
.roll{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.88rem;padding:4px 0}
.roll select{font-size:.85rem}
.rgrp{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rf{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.rf input{width:3.6em}
.rres b{font-size:1.15rem;color:var(--ink)}
.crit{color:var(--good);font-style:normal;font-weight:700}
.miss{color:var(--bad);font-style:normal;font-weight:700}
.rollrow td{border-top:0;padding-top:0}
.rolltools{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.drbox{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:8px 10px;font-size:.88rem}
.hplog{display:grid;gap:2px;font-size:.86rem;border-top:1px solid var(--line);padding-top:6px}
.hplog div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.hplog b{color:var(--ink)}
.hplog .btn{justify-self:start}
.twftbl td.tot{font-size:1.2rem}
.twftbl tr.off td{background:var(--sunk)}
.ord{display:inline-block;min-width:2.6em;padding:1px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem}
.lvlup{border-color:var(--accent)}
.summary{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.summary h3{font-size:1.05rem}
.summary ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:3px}
.power .ty{font-size:.85rem;color:var(--muted)}
.pstats{display:flex;flex-wrap:wrap;gap:6px}
.pstats span{background:var(--sunk);border-radius:4px;padding:3px 9px;font-size:.88rem}
.pstats b{color:var(--accent);font-weight:700;margin-right:4px}
.rules p{margin:0 0 .5em;font-size:.94rem}
.spell{background:var(--sunk);border-radius:var(--r);padding:10px 12px;margin-top:6px}
.spell dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 8px;font-size:.88rem}
.spell dt{color:var(--muted)}
.spell dd{margin:0}
.spell p{white-space:pre-line;font-size:.92rem;margin:0 0 6px}
.locked{opacity:.55}
.prog tr.cur td{background:var(--accent-soft);font-weight:700}
.prog tr.future td{color:var(--muted)}
.example{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;background:var(--accent-soft);border-radius:var(--r);padding:6px 10px}
.example button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;padding:1px 8px;font-size:.8rem}

.art{width:170px;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ph{padding:12px;color:var(--muted);font-size:.85rem;display:grid;gap:6px;justify-items:center}
.art .ph svg{width:34px;height:34px;opacity:.6}
.art .tools{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;justify-content:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .15s}
.art:hover .tools,.art:focus-within .tools{opacity:1}
.art .tools button{background:rgba(255,255,255,.9);color:#1c1a24;border:0;border-radius:4px;font-size:.78rem;padding:2px 8px}
.art.drag{outline:2px dashed var(--accent);outline-offset:3px}
.art .pick{position:absolute;inset:0;background:transparent;border:0}

.strip{display:flex;flex-wrap:wrap;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:8px 14px;border-right:1px solid var(--line);display:grid;gap:0;min-width:70px;flex:1 0 auto}
.stat:last-child{border-right:0}
.stat .v{font-size:1.35rem;font-weight:500;line-height:1.2}
.hpstat{flex:3 1 220px}
.hpbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .2s}
.hpbar i.low{background:var(--bad)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:18px;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:10px 14px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:.72rem;line-height:18px;text-align:center}
.status{margin-left:auto;align-self:center;font-size:.78rem;color:var(--muted);white-space:nowrap;padding-inline:8px}

.page{display:grid;gap:18px;margin-top:18px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel>header .muted{font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:center;padding:4px 4px;white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:4px;text-align:center;border-top:1px solid var(--line);vertical-align:middle}
td.tot{font-weight:700;font-size:1.08rem;min-width:3em}
.op{color:var(--muted);font-size:.8rem;padding:0 1px}
[data-d=down]{color:var(--bad)!important}
[data-d=up]{color:var(--buff)!important}
.abtbl td:first-child{font-family:var(--f-display);font-size:1.05rem;text-align:left}
.mod{display:inline-block;min-width:2.6em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.kv label{font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 14px}
.field{display:grid;gap:2px;min-width:0}
.field input,.field select{width:100%}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3>div{background:var(--sunk);border-radius:var(--r);padding:8px 4px}
.big3 .v{font-size:1.7rem;font-weight:500;line-height:1.1}
.formula{font-size:.88rem;color:var(--muted);line-height:1.8}
.formula b{color:var(--ink)}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.note.warn{border-color:var(--bad);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 10px;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.x{border:0;background:transparent;color:var(--muted);padding:2px 6px}
.btn.x:hover{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs{width:16px;height:16px;accent-color:var(--accent)}
.skilltbl td:nth-child(2){text-align:left;white-space:nowrap}
.skilltbl input.sub{width:7.5em}
.untr{color:var(--muted);font-weight:400!important}
.counter{font-size:.9rem}
.counter b.over{color:var(--bad)}

/* abilities list */
.ab-list{display:grid;gap:0}
.ab{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ab:first-child{border-top:0}
.ab .lv{font-family:var(--f-display);color:var(--accent);font-size:.95rem;padding-top:1px}
.ab .nm{font-weight:700}
.ab .ty{font-size:.78rem;color:var(--muted);margin-left:4px}
.ab .ds{color:var(--ink);font-size:.93rem;margin-top:2px}
.pips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:8px;vertical-align:middle}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;padding:0}
.pip[aria-pressed=true]{background:var(--accent)}
.custom{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.custom .row input.nm{flex:1 1 200px;font-weight:700}

/* conditions */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.condgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.cond{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0}
.cond .n{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.cond .e{font-size:.8rem;color:var(--muted);line-height:1.3}
.cond:hover{border-color:var(--accent)}
.cond[aria-pressed=true]{border-color:var(--bad);background:var(--bad-soft)}
.cond[aria-pressed=true] .n::after{content:"ON";font-size:.68rem;letter-spacing:.08em;color:var(--bad);align-self:center}
/* overview: abilities and HP side by side, then AC and combat across the full width */
.cols2{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.actop{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:760px){.actop{grid-template-columns:1fr}}
.actop .big3 .v{font-size:2rem}
.acedit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.acedit .field input{width:100%}
@media (max-width:460px){.acedit{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acparts{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.acparts span{display:grid;justify-items:center;gap:1px;background:var(--sunk);border-radius:var(--r);padding:5px 4px}
.acparts small{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.acparts b{font-size:1.1rem}
.acparts span:first-child{background:var(--accent-soft)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr));gap:10px}
.ctile{display:grid;gap:4px;align-content:start;background:var(--sunk);border-radius:var(--r);padding:10px 12px;min-width:0}
.ctile .v{font-size:1.45rem;font-weight:600;line-height:1.15}
.ctile .rf{flex-wrap:wrap;font-size:.82rem}
.ctile select{max-width:100%;font-size:.85rem}
.ctile input[type=number]{width:3.3em;padding:2px 3px;font-size:.85rem}
.ctile .rf{gap:3px}
.cond.buffc[aria-pressed=true]{border-color:var(--buff);background:var(--buff-soft)}
.cond.buffc[aria-pressed=true] .n::after{color:var(--buff)}
.cond:disabled{opacity:.45;cursor:not-allowed}
.cond:disabled .n::after{content:"IMMUNE";font-size:.68rem;letter-spacing:.08em;color:var(--muted);align-self:center}
.net{display:grid;gap:4px}
.net div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:4px}
.net .neg{color:var(--bad);font-weight:700}
.net .pos{color:var(--buff);font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:4px}

/* companion statblock */
.block{display:grid;gap:4px}
.block .bar{font-family:var(--f-display);letter-spacing:.08em;font-size:.82rem;border-bottom:1.5px solid var(--accent);color:var(--accent);margin-top:8px;padding-bottom:2px}
.block p{margin:0;font-size:.95rem}
.block b{font-weight:700}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:.92rem}
.hpctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hpctl input{width:4.5em}

@media (max-width:640px){
  .art{width:104px}
  .stat{padding:6px 10px;min-width:60px}
  .stat .v{font-size:1.15rem}
  .head{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  put('dc.illusion',dco('sd.illusion',11+ab.cha.mod));put('dc.call',dco('sd.call',(L.sd>=10?17:14)+ab.cha.mod));put('dc.power',dco('sd.power',15+ab.cha.mod));
  put('trapsense',Math.floor(L.rogue/3),true);put('trapfind',Math.max(1,Math.floor(L.rogue/2)),true);
  put('impud',L.rogue+L.sd,false,String(L.rogue+L.sd+4));
  // companion
  compCompute(O,put,{bab,base,hpMax,L},useC);
  return {O,M,L,ab,bab,uncanny,lose,acp,si,base,twf,pen};
}
function compCompute(O,put,P,useC){
  const M=useC?gather(S.comp.cond,S.comp.neg,'comp'):gather({},0,'comp');
  let dex=14+M.g('dex'); if(M.flags.dexZero)dex=0; const dm=Math.floor((dex-10)/2), wm=1, chm=2, im=-2;
  put('c.dex',dex);put('c.dexm',dm,true);
  const defl=Math.max(1,chm);
  const lose=M.flags.loseDex||M.flags.flatFooted;
  const dexU=lose?Math.min(0,dm):dm, dodge=lose?0:1+M.g('acDodge');
  const ca=M.g('ac');
  const ac=10+dexU+defl+dodge+ca+(M.flags.mageArmor?4:0)+(M.flags.shieldSpell?4:0);
  put('c.ac',ac);put('c.touch',10+dexU+defl+dodge+ca);put('c.ff',10+Math.min(0,dm)+defl+ca+(M.flags.mageArmor?4:0)+(M.flags.shieldSpell?4:0));
  const hpMax=Math.max(1,Math.floor(P.hpMax/2))-5*M.neg; put('c.hpmax',hpMax); put('c.hp',Math.max(-99,hpMax-n(S.comp.dmg)));
  put('c.hpsrc',Math.floor(P.hpMax/2));
  put('c.bab',P.bab,true);
  const f=P.base.fort+chm+M.g('save')+M.g('fort'), r=P.base.ref+dm+M.g('save')+M.g('ref'), w=P.base.will+wm+M.g('save')+M.g('will');
  put('c.fort',f,true);put('c.ref',r,true);put('c.will',w,true);
  put('c.bfort',P.base.fort,true);put('c.bref',P.base.ref,true);put('c.bwill',P.base.will,true);
  put('c.init',dm+M.g('init'),true);
  const hit=P.bab+dm+M.g('atk')+M.g('atkMelee');const its=[];for(let b=hit,k=0;k<4&&(k===0||P.bab-5*k>=1);k++,b-=5)its.push(b);
  put('c.touchatk',hit,true,its.map(sg).join('/'));
  put('c.cmb',P.bab+dm+M.g('atk')+M.g('cmb'),true);
  put('c.cmd',10+P.bab+dexU+dodge+defl+M.g('cmd'));
  let spd=40+M.g('speed');if(M.flags.halfSpeed)spd=Math.floor(spd/10)*5;put('c.speed',spd,false,`fly ${spd} ft. (good)`);
  const light=S.comp.light==='dim'?4:S.comp.light==='bright'?-4:0;const sk=M.g('skill');
  put('c.fly',9+dm+sk+M.g('skillStrDex'),true);put('c.perc',7+wm+sk,true);put('c.stealth',6+dm+light+sk+M.g('skillStrDex'),true);
  put('c.status',0,false,!P.L.sd||P.L.sd<3?'Locked':S.comp.status==='active'?'Active':S.comp.status==='dismissed'?'Dismissed':'Destroyed');
}

function autoAbilities(L){
  const A=[];const add=(cls,lvl,name,ty,ds,o={})=>A.push(Object.assign({cls,lvl,name,ty,ds},o));
  const r=L.rogue,d=L.sd;
  if(r>=1){add('Rogue',1,'Sneak Attack','Ex',`Deals ${out('sneak')} extra damage when the target is flanked or denied its Dex bonus to AC. Ranged sneak attacks only within 30 ft.`);
    add('Rogue',1,'Trapfinding','Ex',`Adds ${out('trapfind')} to Perception checks to find traps and to Disable Device checks. Can disarm magic traps.`);}
  if(r>=2||d>=2)add(r>=2?'Rogue':'Shadowdancer',r>=2?2:2,'Evasion','Ex','On a successful Reflex save against an effect that deals half damage on a save, she takes no damage instead. Only in light armor or no armor.');
  if(r>=3)add('Rogue',3,'Trap Sense','Ex',`${out('trapsense')} on Reflex saves and a dodge bonus to AC against traps.`);
  if(uncannyFrom(L)){const imp=L.rogue>=8||L.sd>=5||(L.rogue>=4&&L.sd>=2);
    add(L.rogue>=4?'Rogue':'Shadowdancer',L.rogue>=4?4:2,'Uncanny Dodge','Ex','Can’t be caught flat-footed and keeps her Dex bonus to AC against invisible attackers. The flat-footed condition on the Conditions tab respects this.');
    if(imp)add('Shadowdancer',L.sd>=5?5:2,'Improved Uncanny Dodge','Ex',`Can’t be flanked except by a rogue of at least level ${out('impud')}. Rogue and shadowdancer levels stack for this.`);}
  if(r>=10)add('Rogue',10,'Advanced Talents','Ex','Can choose advanced rogue talents in place of normal ones.');
  if(d>=1)add('Shadowdancer',1,'Hide in Plain Sight','Su','Can use Stealth while observed, with nothing to hide behind, as long as she is within 10 ft. of dim light. She can’t hide in her own shadow.');
  if(d>=2)add('Shadowdancer',2,'Darkvision','Ex','Gains darkvision 60 ft. If she already has darkvision, its range increases by 30 ft. (drow 120 ft. + 30 = 150 ft.).');
  if(d>=3)add('Shadowdancer',3,'Shadow Illusion','Sp',`Creates visible illusions from shadows, as <i>silent image</i>. Caster level ${d}. Will DC ${out('dc.illusion')}.`,{key:'sd.illusion',uses:Math.floor(d/2)});
  if(d>=3)add('Shadowdancer',3,'Summon Shadow','Su','Summons a shadow companion that shares her alignment and can’t create spawn. See the Shadow Companion tab.');
  if(d>=4)add('Shadowdancer',4,'Shadow Call','Sp',`Creates creatures and effects from raw shadow, as <i>${d>=10?'greater shadow conjuration':'shadow conjuration'}</i>. Caster level ${d}. Will DC ${out('dc.call')}.`,{key:'sd.call',uses:1+Math.floor((d-4)/2)});
  if(d>=4){const ft=d>=10?320:d>=8?160:d>=6?80:40;add('Shadowdancer',4,'Shadow Jump','Su',`Travels between shadows as <i>dimension door</i>, both ends in dim light. ${ft} ft. per day in 10-ft. increments (one pip per 10 ft.).`,{key:'sd.jump',uses:ft/10});}
  if(d>=5)add('Shadowdancer',5,'Defensive Roll','Ex','Once per day, when a blow would drop her to 0 hp or less, she can attempt a Reflex save (DC = damage dealt) to take half damage. Must be aware of the attack.',{key:'sd.roll',uses:1});
  if(d>=7)add('Shadowdancer',7,'Slippery Mind','Ex','If she fails a save against an enchantment, she gets a second save one round later.');
  if(d>=8)add('Shadowdancer',8,'Shadow Power','Sp',`Uses shadow to deal damage, as <i>shadow evocation</i>. Caster level ${d}. Will DC ${out('dc.power')}.`,{key:'sd.power',uses:1+Math.floor((d-8)/2)});
  if(d>=10){add('Shadowdancer',10,'Improved Evasion','Ex','Takes half damage even on a failed Reflex save.');
    add('Shadowdancer',10,'Shadow Master','Su','In dim light: DR 10/— and +2 luck bonus on saves. Her critical hits blind the target for 1d6 rounds. Use the “In dim light” toggle at the top to apply the save bonus.',{key:'sd.master'});}
  const talents=[r>=2?Math.floor(r/2):0,[3,6,9].filter(x=>d>=x).length];
  if(talents[0]+talents[1]) add('Rogue / Shadowdancer',Math.min(r>=2?2:99,d>=3?3:99),'Rogue Talents','Ex',`She has ${talents[0]+talents[1]} rogue talents (${talents[0]} from rogue, ${talents[1]} from shadowdancer). Record them under Talents below.`);
  A.forEach(a=>{a.key=a.key||('ab.'+a.name.replace(/\W+/g,''));a.base=a.uses;const o=(S.ov||{})[ok(a.key)];a.dc=/sd\.(illusion|call|power)/.test(a.key);
    if(a.uses&&o&&String(o.uses??'').trim()!=='')a.uses=Math.max(0,Math.floor(n(o.uses)));});
  return A.sort((a,b)=>a.lvl-b.lvl);
}
function uncannyFrom(L){return L.rogue>=4||L.sd>=2}

 {l:3,n:'Wind Wall',d:'air',ct:'1 standard action',r:c=>RNG.medium(c),a:c=>`wall up to ${10*c} ft. long and ${5*c} ft. high (S)`,du:c=>`${c} rounds`,sv:'none',sr:'yes',
  t:()=>'An invisible vertical curtain of wind, 2 ft. thick. It tears papers and small birds away and can blow off hats and cloaks. Arrows and bolts are deflected upward and miss; other normal ranged weapons passing through have a 30% miss chance. Giant-thrown boulders, siege engine projectiles and similar massive missiles aren’t affected. Gases, most gaseous breath weapons and creatures in gaseous form can’t pass.'},
 {l:4,n:'Fire Shield',d:'fire or cold',ct:'1 standard action',r:()=>'personal',a:'her',du:c=>`${c} rounds (D)`,sv:'none',sr:'no',dmg:1,
  t:c=>`Wispy flames wrap her. Anyone striking her with a natural or handheld weapon takes <b>1d6+${Math.min(15,c)}</b> damage (1d6 + 1 per level, max +15) of the shield’s type; reach weapons don’t trigger it. <b>Warm shield</b> (fire damage to attackers): she takes half damage from cold attacks, none if a save for half succeeds. <b>Chill shield</b> (cold damage to attackers): same protection against fire. The flames shed light like a torch but give no heat.`},
 {l:4,n:'Ice Storm',d:'cold',ct:'1 standard action',r:c=>RNG.long(c),a:'cylinder (20-ft. radius, 40 ft. high)',du:()=>'1 full round',sv:'none',sr:'yes',dmg:1,
  t:()=>'Great magical hailstones pound the area for <b>3d6 bludgeoning plus 2d6 cold</b> damage to every creature in it. For the round, Perception checks in the area take −4 and movement there is at half speed. At the end of the duration the hail disappears, leaving no aftereffects except the damage.'},
 {l:4,n:'Resilient Sphere',d:'force',ct:'1 standard action',r:c=>RNG.close(c),a:c=>`${c}-ft.-diameter sphere around a creature`,du:c=>`${c} minutes (D)`,sv:'Reflex negates',sr:'yes',
  t:()=>'A shimmering globe of force encloses a creature that’s small enough to fit inside (Reflex negates). Nothing can pass through it, physical or energy, though the creature can breathe normally. It’s immune to damage of all kinds except disintegrate, a rod of cancellation, a rod of negation or a targeted dispel magic. The creature inside can roll it at half its normal speed, and others can push it.'},
 {l:4,n:'Shout',d:'sonic',ct:'1 standard action',r:()=>'30 ft.',a:'cone-shaped burst',du:()=>'instantaneous',sv:'Fortitude partial or Reflex negates (object)',sr:'yes (object)',dmg:1,
  t:c=>`An ear-splitting scream. Creatures in the cone are deafened for 2d6 rounds and take <b>5d6</b> sonic damage; a successful Fortitude save negates the deafness and halves the damage. Crystalline creatures and exposed brittle or crystal objects take <b>${Math.min(15,c)}d6</b> sonic damage (1d6 per level, max 15d6). Shout can’t penetrate a silence spell.`},
 {l:4,n:'Wall of Fire',d:'fire',ct:'1 standard action',r:c=>RNG.medium(c),a:c=>`opaque sheet up to ${20*c} ft. long, or a ring up to ${5*Math.floor(c/2)} ft. radius; 20 ft. high`,du:c=>`concentration + ${c} rounds`,sv:'none',sr:'yes',dmg:1,
  t:c=>`An immobile, blazing curtain of shimmering violet fire. One side (her choice) sends out waves of heat: <b>2d4 fire</b> to creatures within 10 ft. and <b>1d4 fire</b> within 20 ft. at the end of her turn. Passing through the wall deals <b>2d6+${Math.min(20,c)}</b> fire damage (1d6×2 + 1 per level, max +20); undead take double. If it appears where creatures are, each takes damage as if passing through. Any 5-ft. length taking 20+ cold damage in one round goes out.`},
 {l:4,n:'Wall of Ice',d:'cold',ct:'1 standard action',r:c=>RNG.medium(c),a:c=>`anchored plane of ice up to ${c} 10-ft. squares, or a hemisphere up to ${3+c} ft. radius`,du:c=>`${c} minutes`,sv:'Reflex negates (see text)',sr:'yes',dmg:1,
  t:c=>`<b>Plane:</b> ${c} in. thick; each 10-ft. section has <b>${3*c} hp</b>. Breaking through in one attack needs a Strength check DC <b>${15+c}</b>. A breached section leaves a sheet of frigid air; anyone stepping through takes <b>1d6+${c} cold</b> damage (no save). It must be anchored and can’t form where objects or creatures are. <b>Hemisphere:</b> a dome that can trap creatures; those caught can make a Reflex save to slip out before it closes. Fire, including fireball and flame strike, deals full damage to it.`},
];
function evoBook(c){
  /* expand "Wall of Fire / Ice" to wall of fire + wall of ice, and "Fire / Cold Shield" to fire shield + cold shield */
  const mine=new Set();
  (S.evos||[]).forEach(e=>{const nm=String(e.name||'').toLowerCase().trim();const ps=nm.split(/\s*\/\s*/);
    if(ps.length<2){mine.add(nm);return}
    const a=ps[0].split(' '),b=ps[ps.length-1].split(' ');
    if(a.length>1&&b.length===1){const pre=a.slice(0,-1).join(' ');ps.forEach(p=>mine.add(p.includes(' ')?p:pre+' '+p))}
    else if(a.length===1&&b.length>1){const suf=b.slice(1).join(' ');ps.forEach(p=>mine.add(p.includes(' ')?p:p+' '+suf))}
    else ps.forEach(p=>mine.add(p))});
  const isMine=nm=>{const k=nm.toLowerCase();return mine.has(k)||(k==='fire shield'&&(mine.has('cold shield')||mine.has('fire shield')))};
  const lvl=['Cantrips (0)','1st level','2nd level','3rd level','4th level'];
  return `<section class="panel"><header><h2>Shadow Evocation Spellbook</h2><span class="muted">Every Core Rulebook sorcerer/wizard evocation of 4th level or lower · numbers at caster level ${c}</span></header>
   <div class="banner">As <i>shadow evocation</i>: targets first get a <b>Will save to disbelieve</b> (DC ${out('dc.power')}). Believers take the full effect; a disbeliever takes only <b>20% damage</b>, other effects are one-fifth as strong or 20% likely, and non-damaging effects don’t work on them at all. Any save the copied spell allows also uses DC ${out('dc.power')}, and spell resistance always applies. As a spell-like ability she needs no components.</div>
   ${[0,1,2,3,4].map(L=>`<div class="evolvl"><h3>${lvl[L]}</h3>${EVO_BOOK.filter(s=>s.l===L).map(s=>{const f=v=>typeof v==='function'?v(c):v;
     return `<details class="more evo" id="det-evo-${s.n.replace(/\W+/g,'')}"><summary><b>${s.n}</b> <span class="muted">[${s.d}]</span>${s.dmg?' <span class="evotag">damage</span>':''}${isMine(s.n)?' <span class="evotag mine">on her list</span>':''}</summary>
      <div class="spell"><dl><dt>Casting time</dt><dd>${s.ct}</dd><dt>Range</dt><dd>${f(s.r)}</dd><dt>Area / target</dt><dd>${f(s.a)}</dd><dt>Duration</dt><dd>${f(s.du)}</dd><dt>Saving throw</dt><dd>Will disbelief, then ${s.sv}</dd><dt>Spell resistance</dt><dd>yes (shadow evocation)</dd></dl>
      <p>${s.t(c)}</p>${s.warn?`<p class="note warn">${s.warn}</p>`:''}</div></details>`}).join('')}</div>`).join('')}
   <p class="note">Her table numbers (on her list above) were written at a lower caster level; the spellbook uses her current level ${c}. Ice Storm officially lasts 1 full round.</p>
  </section>`;
}

function pShadow(){
  const L=levels(),d=L.sd,C=compute(true),cha=C.ab.cha.mod;
  const A=autoAbilities(L),get=k=>A.find(a=>a.key===k);
  const ruleDC={'sd.illusion':11+cha,'sd.call':(d>=10?17:14)+cha,'sd.power':15+cha};
  const ruleUses={'sd.illusion':Math.floor(d/2),'sd.call':d>=4?1+Math.floor((d-4)/2):0,'sd.power':d>=8?1+Math.floor((d-8)/2):0,'sd.jump':d>=4?(d>=10?32:d>=8?16:d>=6?8:4):0,'sd.roll':d>=5?1:0};
  const ft=d>=10?320:d>=8?160:d>=6?80:d>=4?40:0;
  const ovr=(key,dc)=>{const k='ov.'+ok(key);return `<div class="ovr">${ruleUses[key]!=null?`<label class="row">Uses/day ${num(k+'.uses',{rr:1,label:'Uses per day override'})}</label><span>rules: ${ruleUses[key]}${key==='sd.jump'?' (× 10 ft.)':''}; blank uses the rules</span>`:''}${dc?`<label class="row">Table DC ${num(k+'.dc',{rr:1,label:'DC override'})}</label><span>rules: ${ruleDC[key]} (10 + spell level + Cha ${sg(cha)})</span>`:''}</div>
    <div class="ovr" style="display:block">${field('Notes &amp; DM rulings',area(k+'.note',{rows:2,label:'Notes'}))}</div>`};
  const card=o=>{const lk=d<o.req,a=get(o.key);return `<section class="panel power${lk?' locked':''}"><header><h2>${o.name}</h2><span class="ty">(${o.ty}) · Shadowdancer ${o.req}</span></header>
    ${lk?`<p class="note">Unlocks at Shadowdancer ${o.req}. She is Shadowdancer ${d}.</p>`:''}
    ${o.stats&&!lk?`<div class="pstats">${o.stats}</div>`:''}
    ${!lk&&a&&a.uses?`<div class="row"><span class="lbl">${o.trackLbl||'Used today'}</span>${pips(a.key,a.uses)}<small class="muted">${o.trackNote||`${a.uses}/day`}</small></div>`:''}
    <div class="rules">${o.rules}</div>${o.extra||''}${o.spell||''}${o.key&&!lk&&o.ovr!==false?ovr(o.key,o.dc):''}</section>`};
  const jumpUsed=n(S.used['sd.jump'])*10, jumpMax=(get('sd.jump')||{}).uses*10||ft;
  const cards=[
   card({key:'sd.illusion',name:'Shadow Illusion',ty:'Sp',req:3,dc:1,
    stats:`<span><b>DC</b> ${out('dc.illusion')}</span><span><b>Caster level</b> ${d}</span><span><b>Range</b> ${400+40*d} ft.</span><span><b>Size</b> ${4+d} ten-ft. cubes</span>`,
    rules:'<p>When a shadowdancer reaches 3rd level, she can create visual illusions. This ability functions as <i>silent image</i>, using the shadowdancer’s level as the caster level. A shadowdancer can use this ability once per day for every two shadowdancer levels she has attained. The DC for this ability is Charisma-based.</p>',
    spell:spellRef('silent',d)}),
   card({key:'sd.call',name:'Shadow Call',ty:'Sp',req:4,dc:1,
    stats:`<span><b>DC</b> ${out('dc.call')}</span><span><b>Caster level</b> ${d}</span><span><b>Mimics</b> ${d>=10?'conjuration spells of 6th level or lower at 60%':'conjuration spells of 3rd level or lower at 20%'}</span>`,
    rules:'<p>At 4th level, a shadowdancer can create creatures and effects out of raw shadow. This ability functions as <i>shadow conjuration</i>, using the shadowdancer’s level as the caster level. A shadowdancer can use this ability once per day at 4th level, plus one additional time per day for every two levels attained beyond 4th (2/day at 6th level, 3/day at 8th level, and 4/day at 10th level). Upon reaching 10th level, this ability functions as <i>greater shadow conjuration</i>. The DC for this ability is Charisma-based.</p>',
    spell:spellRef(d>=10?'gconj':'conj',d)+(d>=10?spellRef('conj',0):'')}),
   card({key:'sd.power',name:'Shadow Power',ty:'Sp',req:8,dc:1,
    stats:`<span><b>DC</b> ${out('dc.power')}</span><span><b>Caster level</b> ${d}</span><span><b>Mimics</b> evocation spells of 4th level or lower</span>`,
    rules:'<p>At 8th level, a shadowdancer can use raw shadow to damage her foes. This ability functions as <i>shadow evocation</i>, using the shadowdancer’s level as the caster level. A shadowdancer can use this ability once per day at 8th level, and one additional time per day upon reaching 10th level. The DC for this ability is Charisma-based.</p>',
    spell:spellRef('evoc',d)}),
   card({key:'sd.jump',name:'Shadow Jump',ty:'Su',req:4,trackLbl:'10-ft. jumps used',trackNote:`${Math.max(0,jumpMax-jumpUsed)} of ${jumpMax} ft. left today`,
    stats:`<span><b>Per day</b> ${ft} ft.</span><span><b>Used</b> ${jumpUsed} ft.</span><span><b>Next increase</b> ${d<10?`${d<6?80:d<8?160:320} ft. at level ${d<6?6:d<8?8:10}`:'maxed'}</span>`,
    rules:'<p>At 4th level, a shadowdancer gains the ability to travel between shadows as if by means of a <i>dimension door</i> spell. The limitation is that the magical transport must begin and end in an area with at least some dim light. A shadowdancer can jump up to a total of 40 feet each day in this way; this may be a single jump of 40 feet or four jumps of 10 feet each. Every two levels higher than 4th, the distance a shadowdancer can jump each day doubles (80 feet at 6th, 160 feet at 8th, and 320 feet at 10th). This amount can be split among many jumps, but each one, no matter how small, counts as a 10-foot increment.</p>',
    spell:spellRef('door',0)}),
   card({key:'sd.roll',name:'Defensive Roll',ty:'Ex',req:5,
    rules:'<p>Starting at 5th level, once per day, a shadowdancer can attempt to avoid a lethal blow. Once per day, when she would be reduced to 0 or fewer hit points by damage in combat (from a weapon or other blow, not a spell or special ability), she can attempt to roll with the damage. She makes a Reflex saving throw (DC = damage dealt). If the save succeeds, she takes only half damage from the blow; if it fails, she takes full damage. She must be aware of the attack and able to react to it in order to use this ability; if she is denied her Dexterity bonus to AC, she can’t use it. Evasion does not apply to defensive roll.</p>'}),
   card({key:'sd.summon',name:'Summon Shadow',ty:'Su',req:3,ovr:false,
    rules:'<p>At 3rd level, a shadowdancer can summon a shadow, an undead shade. Unlike a normal shadow, this shadow’s alignment matches that of the shadowdancer, and the creature cannot create spawn. The summoned shadow receives a +4 bonus on Will saves made to halve the damage from positive channeled energy, and it cannot be turned or commanded. This shadow serves as a companion to the shadowdancer and can communicate intelligibly with her. It has a number of hit points equal to half the shadowdancer’s total. The shadow uses the shadowdancer’s base attack bonus and base save bonuses. Otherwise, it is identical to the shadow found in the <i>Bestiary</i>.</p><p>If a shadow companion is destroyed, or the shadowdancer chooses to dismiss it, the shadowdancer must attempt a DC 15 Fortitude save. If the saving throw fails, she gains one permanent negative level. A successful saving throw avoids this negative level. A destroyed or dismissed shadow companion cannot be replaced for 30 days.</p>',
    extra:`<div class="row"><span class="lbl">Her shadow</span><b>${out('c.hp')} / ${out('c.hpmax')} HP</b><span class="muted">touch ${out('c.touchatk')}</span><button class="btn" data-act="tab" data-t="companion">Open Shadow Companion</button></div>`}),
  ];
  const feat=(req,name,ty,text)=>`<div class="ab${d<req?' locked':''}"><div class="lv">SD ${req}</div><div><span class="nm">${name}</span><span class="ty">(${ty})</span>${d<req?' <small class="muted">not yet</small>':''}<div class="ds">${text}</div></div></div>`;

     <button class="btn" data-act="rest" style="margin-left:auto">Rest: reset daily uses</button></header>
   <div class="pstats"><span><b>Shadow Illusion</b> ${(get('sd.illusion')||{}).uses||0}/day</span><span><b>Shadow Call</b> ${(get('sd.call')||{}).uses||0}/day</span><span><b>Shadow Power</b> ${(get('sd.power')||{}).uses||0}/day</span><span><b>Shadow Jump</b> ${Math.max(0,jumpMax-jumpUsed)} ft. left</span><span><b>Defensive Roll</b> ${d>=5?(n(S.used['sd.roll'])?'used':'ready'):'—'}</span></div>
  </section>
  <div class="cols">${cards.join('')}</div>
  ${dmPanel()}
  ${d>=8?customList('evos','Shadow Power Evocations',`Will DC ${out('dc.power')} · on a successful save the target still takes 20% damage`):''}
  ${d>=8?evoBook(d):''}
  <section class="panel"><header><h2>Other Shadowdancer Features</h2></header><div class="ab-list">
   ${feat(1,'Hide in Plain Sight','Su','A shadowdancer can use the Stealth skill even while being observed. As long as she is within 10 feet of an area of dim light, she can hide herself from view in the open without anything to actually hide behind. She cannot, however, hide in her own shadow.')}
   ${feat(2,'Evasion','Ex','If she makes a successful Reflex saving throw against an attack that normally deals half damage on a successful save, she instead takes no damage. Evasion can be used only if she is wearing light armor or no armor. A helpless shadowdancer does not gain the benefit of evasion.')}
   ${feat(2,'Darkvision','Ex','She gains darkvision out to 60 feet. If she already has darkvision, its range increases by 30 feet (her drow darkvision becomes 150 ft.).')}
   ${feat(2,'Uncanny Dodge','Ex','She can react to danger before her senses would normally allow her to. She cannot be caught flat-footed, nor does she lose her Dex bonus to AC if the attacker is invisible. She still loses her Dexterity bonus to AC if immobilized, and can still lose it if an opponent successfully feints against her. If she already has uncanny dodge from a different class, she automatically gains improved uncanny dodge instead.')}
   ${feat(3,'Rogue Talents','Ex','At 3rd level, and every three levels thereafter (6th and 9th), a shadowdancer gains a rogue talent. This works like the rogue class feature of the same name. Record her talents on the Class Abilities tab.')}
   ${feat(5,'Improved Uncanny Dodge','Ex',`She can no longer be flanked. This denies rogues the ability to sneak attack her by flanking unless the attacker has at least four more rogue levels than she has shadowdancer levels. If she already has uncanny dodge from another class, the levels from those classes stack to determine the minimum rogue level needed to flank her (level ${out('impud')} for Sinafey).`)}
   ${feat(7,'Slippery Mind','Ex','If she is affected by an enchantment spell or effect and fails her saving throw, she can attempt it again 1 round later at the same DC. She gets only this one extra chance to succeed.')}
   ${feat(10,'Improved Evasion','Ex','Works like evasion, but she also takes only half damage on a failed Reflex save.')}
   ${feat(10,'Shadow Master','Su','Whenever she is in an area of dim light, she gains DR 10/— and a +2 luck bonus on all saving throws. In addition, whenever she scores a critical hit against a foe who is in an area of dim light, that foe is blinded for 1d6 rounds. Use the “In dim light” button at the top of the sheet to apply the save bonus.')}
  </div></section>
  <div class="cols">
   <section class="panel"><header><h2>Class Progression</h2></header><div class="scroll"><table class="prog"><thead><tr><th>Level</th><th>BAB</th><th>Fort</th><th>Ref</th><th>Will</th><th class="l">Special</th></tr></thead><tbody>

   </tbody></table></div></section>
   <section class="panel"><header><h2>Requirements &amp; Training</h2></header>
    <div class="kv"><label>Skills</label><span>Stealth 5 ranks, Perform (dance) 2 ranks</span><label>Feats</label><span>Combat Reflexes, Dodge, Mobility</span>
     <label>Hit die</label><span>d8</span><label>Skill ranks</label><span>6 + Int modifier per level</span>
     <label>Class skills</label><span>Acrobatics, Bluff, Diplomacy, Disguise, Escape Artist, Perception, Perform, Profession, Sleight of Hand, Stealth</span>

     <label>Armor</label><span>Light armor, no shields</span></div>

function acItemsPanel(){
  const L=S.acItems||[],IT=acItemBonuses();

  const warn=[worn('Ring')>2?`${worn('Ring')} rings are worn; only 2 ring slots exist.`:'',worn('Neck')>1?`${worn('Neck')} neck items are worn; only 1 neck slot exists.`:''].filter(Boolean);
  const applied=AC_TYPES.filter(([k])=>IT[k]).map(([k,l])=>`${l} ${sg(IT[k])}`);
  return `<section class="panel"><header><h2>Rings, Amulets &amp; Other AC Items</h2><span class="muted">Tick Worn to add the bonus to her AC</span></header>
   <div class="scroll"><table class="geartbl acitems"><colgroup><col style="width:4.5em"><col class="c-item"><col style="width:9em"><col style="width:11em"><col style="width:5.5em"><col class="c-x"></colgroup>
   <thead><tr><th>Worn</th><th class="l">Item</th><th class="l">Slot</th><th class="l">Bonus type</th><th>Bonus</th><th></th></tr></thead><tbody>
   ${L.map((x,i)=>`<tr class="${x.on?'':'future'}"><td><input type="checkbox" class="cs" data-p="acItems.${i}.on" ${x.on?'checked':''} aria-label="Worn"></td>
     <td class="l">${txt(`acItems.${i}.name`,{label:'Item name'})}</td>
     <td class="l">${sel(`acItems.${i}.slot`,AC_SLOTS,{label:'Slot'})}</td>
     <td class="l">${sel(`acItems.${i}.type`,AC_TYPES,{label:'Bonus type'})}</td>
     <td>${num(`acItems.${i}.bonus`,{w:'3.6em',rr:1,label:'Bonus'})}</td>
     <td><button class="btn x" data-act="acDel" data-i="${i}" aria-label="Remove item">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No AC items.</td></tr>'}
   </tbody></table></div>
   <div class="row"><button class="btn" data-act="acAdd">Add item</button></div>
   ${warn.length?`<p class="note warn">${warn.join(' ')}</p>`:''}
   <p class="note"><b>Applied to AC:</b> ${applied.length?applied.join(', '):'nothing'}. Bonuses of the same type don’t stack, so only the highest counts (dodge bonuses do stack). Armor and shield bonuses here use the higher of this table or the Armor and Shield boxes above. Deflection, dodge, insight, luck, sacred and profane also count for touch AC and CMD; natural armor, armor and shield don’t.</p>
  </section>`;
}
function customList(key,title,hint){

   ${S[key].map((a,i)=>`<div class="custom"><div class="row">${txt(`${key}.${i}.name`,{cls:'nm',ph:'Name',label:'Name'})}
     ${key!=='feats'&&key!=='evos'?`<label class="row"><small class="muted">Uses/day</small>${num(`${key}.${i}.uses`,{w:'3.4em',rr:1,label:'Uses per day'})}</label>${pips(`${key}.${i}`,n(a.uses))}`:''}
     <button class="btn x" data-act="delItem" data-k="${key}" data-i="${i}" aria-label="Remove">✕</button></div>${area(`${key}.${i}.desc`,{rows:2,label:'Description'})}</div>`).join('')}
   </div><div class="row"><button class="btn" data-act="addItem" data-k="${key}">Add</button></div></section>`;
}
function pips(k,max){if(!max)return '';const used=n(S.used[k]);let h='<span class="pips" role="group" aria-label="Uses">';for(let i=0;i<Math.min(max,40);i++)h+=`<button class="pip" data-act="use" data-k="${k}" data-i="${i}" aria-pressed="${i<used}" aria-label="Use ${i+1}"></button>`;return h+'</span>';}
function pAbilities(){

let assets=null;
function artSrc(){if(!S.art)return null;if(S.art.url)return S.art.url;if(S.art.id)return '/_blob/'+S.art.id;return S.art.data||null}
function renderArt(){
  const el=document.getElementById('art');const src=artSrc();
  el.innerHTML=src?`<img src="${esc(src)}" alt="Portrait of ${esc(S.info.name||'Sinafey')}"><div class="tools"><button data-act="artPick">Change</button><button data-act="artRemove">Remove</button></div>`
   :`<button class="pick" data-act="artPick" aria-label="Add character art"></button><div class="ph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg><span>Add character art</span><small>Click or drop an image</small></div>`;
}
function shrink(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const OK_TYPES=['image/png','image/jpeg','image/gif','image/webp'];
async function setArt(file){
  if(!file||!/^image\//.test(file.type)){setStatus('Choose an image file (PNG, JPG, GIF or WebP).');return}
  setStatus('Adding art…');
  try{
    if(assets){let blob=file;
      if(!OK_TYPES.includes(file.type)||file.size>19e6){const d=await shrink(file,1600,.88);blob=await (await fetch(d)).blob();}
      const r=await assets.upload(blob,{type:blob.type||'image/jpeg'});const old=S.art&&S.art.id;S.art={id:r.id};
      if(old&&old!==r.id)assets.delete(old).catch(()=>{});
    } else { let d=await shrink(file,700,.82); if(d.length>180000)d=await shrink(file,480,.75); S.art={data:d}; }
    renderArt();scheduleSave(true);
  }catch(e){setStatus(e&&e.code==='too_large'?'That image is too large. Choose one under 20 MB.':'Couldn’t add that image. Try a PNG or JPG.')}
}

  return {ac:o('ac.total'),touch:o('ac.touch'),ff:o('ac.ff'),fort:o('sv.fort'),ref:o('sv.ref'),will:o('sv.will'),
    rv:3,init:t('init'),speed:t('speed'),cmb:t('cmb'),cmd:t('cmd'),perception:t('sk.perception'),neg:A.M.neg||0,

/* Namfoodle’s performances reach the party: his sheet posts party/perform, one section per performance stamped with when it changed */
function watchPartyPerform(db){
  const ME='sinafey';
  db.doc('party/perform').onSnapshot(s=>{
    if(!s.exists)return;const d=s.data()||{},seen=S.partySeen=S.partySeen||{},pp=S.partyPerf=S.partyPerf||{},ch=[];let touched=false;
    if(S.partyCourageAt&&!seen.courage)seen.courage=S.partyCourageAt;
    const sec=(k,fn)=>{const x=d[k];if(!x||!x.at||seen[k]===x.at)return;seen[k]=x.at;touched=true;fn(x)};
    const mine=x=>!!x.on&&(x.targets||[]).includes(ME);
    sec('courage',x=>{const b=Math.floor(+x.bonus);if(b>0)S.courage=b;if(!!S.cond.courage!==!!x.on)ch.push(x.on?`Inspire Courage ${sg(cBonus())}`:'Inspire Courage ended');S.cond.courage=!!x.on});
    sec('greatness',x=>{const on=mine(x);
      if(on&&!S.cond.pgreat){const cm=conMod(),r=Math.max(2,1+Math.floor(Math.random()*10)+1+Math.floor(Math.random()*10)+2*cm),old=n(S.hp.temp);S.hp.temp=Math.max(old,r);S.partyGhp=S.hp.temp-old;hpLog(`Inspire Greatness: 2d10 ${sg(2*cm)} = ${r} temp HP`)}
      if(!on&&S.cond.pgreat&&n(S.partyGhp)){const t=Math.min(n(S.hp.temp),n(S.partyGhp));S.hp.temp=n(S.hp.temp)-t;S.partyGhp=0;if(t)hpLog(`Inspire Greatness ended: −${t} temp HP`)}
      if(on!==!!S.cond.pgreat)ch.push(on?'Inspire Greatness':'Inspire Greatness ended');S.cond.pgreat=on});
    sec('heroics',x=>{const on=mine(x);if(on!==!!S.cond.pheroics)ch.push(on?'Inspire Heroics':'Inspire Heroics ended');S.cond.pheroics=on});
    sec('competence',x=>{const on=!!x.on&&x.target===ME;pp.compSkill=x.skill;pp.compSkillName=x.skillName;pp.compBonus=x.bonus;if(on!==!!S.cond.pcomp)ch.push(on?`Inspire Competence on ${x.skillName}`:'Inspire Competence ended');S.cond.pcomp=on});
    sec('countersong',x=>{pp.counter=x.perform;if(!!x.on!==!!S.cond.pcounter)ch.push(x.on?'Countersong':'Countersong ended');S.cond.pcounter=!!x.on});
    sec('distraction',x=>{pp.distract=x.perform;if(!!x.on!==!!S.cond.pdistract)ch.push(x.on?'Distraction':'Distraction ended');S.cond.pdistract=!!x.on});
    /* a heal is a one-off: only one from the last 15 minutes lands, so a sheet opened later doesn't heal again */
    sec('soothing',x=>{if(!x.id||Date.now()-Date.parse(x.at)>9e5)return;const mx=compute(true).O['hp.max'].n,bf=n(S.hp.cur);S.hp.cur=Math.min(mx,bf+Math.floor(+x.heal||0));
      ['fatigued','sickened','shaken'].forEach(c=>S.cond[c]=false);hpLog(`Namfoodle’s Soothing Performance: healed ${S.hp.cur-bf}`);ch.push(`Soothing Performance healed ${S.hp.cur-bf}`)});
    if(!touched)return;render();if(ch.length)setStatus('Namfoodle: '+ch.join(', '));scheduleSave(true);
  },()=>{});
}

}function pushLink(){const rep=Object.assign(dmReport(),{live:liveStats(),restAt:S.lastPartyRest||''});try{localStorage.setItem('saviors-link-sinafey',JSON.stringify(rep))}catch(e){}if(window.sheetsReport)window.sheetsReport('sinafey',rep)}
/* live sync through ntfy.sh, same as the other sheets: the shared phrase becomes a private topic */
function syncHost(){try{return localStorage.getItem('saviors-sync-host')||'https://ntfy.sh'}catch(e){return 'https://ntfy.sh'}}
function syncTopic(phrase){const p=String(phrase||'').trim().toLowerCase();if(!p)return '';
  const h=(s,seed)=>{let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
    a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
    return (b>>>0).toString(16).padStart(8,'0')+(a>>>0).toString(16).padStart(8,'0')};
  return 'saviors-'+h(p,1)+h(p,7)}
let syncLast='',syncTimer=null,syncState={ok:true,msg:'',at:null},dmOpen=false;
function syncSend(force){const topic=syncTopic((S.sync||{}).phrase);if(!topic)return;clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    const rep=dmReport();let body=JSON.stringify(rep);

    catch(e){syncState={ok:false,msg:e.message==='429'?'Too many updates right now; the next change will try again':'Couldn’t reach the sync service from here (check the internet connection; the online claude.ai version can’t send, use the file version)',at:null};}
    updSync();},force?0:2500)}
function updSync(){const el=document.getElementById('sync-status');if(!el)return;const ph=(S.sync||{}).phrase;
  el.className=syncState.ok?'muted':'miss';
  el.textContent=!ph?'Off: type the same phrase the DM uses':syncState.msg?syncState.msg+(syncState.at?' at '+syncState.at.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''):'On: updates go out after each change'}

   <p class="note" style="margin:0">Live: everything on this sheet (HP, AC, saves, conditions and daily uses) reaches the DM’s party sheet a few seconds after each change. When the DM calls a long rest from the party sheet, it’s applied here too.</p>   ${L.length?`<div class="hplog">${L.map(e=>`<div><span>${esc(e.txt)}</span><b>${esc(new Date(e.t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</b></div>`).join('')}<button class="btn x" data-act="sdLogClear">Clear log</button></div>`:'<p class="muted" style="margin:0">Shadow jumps, power uses and rests show up here.</p>'}

/* ---------- persistence ---------- */
let dbRef=null,statusText='',saveTimer=null,saving=false,dirty=false,readOnly=false;
function setStatus(t){statusText=t;const el=document.getElementById('status');if(el)el.textContent=t}
function scheduleSave(now){if(readOnly)return;dirty=true;setStatus('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(flush,now?50:700)}
async function flush(){
  if(saving||!dirty)return;saving=true;dirty=false;setStatus('Saving…');
  const data=clone(S);pushLink();
  try{
    if(dbRef){await dbRef.set(data);setStatus('Saved');}
    else{setStatus(ls.set('sinafey-sheet',JSON.stringify(data))?'Saved in this browser':'Not saved: storage is blocked here');}
  }catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;setStatus('View only: changes aren’t saved');}
    else if(e&&e.code==='unavailable'){dirty=true;setStatus('Connection hiccup, retrying…');setTimeout(flush,1500+Math.random()*1000);}
    else{dirty=true;setStatus('Not saved. Edit any field to try again.');}
  }
  saving=false;if(dirty&&!readOnly)flush();
}
/* sheets saved before her real stats were added (v1, example build) are replaced by her real sheet; any art is kept */
let migrated=false;
const newId=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ATK_IDS=[[/phantom/i,'phantom'],[/whisper/i,'whisper'],[/vampiric/i,'vampiric'],[/venom/i,'venom'],[/star/i,'starknife']];
function load(d){
  if(!d||(d.v||1)<2){migrated=true;const s=clone(DEFAULT);if(d&&d.art)s.art=d.art;return s}
  const s=merge(DEFAULT,d);
  s.attacks.forEach(a=>{if(!a.id){const m=ATK_IDS.find(([r])=>r.test(a.name||''));a.id=m&&!s.attacks.some(x=>x.id===m[1])?m[1]:newId()}});
  if((d.v||1)<3){migrated=true;const ord=ATK_IDS.map(x=>x[1]);
    s.attacks.sort((a,b)=>{const i=ord.indexOf(a.id),j=ord.indexOf(b.id);return (i<0?99:i)-(j<0?99:j)});
    if(typeof s.atkNotes==='string')s.atkNotes=s.atkNotes.replace(/\nTwo-weapon fighting, melee[^\n]*\nTwo-weapon fighting, ranged[^\n]*/,'')+'\nHer paper sheet listed two-weapon fighting as 17 / 20 / 12 / 16.';
    s.v=3;}
  if((d.v||1)<4){migrated=true;
    /* v4: ring of protection moves into the AC items table; healing potions get their own table */
    if(!d.acItems){s.acItems=[];if(n(s.ac.deflection)){s.acItems.push({name:'Ring of Protection +'+n(s.ac.deflection),slot:'Ring',type:'deflection',bonus:n(s.ac.deflection),on:true});s.ac.deflection=0;}}
    if(!d.potions){const pots=[];
      s.gear=(s.gear||[]).filter(g=>{const m=String(g.item||'').match(/^potion of (cure (light|moderate|serious|critical) wounds)\s*(?:×\s*(\d+))?/i);if(!m)return true;
        const std={light:['1d8',1],moderate:['2d8',3],serious:['3d8',5],critical:['4d8',7]}[m[2].toLowerCase()];const dd=String(g.desc||'').match(/(\d+d8)\s*\+\s*(\d+)/);
        pots.push({name:m[1].replace(/\b\w/g,c=>c.toUpperCase()),dice:dd?dd[1]:std[0],bonus:dd?+dd[2]:std[1],qty:m[3]?+m[3]:1});return false;});
      s.potions=pots;}
    s.v=4;}
  if((d.v||1)<5){migrated=true;
    /* v5: her attacks use Dex for attack and damage (off-hand gets half) */
    (s.attacks||[]).forEach(a=>{a.abil='dex';if(a.dmgAbil!=='none')a.dmgAbil=a.dmgAbil==='str05'?'dex05':'dex';});
    s.v=5;}
  if((d.v||1)<6){migrated=true;
    /* v6: each Phantom Dagger soul charge gives +1 attack and +1 damage */
    (s.attacks||[]).forEach(a=>{if(a.id==='phantom'&&typeof a.desc==='string')a.desc=a.desc.replace('its soul gives the wielder +1 attack and +1d6 necrotic damage, up to +3 and 3d6.','its soul gives the wielder +1 to attack and damage, up to +3.')});
    s.v=6;}
  return s;
}
async function boot(){
  /* a newer downloaded file brings a newer sheet: use it, and keep the older browser copy aside */
  let local=ls.get('sinafey-sheet');const seedAt=window.SHEET_SEED_AT||'';
  if(window.SHEET_SEED&&seedAt&&ls.get('sinafey-seed-at')!==seedAt){
    if(local)ls.set('sinafey-sheet-before-'+seedAt,local);
    try{S=load(clone(window.SHEET_SEED));ls.set('sinafey-seed-at',seedAt);ls.set('sinafey-sheet',JSON.stringify(S));local=null}catch(e){}}
  else if(local){try{S=load(JSON.parse(local))}catch(e){}}
  else if(window.SHEET_SEED){try{S=load(clone(window.SHEET_SEED))}catch(e){}}
  render();setStatus('Loading…');
  const cl=window.claude;
  if(!cl||!cl.use){document.getElementById('backup').hidden=false;setStatus(local?'Saved in this browser':'Edits save in this browser');return}
  try{
    const [db,as]=await Promise.all([cl.use('db'),cl.use('assets').catch(()=>null)]);assets=as;
    if(db){dbRef=db.doc('sheets/sinafey');const snap=await dbRef.get();
      if(snap.exists&&!dirty){S=load(clone(snap.data()));render();if(migrated)scheduleSave(true);}
      setStatus(dirty?'Unsaved changes':'Saved');if(dirty)flush();watchPartyRest(db);watchPartyPerform(db);pushLink();}
    else setStatus('Edits save in this browser');
  }catch(e){setStatus('Couldn’t load saved sheet; showing local copy')}
}

/* level up: snapshot before/after so the summary lists exactly what changed */
let lastSummary='';
function snap(){const C=compute(false);return{lvl:C.L.total,bab:C.bab,base:{...C.base},avail:C.O['sk.avail'].n,hp:hpBase(),
  ab:autoAbilities(C.L).map(a=>a.name+(a.name==='Sneak Attack'?` +${Math.ceil(C.L.rogue/2)}d6`:a.name==='Trap Sense'?` ${sg(Math.floor(C.L.rogue/3))}`:'')+(a.uses?` (${a.uses}${a.key==='sd.jump'?'0 ft.':''}/day)`:'')),L:C.L}}
function levelUp(){
  const $=id=>document.getElementById(id);const v=$('lu-cls').value,how=($('lu-hp')||{}).value||'avg',roll=n(($('lu-roll')||{}).value),fcb=$('lu-fcb').value;
  if(how==='roll'&&!(roll>=1)){setStatus('Enter the hit die roll first.');$('lu-roll').focus();return}
  const before=snap();let idx,added=false;
  if(v.startsWith('row:'))idx=+v.slice(4);
  else{added=true;S.classes.push(v.startsWith('preset:')?Object.assign({preset:v.slice(7),level:0},clone(PRESETS[v.slice(7)])):{preset:'Custom',level:0,name:'New class',hd:8,bab:'3/4',fort:'poor',ref:'poor',will:'good',prestige:false,sp:2,skills:''});idx=S.classes.length-1}
  const c=S.classes[idx];c.level=Math.floor(n(c.level))+1;
  const hd=Math.max(1,n(c.hd)||8);const die=how==='max'?hd:how==='roll'?Math.min(hd,Math.floor(roll)):avgHD(hd);
  if(fcb==='hp')S.fcbHp=n(S.fcbHp)+1; if(fcb==='skill')S.fcbSkill=n(S.fcbSkill)+1;
  let gain=0;
  if(S.hp.mode!=='auto'){gain=Math.max(1,die+conMod())+(fcb==='hp'?1:0);S.hp.max=n(S.hp.max)+gain;}
  const after=snap();const delta=after.hp-before.hp;S.hp.cur=n(S.hp.cur)+delta;
  (S.levelLog=S.levelLog||[]).push({row:idx,added,gain,delta,fcb});
  const li=[];const ch=(a,b)=>a===b?`${sg(b)} (no change)`:`${sg(a)} → <b>${sg(b)}</b>`;
  li.push(`Hit points ${before.hp} → <b>${after.hp}</b> (+${delta}${S.hp.mode!=='auto'?`: ${how==='avg'?'average':how==='max'?'max':'rolled'} ${die} + Con ${sg(conMod())}${fcb==='hp'?' + 1 favored class':''}`:''})`);
  li.push(`Base attack ${ch(before.bab,after.bab)}`);
  li.push(`Base saves: Fort ${ch(before.base.fort,after.base.fort)}, Ref ${ch(before.base.ref,after.base.ref)}, Will ${ch(before.base.will,after.base.will)}`);
  li.push(`Skill ranks to spend: <b>+${after.avail-before.avail}</b> (max ranks per skill is now ${after.lvl})`);
  const gained=after.ab.filter(x=>!before.ab.includes(x));if(gained.length)li.push(`New or improved: <b>${gained.map(esc).join(', ')}</b>`);
  const cl=c.level;if((c.preset==='Rogue'&&cl%2===0)||(c.preset==='Shadowdancer'&&cl%3===0))li.push('<b>Choose a rogue talent</b> (add it under Class Abilities)');
  if(after.lvl%2===1)li.push(`<b>Choose a feat</b> (character level ${after.lvl})`);
  if(after.lvl%4===0)li.push('<b>+1 to an ability score</b> (every 4th character level)');
  if(c.preset==='Custom')li.push('Set this class’s hit die, BAB, saves, skill points and class skills in the table below.');
  lastSummary=`<div class="summary"><h3>Level ${after.lvl}: ${esc(c.name)} ${cl}</h3><ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}
function undoLevel(){
  const e=(S.levelLog||[]).pop();if(!e)return;const c=S.classes[e.row];if(!c)return;
  c.level=Math.max(0,Math.floor(n(c.level))-1);
  if(S.hp.mode!=='auto')S.hp.max=n(S.hp.max)-e.gain;
  S.hp.cur=n(S.hp.cur)-e.delta;
  if(e.fcb==='hp')S.fcbHp=Math.max(0,n(S.fcbHp)-1); if(e.fcb==='skill')S.fcbSkill=Math.max(0,n(S.fcbSkill)-1);
  if(e.added&&c.level<=0)S.classes.splice(e.row,1);

}

/* shadow FX, one per power, each on its own card and gone within 7 seconds:
   Shadow Jump: a Nightcrawler-style burst of smoke and the card blinks out and back
   Shadow Power: the card darkens, then bursts into purple sparkles
   Shadow Call: the card darkens and a small shadow figure rises, waves, and fades after 5 seconds
   Shadow Illusion: the card darkens for a moment */
const FX=(()=>{
  let cv,ctx,W=0,H=0,parts=[],flashes=[],raf=0,last=0;
  const reduce=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
  const MAX_MS=7000;
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0)}
  function ensure(){if(cv)return;cv=document.createElement('canvas');cv.className='fx';cv.setAttribute('aria-hidden','true');document.body.appendChild(cv);ctx=cv.getContext('2d');size();addEventListener('resize',size)}
  const cardOf=k=>{const p=document.querySelector(`.power .pip[data-k="${k}"]`);return p?p.closest('.power'):null};
  /* every effect registers its cleanup; a hard stop at 7 s guarantees the card is back to normal */
  function guard(card,cleanup){const t=setTimeout(cleanup,MAX_MS);return()=>{clearTimeout(t);cleanup()}}
  function shade(card,inMs,holdMs,outMs){
    const o=document.createElement('div');o.className='fx-shade';card.appendChild(o);const tot=inMs+holdMs+outMs;
    const an=o.animate([{opacity:0},{opacity:1,offset:inMs/tot,easing:'linear'},{opacity:1,offset:(inMs+holdMs)/tot,easing:'ease-in'},{opacity:0}],{duration:tot,easing:'ease-out',fill:'forwards'});
    an.onfinish=()=>o.remove();
    return()=>{an.cancel();o.remove()};
  }
  function start(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
  function frame(ts){
    const dt=Math.min(.05,(ts-last)/1000);last=ts;ctx.clearRect(0,0,W,H);
    flashes=flashes.filter(f=>(f.age+=dt)<f.life);
    for(const f of flashes){const p=f.age/f.life,r=f.r*(0.4+p*1.2);const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
      g.addColorStop(0,`rgba(232,214,255,${.85*(1-p)})`);g.addColorStop(.4,`rgba(150,100,230,${.45*(1-p)})`);g.addColorStop(1,'rgba(60,30,110,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,6.283);ctx.fill();}
    parts=parts.filter(q=>(q.age+=dt)<q.life);
    for(const q of parts){const p=q.age/q.life;
      if(q.kind==='smoke'){
        q.vx*=Math.pow(q.drag,dt*60);q.vy=q.vy*Math.pow(q.drag,dt*60)-q.rise*dt*60;q.x+=q.vx*dt*60;q.y+=q.vy*dt*60;q.r+=q.g*dt*60*(1-p*.7);
        const a=(p<.06?p/.06:Math.pow(1-(p-.06)/.94,1.4))*q.a;const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r);
        g.addColorStop(0,`rgba(${q.c},${a})`);g.addColorStop(.6,`rgba(${q.c},${a*.55})`);g.addColorStop(1,`rgba(${q.c},0)`);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.fill();
      }else{ /* sparkle: four-point star with glow, twinkling as it drifts and slows */
        q.vx*=Math.pow(.94,dt*60);q.vy=q.vy*Math.pow(.94,dt*60)+.02*dt*60;q.x+=q.vx*dt*60;q.y+=q.vy*dt*60;q.tw+=dt*q.ts;
        const a=(p<.1?p/.1:1-(p-.1)/.9)*(.55+.45*Math.abs(Math.sin(q.tw)));const s=q.s*(1+.4*Math.sin(q.tw*1.3));
        ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot+q.age*.8);ctx.globalAlpha=a;ctx.shadowColor=q.c;ctx.shadowBlur=10;ctx.fillStyle=q.c;
        ctx.beginPath();ctx.moveTo(0,-s*2.4);ctx.quadraticCurveTo(0,0,s*2.4,0);ctx.quadraticCurveTo(0,0,0,s*2.4);ctx.quadraticCurveTo(0,0,-s*2.4,0);ctx.quadraticCurveTo(0,0,0,-s*2.4);ctx.fill();
        ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,s*.45,0,6.283);ctx.fill();ctx.restore();}
    }

  }
  /* Shadow Jump: "bamf". A flash, then a dense cloud of indigo-black smoke billows out fast and hangs before thinning. The card blinks out and reappears from the smoke. */
  function jump(card,x,y){
    ensure();const r=card.getBoundingClientRect();

/* attack & damage roll helper: rolls live only in this view (not saved) */
const rolls={};
function threatFrom(crit){const m=String(crit||'').match(/(\d+)\s*[–-]\s*20/);return m?+m[1]:20}
function diceIn(str){return [...String(str||'').matchAll(/(\d*)d(\d+)/g)].map(m=>[+(m[1]||1),+m[2]])}
function rollDice(list){let tot=0;const parts=[];list.forEach(([c,s])=>{let sub=0;for(let i=0;i<c;i++)sub+=1+Math.floor(Math.random()*s);tot+=sub;parts.push(`${c}d${s}: ${sub}`)});return{tot,parts}}
function rollBox(key,its){const r=rolls[key]||{};

   ${its&&its.length>1?`<select data-roll="${key}.it" aria-label="Which attack">${its.map((l,k)=>`<option value="${k}"${n(r.it)===k?' selected':''}>${ORD[k]} attack ${l}</option>`).join('')}</select>`:''}
   <span class="rgrp"><label class="rf">d20 <input type="number" min="1" max="20" data-roll="${key}.d20" value="${r.d20??''}" aria-label="d20 roll"></label><span class="rres" id="ra-${key}"></span></span>
   <label class="rf critbox"><input type="checkbox" class="cs" data-roll="${key}.crit" ${r.crit?'checked':''}> Crit</label>
   <span class="rgrp"><label class="rf">Damage dice <input type="number" min="0" data-roll="${key}.dmg" value="${r.dmg??''}" aria-label="Total of weapon damage dice rolled"></label>${rolls.sneak?`<label class="rf sneakbox">Sneak <span class="snn"></span> <input type="number" min="0" data-roll="${key}.sn" value="${r.sn??''}" aria-label="Sneak attack dice total"></label>`:''}<span class="rres" id="rd-${key}"></span></span>
  </div>`}
function rollInfo(key,C){
  if(key[0]==='t'){const x=(C.twf||[])[+key.slice(1)];return x?{hit:x.hit,db:x.db,dmgT:x.dmg,crit:x.w.crit}:null}
  const i=+key.slice(1),a=S.attacks[i];if(!a||!C.O[`atk.${i}.hit`])return null;const it=n((rolls[key]||{}).it);
  return{hit:C.O[`atk.${i}.hit`].n-5*it,db:C.O[`atk.${i}.dmg`].n,dmgT:C.O[`atk.${i}.dmg`].t,crit:a.crit};

function updRolls(C){
  const sn=rolls.sneak?Math.ceil(levels().rogue/2):0;const roundDmg={};

/* round total: adds the damage of every attack in the sequence that has damage entered and isn't marked MISS */
function roundTotals(C,roundDmg){
  ['t'].forEach(p=>{const box=document.getElementById('rt-'+p);if(!box)return;const parts=[];let sum=0,miss=0;
    document.querySelectorAll(`[data-rk^="${p}"]`).forEach(el=>{const k=el.dataset.rk;if(rowHit(k,C)===false){miss++;return}if(roundDmg[k]==null)return;
      parts.push(`${ORD[+k.slice(1)]} ${roundDmg[k]}`);sum+=roundDmg[k];});
    box.innerHTML=`<span class="lbl">Round total</span>`+(parts.length
      ?` <b class="rtot">${sum}</b> damage from ${parts.length} hit${parts.length>1?'s':''} <small class="muted">(${parts.join(' + ')})${miss?` · ${miss} miss${miss>1?'es':''} not counted`:''}</small>`

/* true = hit, false = miss, null = unknown (no d20 yet, or no target AC entered) */

function diceRange(info){const list=diceIn(info.dmgT);return{min:list.reduce((a,[c])=>a+c,0),max:list.reduce((a,[c,s])=>a+c*s,0),txt:list.map(([c,s])=>`${c}d${s}`).join(' + ')}}

   case 'light':S.comp.light=b.dataset.v;render();break;
   case 'goCompCond':condScope='comp';tab='conditions';render();return;
   case 'scope':condScope=b.dataset.v;render();return;
   case 'cond':{const m=condScope==='comp'?S.comp.cond:S.cond;m[b.dataset.id]=!m[b.dataset.id];
     if(b.dataset.id==='enlarge'&&m.enlarge)m.reduce=false;if(b.dataset.id==='reduce'&&m.reduce)m.enlarge=false;render();break;}
   case 'neg':{const p=condScope==='comp'?'comp.neg':'neg';setP(p,Math.max(0,n(getP(p))+n(b.dataset.d)));render();break;}
   case 'clearCond':if(condScope==='comp'){S.comp.cond={};S.comp.neg=0}else{S.cond={};S.neg=0}render();break;
   case 'artPick':document.getElementById('artfile').click();return;
   case 'artRemove':{const old=S.art&&S.art.id;S.art=null;if(old&&assets)assets.delete(old).catch(()=>{});renderArt();break;}
   default:return;
  }
  scheduleSave();});
document.getElementById('artfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)setArt(f)});
document.getElementById('importfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.info||!d.classes)throw 0;S=load(d);render();scheduleSave(true);setStatus('Backup restored')}
    catch(err){setStatus('That file isn’t a character sheet backup.')}};r.readAsText(f)});
const artEl=document.getElementById('art');
artEl.addEventListener('dragover',e=>{e.preventDefault();artEl.classList.add('drag')});
artEl.addEventListener('dragleave',()=>artEl.classList.remove('drag'));
artEl.addEventListener('drop',e=>{e.preventDefault();artEl.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)setArt(f)});

boot();
})();
</script>
