<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Namfoodle · Pathfinder Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: persistent header (identity left, portrait top-right, stat strip below), sticky tab bar, one panel grid per tab */
:root{
  --bg:#f1ece2; --surface:#faf7f1; --sunk:#e9e1d2; --ink:#221a10; --muted:#6b5c46; --line:#dccfb8;
  --accent:#8a5a12; --accent-ink:#ffffff; --accent-soft:#f1e3c4;
  --bad:#b3261e; --bad-soft:#f6dedb; --buff:#16657f; --buff-soft:#d7ecf3; --good:#2c7a4b;
  --storm:#2d5aa8; --storm-soft:#dde6f6;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16120c; --surface:#1f1910; --sunk:#18130c; --ink:#f1e8d8; --muted:#b5a585; --line:#3a3020;
  --accent:#e8b55a; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7ccbe6; --buff-soft:#173039; --good:#7fcf9b;
  --storm:#9dbcff; --storm-soft:#1b2640; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16120c; --surface:#1f1910; --sunk:#18130c; --ink:#f1e8d8; --muted:#b5a585; --line:#3a3020;
  --accent:#e8b55a; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --bad:#f2867c; --bad-soft:#3a1d1c; --buff:#7ccbe6; --buff-soft:#173039; --good:#7fcf9b;
  --storm:#9dbcff; --storm-soft:#1b2640; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.05rem;letter-spacing:.06em;color:var(--accent)}
h3{font-size:.95rem;letter-spacing:.05em}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
small{font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:4.2em;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
textarea{width:100%;resize:vertical;min-height:4.5em;line-height:1.4}

/* header */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.ident{display:grid;gap:6px;min-width:0}
.namein{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;border:0;background:transparent;padding:0;width:100%;letter-spacing:.03em}
.namein:hover{background:var(--sunk)}
.sub{font-size:1.05rem;color:var(--muted)}
.sub b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{border:1px solid var(--bad);color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:1px 10px;font-size:.82rem}
.chip.buff{border-color:var(--buff);color:var(--buff);background:var(--buff-soft)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qt{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--buff);color:var(--buff);background:transparent;border-radius:999px;padding:4px 14px 4px 10px;font-weight:700;font-size:.9rem}
.qt::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor}
.qt[aria-pressed=true]{background:var(--buff);color:var(--surface)}
.qt[aria-pressed=true]::before{background:currentColor;border-color:var(--surface)}
.qt.dim{border-color:var(--accent);color:var(--accent)}
.qt.dim[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.souls{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.88rem}
details.more summary{cursor:pointer;color:var(--accent);font-size:.88rem}
details.more p{white-space:pre-line;margin:.4em 0 0;font-size:.92rem}
.ovr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:4px;font-size:.82rem;color:var(--muted)}
.ovr input[type=number]{width:3.6em}
.ovr textarea{min-height:2.4em;font-size:.88rem}
.weapon .wtop{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 18px;align-items:center}
.weapon .wname{display:grid;gap:2px;min-width:0}
.weapon .wname input{font-weight:700;font-size:1.05rem;border-color:transparent;background:transparent;padding-left:0}
.weapon .wname input:hover,.weapon .wname input:focus{border-color:var(--line);background:var(--surface);padding-left:6px}
.weapon .wstat{display:grid;text-align:right}
.weapon .wstat b{font-size:1.2rem}
.weapon .wbtns{display:flex;gap:0}
.btn:disabled{opacity:.3;cursor:default}
@media (max-width:640px){.weapon .wtop{grid-template-columns:1fr 1fr}.weapon .wname{grid-column:1/-1}.weapon .wbtns{grid-column:1/-1}.weapon .wstat{text-align:left}}
.critbox,.sneakbox{font-weight:700}
.roundtot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.rtot{font-size:1.6rem;color:var(--ink)}
.backup{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px;font-size:.9rem}
.pots td{vertical-align:middle}
.pots td:first-child{min-width:16em}
.nowrap{white-space:nowrap}
.geartbl{table-layout:fixed;min-width:640px}
.geartbl .c-item{width:36%}.geartbl .c-desc{width:40%}.geartbl .c-loc{width:14%}.geartbl .c-wt{width:5.5em}.geartbl .c-x{width:2.5em}
.geartbl td input[type=text],.geartbl td select{width:100%}
.havtbl tr.noterow td{border-top:0;padding-top:0;padding-bottom:8px}.havtbl tr.noterow input{font-size:.88rem;color:var(--muted);background:transparent;border-color:transparent;border-bottom:1px dashed var(--line);border-radius:0}.havtbl tr.noterow input:hover,.havtbl tr.noterow input:focus{border-color:var(--line);background:var(--surface);color:var(--ink);border-radius:4px}
.geartbl td:first-child input{font-weight:700}
.geartbl tr.future td{color:var(--muted)}
.roll{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.88rem;padding:4px 0}
.roll select{font-size:.85rem}
.rgrp{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rf{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.rf input{width:3.6em}
.rres b{font-size:1.15rem;color:var(--ink)}
.crit{color:var(--good);font-style:normal;font-weight:700}
.miss{color:var(--bad);font-style:normal;font-weight:700}
.rollrow td{border-top:0;padding-top:0}
.rolltools{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.drbox{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:8px 10px;font-size:.88rem}
.hplog{display:grid;gap:2px;font-size:.86rem;border-top:1px solid var(--line);padding-top:6px}
.hplog div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.hplog b{color:var(--ink)}
.hplog .btn{justify-self:start}
.ord{display:inline-block;min-width:2.6em;padding:1px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem}
.lvlup{border-color:var(--accent)}
.summary{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px}
.summary h3{font-size:1.05rem}
.summary ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:3px}
.power .ty{font-size:.85rem;color:var(--muted)}
.pstats{display:flex;flex-wrap:wrap;gap:6px}
.pstats span{background:var(--sunk);border-radius:4px;padding:3px 9px;font-size:.88rem}
.pstats b{color:var(--accent);font-weight:700;margin-right:4px}
.rules p{margin:0 0 .5em;font-size:.94rem}
.spell{background:var(--sunk);border-radius:var(--r);padding:10px 12px;margin-top:6px}
.spell dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 8px;font-size:.88rem}
.spell dt{color:var(--muted)}
.spell dd{margin:0}
.spell p{white-space:pre-line;font-size:.92rem;margin:0 0 6px}
.locked{opacity:.55}
.prog tr.cur td{background:var(--accent-soft);font-weight:700}
.prog tr.future td{color:var(--muted)}
.example{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;background:var(--accent-soft);border-radius:var(--r);padding:6px 10px}
.example button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;padding:1px 8px;font-size:.8rem}

.art{width:170px;aspect-ratio:4/5;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ph{padding:12px;color:var(--muted);font-size:.85rem;display:grid;gap:6px;justify-items:center}
.art .ph svg{width:34px;height:34px;opacity:.6}
.art .tools{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;justify-content:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .15s}
.art:hover .tools,.art:focus-within .tools{opacity:1}
.art .tools button{background:rgba(255,255,255,.9);color:#1c1a24;border:0;border-radius:4px;font-size:.78rem;padding:2px 8px}
.art.drag{outline:2px dashed var(--accent);outline-offset:3px}
.art .pick{position:absolute;inset:0;background:transparent;border:0}

.strip{display:flex;flex-wrap:wrap;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:8px 14px;border-right:1px solid var(--line);display:grid;gap:0;min-width:70px;flex:1 0 auto}
.stat:last-child{border-right:0}
.stat .v{font-size:1.35rem;font-weight:500;line-height:1.2}
.hpstat{flex:3 1 220px}
.hpbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .2s}
.hpbar i.low{background:var(--bad)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:18px;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:10px 14px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:.72rem;line-height:18px;text-align:center}
.status{margin-left:auto;align-self:center;font-size:.78rem;color:var(--muted);white-space:nowrap;padding-inline:8px}

.page{display:grid;gap:18px;margin-top:18px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel>header .muted{font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:center;padding:4px 4px;white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:4px;text-align:center;border-top:1px solid var(--line);vertical-align:middle}
td.tot{font-weight:700;font-size:1.08rem;min-width:3em}
.op{color:var(--muted);font-size:.8rem;padding:0 1px}
[data-d=down]{color:var(--bad)!important}
[data-d=up]{color:var(--buff)!important}
.abtbl td:first-child{font-family:var(--f-display);font-size:1.05rem;text-align:left}
.mod{display:inline-block;min-width:2.6em;padding:2px 6px;border-radius:4px;background:var(--accent-soft);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.kv label{font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 14px}
.field{display:grid;gap:2px;min-width:0}
.field input,.field select{width:100%}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big3>div{background:var(--sunk);border-radius:var(--r);padding:8px 4px}
.big3 .v{font-size:1.7rem;font-weight:500;line-height:1.1}
.formula{font-size:.88rem;color:var(--muted);line-height:1.8}
.formula b{color:var(--ink)}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.note.warn{border-color:var(--bad);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 10px;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.x{border:0;background:transparent;color:var(--muted);padding:2px 6px}
.btn.x:hover{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cs{width:16px;height:16px;accent-color:var(--accent)}
.skilltbl td:nth-child(2){text-align:left;white-space:nowrap}
.skilltbl input.sub{width:7.5em}
.untr{color:var(--muted);font-weight:400!important}
.counter{font-size:.9rem}
.counter b.over{color:var(--bad)}

/* abilities list */
.ab-list{display:grid;gap:0}
.ab{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ab:first-child{border-top:0}
.ab .lv{font-family:var(--f-display);color:var(--accent);font-size:.95rem;padding-top:1px}
.ab .nm{font-weight:700}
.ab .ty{font-size:.78rem;color:var(--muted);margin-left:4px}
.ab .ds{color:var(--ink);font-size:.93rem;margin-top:2px}
.pips{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:8px;vertical-align:middle}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;padding:0}
.pip[aria-pressed=true]{background:var(--accent)}
.custom{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.custom .row input.nm{flex:1 1 200px;font-weight:700}

/* conditions */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.condgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.cond{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0}
.cond .n{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.cond .e{font-size:.8rem;color:var(--muted);line-height:1.3}
.cond:hover{border-color:var(--accent)}
.cond[aria-pressed=true]{border-color:var(--bad);background:var(--bad-soft)}
.cond[aria-pressed=true] .n::after{content:"ON";font-size:.68rem;letter-spacing:.08em;color:var(--bad);align-self:center}
.cond.buffc[aria-pressed=true]{border-color:var(--buff);background:var(--buff-soft)}
.splhd{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.prepl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:6px}
.pbtns{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prep{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 6px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:5px 6px 6px 10px;font-size:.92rem}
.prep.cast .pn{text-decoration:line-through;color:var(--muted)}
.prep .btn,.spr .btn{padding:1px 8px;font-size:.8rem}
.pd{grid-column:1/-1;font-size:.82rem;color:var(--muted);line-height:1.35}
.fxtag{color:var(--accent);font-weight:600;letter-spacing:.03em}
.splist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:6px;margin-top:6px}
.spr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px 7px 10px;font-size:.92rem}
.spr[hidden]{display:none}
.spr a{color:var(--accent)}
.slots{display:grid;gap:4px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.slot input[type=text]{width:100%}
.slot.cast input[type=text]{text-decoration:line-through;color:var(--muted)}
.splv{display:grid;gap:8px}
.splv .hd{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.splv .hd h3{font-size:1.05rem}
.charge{display:inline-flex;align-items:center;gap:6px}
.charge b{min-width:2.2em;text-align:center;font-size:1.1rem}
/* bard additions */
.hpctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hpctl input{width:5em}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:28px;height:26px;padding:0}
.net{display:grid;gap:3px;font-size:.92rem}
.net div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:3px}
.net .neg{color:var(--bad);font-weight:700}.net .pos{color:var(--buff);font-weight:700}
.seg button:disabled{opacity:.45;cursor:default}
/* bardic performance */
.perfnow{display:grid;gap:8px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}
.perfnow .big{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.03em}
.rounds{display:flex;flex-wrap:wrap;gap:3px}
.rounds i{width:11px;height:11px;border-radius:2px;background:var(--accent);display:block}
.rounds i.u{background:transparent;outline:1.5px solid var(--line);outline-offset:-1.5px}
.perfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.perf{display:grid;gap:6px;align-content:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.perf.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.perf.linger{border-style:dashed;border-color:var(--accent)}
.perf .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.perf .top b{font-size:1.02rem}
.perf .lv{font-family:var(--f-display);color:var(--accent);font-size:.85rem}
.perf .e{font-size:.88rem;color:var(--ink)}
.perf .k{display:flex;flex-wrap:wrap;gap:4px}
.perf .k span{background:var(--sunk);border-radius:4px;padding:1px 7px;font-size:.8rem}
.perf .k b{color:var(--accent)}
.perf .act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.perf.locked{opacity:.5}
/* Mythcarver: silvered blade */
.vestige{border-color:#9aa3ad;background:linear-gradient(160deg,var(--surface) 60%,rgba(170,180,195,.14))}
.vestige>header h2{color:#5d6773}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vestige>header h2{color:#d4dbe3}}
:root[data-theme="dark"] .vestige>header h2{color:#d4dbe3}
.state{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

const clone=o=>JSON.parse(JSON.stringify(o));
function merge(d,s){ if(Array.isArray(d)||typeof d!=='object'||d===null) return s===undefined?d:s;
  const o={...d}; if(s&&typeof s==='object'&&!Array.isArray(s)) for(const k in s) o[k]=(k in d)?merge(d[k],s[k]):s[k]; return o; }
let S=clone(DEFAULT);
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const sg=v=>(v>=0?'+':'−')+Math.abs(v);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getP(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S)}
function setP(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks.at(-1)]=v}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const dice=(c,s)=>{let t=0;for(let i=0;i<c;i++)t+=1+Math.floor(Math.random()*s);return t};

const area=(p,o={})=>`<textarea id="i-${p.replace(/\W/g,'_')}" data-p="${p}" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}" aria-label="${esc(o.label||p)}">${esc(getP(p))}</textarea>`;
const sel=(p,opts,o={})=>`<select id="i-${p.replace(/\W/g,'_')}" data-p="${p}"${o.rr?' data-rr':''} aria-label="${esc(o.label||p)}">${opts.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}"${String(getP(p))===String(v)?' selected':''}>${esc(l)}</option>`}).join('')}</select>`;

function agg(list){

      if(e.v>=0){ if(ty==='untyped'||ty==='dodge'||ty==='circumstance') tot+=e.v; else pos[ty]=Math.max(pos[ty]||0,e.v); }
      else { if(ty==='untyped') tot+=e.v; else neg[ty]=Math.min(neg[ty]||0,e.v); } }
    for(const k in pos) tot+=pos[k]; for(const k in neg) tot+=neg[k]; out[t]=tot;}
  return out;
}

}

/* His performances reach the party: this sheet posts party/perform, one section per performance, each stamped with the time it last changed.
   The other sheets watch it and switch their own bonuses on and off. Greatness, Heroics and Competence go only to the allies picked. */
const PARTY=[['namfoodle','Namfoodle (himself)'],['drax','Drax'],['sinafey','Sinafey'],['ensley','Ensley'],['lork','Lork'],['vex','Vex’ahlia'],['owlbear','Owlbear Man']];

const pname=k=>(PARTY.find(x=>x[0]===k)||[k,k])[1].replace(' (himself)','');
let cloudDb=null,lastPerf=null,lastDoc={};
function perfSections(){
  const C=compute(true),on=id=>perfActive(id),t=id=>on(id)?tgOf(id).who.filter(k=>k!=='namfoodle'):[];
  const cs=tgOf('competence'),sk=SKILLS.find(s=>s.k===cs.skill);
  return {courage:{on:on('courage'),bonus:icBonus()},
    greatness:{on:on('greatness'),targets:t('greatness')},
    heroics:{on:on('heroics'),targets:t('heroics')},
    competence:{on:on('competence'),target:t('competence')[0]||'',skill:cs.skill||'',skillName:sk?sk.n:'',bonus:compBonus()},
    countersong:{on:on('countersong'),perform:performTotal('string',C)},
    distraction:{on:on('distraction'),perform:performTotal('dance',C)},
    soothing:S.perf.soothe?{id:S.perf.soothe.id,heal:S.perf.soothe.heal,all:true}:{id:''}};
}
function postPerf(){
  if(!cloudDb||lastPerf===null)return;
  const cur=perfSections(),now=new Date().toISOString(),doc={by:'namfoodle'};let changed=false;
  for(const k in cur){const key=JSON.stringify(cur[k]);if(lastPerf[k]===key&&lastDoc[k]){doc[k]=lastDoc[k];continue}
    lastPerf[k]=key;doc[k]=Object.assign({},cur[k],{at:now});changed=true;}
  if(!changed)return;lastDoc=doc;
  cloudDb.doc('party/perform').set(doc).catch(()=>{lastPerf=null});
}

function openPicker(id,start){

  dlg.innerHTML=`<form method="dialog"><h2>${esc(p.n)}</h2><p class="muted">Pick ${mx===1?'one':`up to ${mx}`} within 30 ft.${P.self?' He can include himself.':''}</p>
   <div class="pk">${list.map(([k,l])=>`<label><input type="${mx===1?'radio':'checkbox'}" name="who" value="${k}" ${tg.who.includes(k)?'checked':''}> ${esc(l)}${k==='namfoodle'||LINKED.includes(k)?'':' <small class="muted">(no sheet link yet: tell them)</small>'}</label>`).join('')}</div>
   ${P.skill?`<label class="field"><span class="lbl">Skill</span><select name="skill">${SKILLS.filter(s=>!/\d$/.test(s.k)||s.k.endsWith('1')).map(s=>`<option value="${s.k}"${tg.skill===s.k?' selected':''}>${esc(s.n)}</option>`).join('')}</select></label>`:''}

  document.body.appendChild(dlg);
  const boxes=[...dlg.querySelectorAll('[name=who]')],msg=dlg.querySelector('.pkmsg');
  const lim=()=>{if(mx===1)return;const c=boxes.filter(b=>b.checked).length;boxes.forEach(b=>b.disabled=!b.checked&&c>=mx);msg.textContent=`${c} of ${mx} picked`};
  boxes.forEach(b=>b.addEventListener('change',lim));lim();
  dlg.addEventListener('cancel',()=>dlg.remove());
  dlg.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const ok=!!e.submitter&&e.submitter.value==='ok';
    if(ok){const who=boxes.filter(b=>b.checked).map(b=>b.value);if(!who.length){msg.textContent='Pick at least one first.';return}
      const was=selfIn(id);S.perf.tg=S.perf.tg||{};S.perf.tg[id]={who,skill:P.skill?dlg.querySelector('[name=skill]').value:''};

      render();scheduleSave();}
    dlg.close();dlg.remove();});
  dlg.showModal();
}

/* ---------- spells: spontaneous bard casting ---------- */
function knownOf(l){S.known=S.known||{};const a=S.known[l]=Array.isArray(S.known[l])?S.known[l].filter(x=>String(x||'').trim()):[];return a}

  const lvBlock=l=>{const si=slotInfo(l,C),K=knownOf(l),list=BS[l]||[],cap=si.known,lock=!cap,used=castOf(l),left=Math.max(0,si.total-used),full=K.length>=cap;
    return `<section class="panel splv${lock?' locked':''}" id="spl-${l}"><div class="hd"><h3>${SPL[l]}</h3>
      <span class="muted">${lock?'not yet':`${K.length} / ${cap} known · ${l?`<b>${left}</b> of ${si.total} slots left today`:'cast at will'}`}</span>
      <span class="muted">DC <b>${spDC(l,'',C)}</b></span>
      ${l&&!lock?`<span class="pips" role="group" aria-label="${SPL[l]} slots">${[...Array(Math.min(si.total,20)).keys()].map(i=>`<button class="pip" data-act="slot" data-l="${l}" data-i="${i}" aria-pressed="${i<used}" aria-label="Slot ${i+1}"></button>`).join('')}</span>
      <label class="rf" style="margin-left:auto">Extra slots ${num(`spx.${l}`,{w:'3.4em',rr:1,label:SPL[l]+' extra slots'})}</label>`:''}
      ${knownBase(l,b)?`<label class="rf"${l?'':' style="margin-left:auto"'}>Extra known ${num(`knx.${l}`,{w:'3.4em',rr:1,label:SPL[l]+' extra spells known'})}</label>`:''}</div>
     ${lock?'':`<div class="known">${K.map((nm,i)=>{const t=spTags(nm),bf=SP_BUFF[nm],dsc=spDesc(nm),dc=spDC(l,t,C);
       return `<div class="prep"><span class="pn">${esc(nm)}${bf?' <small class="fxtag" title="Turns on its effect when cast">★ BUFF</small>':''}${tagTxt(t)}${dc!==spDC(l,'',C)?` <small class="muted">DC ${dc}</small>`:''}</span><span class="pbtns">
        ${l?`<button class="btn pri" data-act="spCast" data-l="${l}" data-n="${esc(nm)}"${left?'':' disabled'}>Cast</button>`:''}
        <button class="btn x" data-act="spForget" data-l="${l}" data-i="${i}" aria-label="Remove ${esc(nm)}">✕</button></span>${dsc?`<span class="pd">${esc(dsc)}</span>`:''}</div>`}).join('')||'<span class="muted">No spells known at this level yet. Add them below.</span>'}</div>
     <div class="row"><input type="text" id="spadd-${l}" list="spl-dl-${l}" placeholder="${full?'All spells known':'Type or pick a spell'}" style="width:min(100%,16em)" aria-label="${SPL[l]} spell to learn"${full?' disabled':''}>
      <datalist id="spl-dl-${l}">${list.map(x=>`<option value="${esc(x[0])}">`).join('')}</datalist>
      <button class="btn" data-act="spLearn" data-l="${l}"${full?' disabled':''}>Add known spell</button></div>`}
     <details class="more" id="det-spl-${l}"><summary>All bard ${l?ORD[l-1]+'-level spells':'cantrips'} (${list.length}) with descriptions</summary>
      <input type="search" class="spfilter" data-l="${l}" placeholder="Filter by name or effect" aria-label="Filter spells" style="width:min(100%,16em);margin-top:6px">
      <div class="splist">${list.map(([nm,ds,t])=>`<div class="spr" data-q="${esc((nm+' '+ds).toLowerCase())}"><b>${esc(nm)}${SP_BUFF[nm]?' <small class="fxtag">★ BUFF</small>':''}${tagTxt(t)}</b>${lock||K.includes(nm)?'':`<button class="btn" data-act="spLearnN" data-l="${l}" data-n="${esc(nm)}"${full?' disabled':''}>Know it</button>`}<span class="pd">${esc(ds)}</span></div>`).join('')}</div></details>
    </section>`};
  return `<section class="panel"><header><h2>Bard Spellcasting</h2><span class="muted">Caster level ${out('cl')} · Cha ${out('ab.cha.mod')} · Concentration ${out('conc')}</span>
     <button class="btn" data-act="rest" style="margin-left:auto">New day: refresh slots</button></header>
   <div class="pstats"><span><b>Save DC</b> 10 + spell level + Cha</span><span><b>Melee touch</b> ${out('spatk.melee')}</span><span><b>Ranged touch</b> ${out('spatk.ranged')}</span><span><b>Spell Focus</b> +1 DC on evocation</span><span><b>Magical Linguist</b> +1 DC on language-dependent spells, glyphs, symbols and writing</span><span><b>Arcane spell failure</b> none in light armor</span></div>
   <label class="drbox"><input type="checkbox" class="cs" data-p="cone" ${S.cone?'checked':''}> <span><b>Cone of Clarity in use</b> (swift action): +2 DC on spells with a verbal component. Every DC on this tab includes it while this is ticked.</span></label>
   <div class="scroll"><table class="dctbl"><thead><tr><th class="l">Level</th><th>0</th>${sl.map(l=>`<th>${ORD[l-1]}</th>`).join('')}</tr></thead><tbody>

   <p class="note">Bards cast spontaneously: any spell he knows, using a slot of its level. Press Cast on a spell (or tap a slot pip) to spend a slot. ★ spells also switch on their effect for him. His known spells come from his spell sheet (6/6/6/6/5/4/3, the bard 17 table). The sheet gives 8/8/7/6/5/4 spells per day; the bard 17 table with Cha 24 gives 7/7/7/5/5/3, so the Extra slots boxes make up the difference. Clear them to go by the book.</p>
  </section>
  ${[0,...sl].map(lvBlock).join('')}
  <section class="panel"><header><h2>Scrolls</h2></header><p class="note" style="margin:0">His scrolls are in the mithril scroll case in the party Bag of Holding: ${(S.scrolls||[]).reduce((a,x)=>a+Math.max(0,n(x.qty)),0)} scrolls.</p><div class="row"><button class="btn" data-act="goBag">Open the Bag of Holding</button></div></section>

}

/* ---------- bardic performance ---------- */
function pPerform(){
  const C=compute(true),b=C.L.bard,mx=perfMax(C),used=Math.min(mx,n(S.used.perf)),left=mx-used,cur=perfDef(S.perf.cur),lg=n(S.perf.linger)>0?perfDef(S.perf.lingerOf):null;
  const act=b>=13?'swift':b>=7?'move':'standard';
  const party=p=>{if(lock(p))return '';const ac=S.perf.cur===p.id||lingerOn(p.id);
    if(PICK[p.id]){const tg=tgOf(p.id),sk=SKILLS.find(s=>s.k===tg.skill);return ac?`<div class="pkon"><b>On:</b> ${tg.who.map(pname).map(esc).join(', ')||'nobody'}${sk?` · ${esc(sk.n)}`:''} <button class="btn x" data-act="perfPick" data-id="${p.id}">Change targets</button></div>`:`<small class="muted">Picks up to ${PICK[p.id].max()} when it starts${tg.who.length?`; last time: ${tg.who.map(pname).map(esc).join(', ')}`:''}</small>`}
    if(['courage','countersong','distraction','soothing'].includes(p.id))return `<small class="muted">${ac?'<b>Reaching the party:</b> their sheets show it now.':'Reaches every linked party sheet.'}</small>`;return ''};
  const lock=p=>b<p.lvl;
  const card=p=>{const lock=b<p.lvl,on=S.perf.cur===p.id,li=lingerOn(p.id);
    return `<div class="perf${on?' on':''}${li?' linger':''}${lock?' locked':''}"><div class="top"><span class="lv">Bard ${p.lvl}</span><b>${p.n}</b><small class="muted">${p.kind}</small>${on?'<small class="fxtag">PERFORMING</small>':li?`<small class="fxtag">LINGERING ${n(S.perf.linger)}</small>`:''}</div>
     <div class="e">${p.e(C)}</div>
     <div class="k">${p.k(C).map(([a,v])=>`<span>${a} <b>${v}</b></span>`).join('')}</div>
     ${lock?'':`<div class="act">${p.free?'<small class="muted">Rides on Fascinate: no extra rounds</small>':on?`<button class="btn" data-act="perfStop">Stop</button>`:`<button class="btn pri" data-act="perfStart" data-id="${p.id}"${left<(p.cost||1)?' disabled':''}>${p.cost?`Perform (${p.cost} rounds)`:S.perf.cur?'Switch to this':'Start'}</button>`}
      ${p.id==='dirge'&&vestS().lv>=1&&(on||li)?`<button class="btn" data-act="dread">Mythcarver: mark a dread target</button>`:''}</div>${party(p)}`}
    </div>`};
  return `<section class="panel"><header><h2>Bardic Performance</h2><span class="muted">${mx} rounds per day · starting one is a ${act} action, keeping it up is free</span><button class="btn" data-act="perfReset" style="margin-left:auto">New day: reset rounds</button></header>
   <div class="perfnow">
    <div class="row" style="justify-content:space-between"><span class="big">${cur?`Performing: ${cur.n}`:lg?`${lg.n} lingering`:'Not performing'}</span><span><b style="font-size:1.4rem">${left}</b> <span class="muted">of ${mx} rounds left</span></span></div>
    <div class="rounds" aria-label="${left} of ${mx} rounds left">${[...Array(mx).keys()].map(i=>`<i class="${i<left?'':'u'}"></i>`).join('')}</div>
    ${dmRound!=null?`<p class="note" style="margin:0"><b>Round ${dmRound}</b> on the DM’s initiative tracker: each new round there counts a performance round here by itself, so there’s no need to press Next round.</p>`:''}
    <div class="row">${cur||lg?`<button class="btn${dmRound!=null?'':' pri'}" data-act="perfRound">Next round${cur?' (−1 round)':''}</button>`:''}${cur?`<button class="btn" data-act="perfStop">Stop performing</button>`:''}
     <small class="muted">${cur?(lingers()?'When he stops, the effects linger 2 more rounds (Lingering Performance).':'The effects end when he stops.'):lg?`Effects last ${n(S.perf.linger)} more round${n(S.perf.linger)===1?'':'s'}; starting a new performance ends them.`:'Start a performance below. Each round he keeps it up costs one round.'}</small></div>
   </div>
   <p class="note"><b>His performances reach the party.</b> Courage, Countersong, Distraction and Soothing Performance go to every linked party sheet (Drax, Sinafey, Ensley). Greatness, Heroics and Competence have a limit, so a pop-up asks who they’re on when he starts them; only the picked allies get the bonus, and their bonuses switch off when it ends or stops lingering. Inspire Courage${b>=9?', Inspire Greatness':''}${b>=15?' and Inspire Heroics':''} also change his own numbers when he’s one of the targets. Greatness adds 2d10 ${sg(2*C.ab.con.mod)} temp HP when it starts and takes them away when it ends. Paper sheet: 38 rounds; the rules give 4 + Cha ${C.ab.cha.mod} + 2 × ${b-1} = ${4+C.ab.cha.mod+2*(b-1)} (set your own number on the Class Abilities tab).</p>
  </section>
  <div class="perfgrid">${PERF.map(card).join('')}</div>`;
}

/* ---------- treasures: Mythcarver, Harp of the Storm, Cape of the Mountebank, other item powers ---------- */
function pTreasures(){
  const C=compute(true),V=vestS(),vs=(S.vest||{}).state||'dormant',mi=S.attacks.findIndex(a=>a.vest),cha=C.ab.cha.mod;
  const tier=(lv,h,body)=>`<div class="tier${V.lv>=lv?'':' off'}"><h3>${h}${V.lv>=lv?'':' <small class="muted">(not yet)</small>'}</h3>${body}</div>`;
  const spirit=n(S.used['myth.spirit'])>=1;
  const vest=`<section class="panel vestige"><header><h2>Mythcarver</h2><span class="muted">Shortsword · Legendary · Vestige of Divergence</span></header>
   <p class="muted" style="margin:0;font-style:italic">This silvered blade once belonged to the White Duke himself, and many master bards before him. It resonates with nearby musical tones.</p>
   <div class="state" role="group" aria-label="Vestige state">${Object.entries(VEST).map(([k,v])=>`<button data-act="vstate" data-v="${k}" aria-pressed="${vs===k}"><b>${v.n}</b><small>+${v.b} attack and damage${v.lv>=1?', +1d6 force':''}</small></button>`).join('')}</div>
   ${mi>=0?`<div class="kv"><label>Attack</label><b data-o="atk.${mi}.hit"></b><label>Damage</label><b data-o="atk.${mi}.dmg"></b></div>`:''}
   ${tier(0,'Dormant',`<p class="note" style="margin:0">+2 on attack and damage rolls. While he uses <b>Inspire Greatness</b>, the knowledge and prowess of the sword’s past wielders fill him: +5 luck on melee attacks with it.${perfActive('greatness')?' <b>Active now.</b>':''}</p>`)}
   ${tier(1,'Awakened',`<p class="note" style="margin:0">+3 on attack and damage rolls, and targets it damages take an extra 1d6 force. When he uses <b>Dirge of Doom</b>, he picks one creature in range: dread makes it roll its next saving throw twice and take the lower, even if it is immune to mind-affecting fear.</p>`)}
   ${tier(2,'Exalted',`<p class="note" style="margin:0">+4 on attack and damage rolls. As an action, he lets the sword’s spirit take him over: four melee attacks at his highest base attack bonus, then one point of exhaustion. Once per long rest.</p>
     <div class="row">${pips('myth.spirit',1)}<button class="btn pri" data-act="spirit"${V.lv<2||spirit?' disabled':''}>${spirit?'Used: back after a long rest':'Unleash the spirit'}</button></div>
     ${spirit&&mi>=0?`<div>${[0,1,2,3].map(k=>`<div class="row"><span class="ord">${k+1}</span>${rollBox('v'+k,null)}</div>`).join('')}</div>`:''}`)}
  </section>`;
  const hc=Math.max(0,Math.min(10,n(S.harp.ch))),sb=(S.cond||{}).stormward;
  const hdc=(lv,ev)=>10+lv+cha+(ev&&hasFeat(/spell focus.*evoc/i)?1:0);
  const harp=`<section class="panel harp"><header><h2>Harp of the Storm</h2><span class="muted">Needs two hands · DCs use his spell DC</span></header>
   <div class="row" style="justify-content:space-between"><div class="charges" aria-label="${hc} of 10 charges">${[...Array(10).keys()].map(i=>`<i class="${i<hc?'':'u'}"></i>`).join('')}</div>
    <span class="charge"><button class="btn x" data-act="harpAdj" data-d="-1" aria-label="Remove a charge">−</button><b>${hc}</b><button class="btn x" data-act="harpAdj" data-d="1" aria-label="Add a charge">+</button><small class="muted">of 10</small></span>
    <button class="btn" data-act="harpNight">Night: +1d10</button></div>
   <div class="drbox" style="align-items:center;flex-wrap:wrap"><button class="qt" data-act="quick" data-id="stormward" aria-pressed="${!!sb}" title="Toggle Storm Ward">Storm Ward ${sb?'on':'off'}</button>
    <span>${sb?'<b>He is playing:</b> ':''}An action to start, then a free action each round. His fingers crackle like a monsoon, and he and any allies he picks within 30 ft. take half damage from lightning.</span></div>
   ${HARP.map(([k,nm,cost,lv,ev,ds])=>{const dc=hdc(lv,ev),sv=k==='burst'||k==='step'?'Fort':'Ref',res=S.harp.last&&S.harp.last.k===k?S.harp.last.txt:'';
     const btn=k==='bolt'?`<span class="row"><select id="bolt-n" aria-label="Charges to spend">${[...Array(Math.max(1,hc)).keys()].map(i=>`<option value="${i+1}">${i+1} charge${i?'s':''} (${i+4}d6)</option>`).join('')}</select><button class="btn pri" data-act="harpUse" data-k="bolt"${hc<1?' disabled':''}>Use</button></span>`
      :k==='call'&&n(S.harp.bolts)>0?`<span class="row"><button class="btn pri" data-act="harpBolt">Call bolt (${n(S.harp.bolts)} left)</button><button class="btn x" data-act="harpBoltEnd">End</button></span>`
      :`<button class="btn pri" data-act="harpUse" data-k="${k}"${hc<cost?' disabled':''}>Use</button>`;
     return `<div class="hpow"><div><span class="nm">${nm}</span><span class="cost">${k==='bolt'?'1–10 charges':cost+' charge'+(cost>1?'s':'')}</span> <small class="muted">${sv} DC <b>${dc}</b></small></div>${btn}<div class="ds">${ds}</div>${res?`<div class="res">${res}</div>`:''}</div>`}).join('')}
   <p class="note">Save DC = 10 + spell level + Cha ${sg(cha)} (sound burst counts as 2nd level, the others as 3rd), plus Spell Focus +1 on the evocations. The Cone of Clarity’s +2 is for spells he casts with his voice, so it isn’t added here. Each Use rolls the damage for you; the target’s save still decides how much lands.</p>
  </section>`;
  const capeUsed=n(S.used.cape)>=1;
  const cape=`<section class="panel"><header><h2>Cape of the Mountebank</h2><span class="muted">Bright red and gold · 1/day</span></header>
   <p class="note" style="margin:0">On command, he casts <i>dimension door</i>: he and up to ${Math.floor(9/3)} touched Medium-or-smaller creatures (by the cape’s CL 9) teleport up to 760 ft. He vanishes in a cloud of harmless gray smoke and appears in the same kind of puff at the other end.</p>
   <div class="row">${pips('cape',1)}<button class="btn pri" data-act="cape"${capeUsed?' disabled':''}>${capeUsed?'Used today':'Vanish in smoke'}</button></div>
  </section>`;
  /* [use key, name, uses, uses label, effect, action button] */
  const row=(k,nm,mx,lab,ds,ctl)=>`<tr><td class="l"><b>${nm}</b></td><td class="nowrap">${lab}${mx?`<br>${pips(k,mx)}`:''}</td><td class="l"><small>${ds}</small></td><td>${ctl||''}</td></tr>`;
  const tbl=(head,rows)=>`<div class="scroll"><table class="geartbl" style="min-width:520px"><colgroup><col style="width:28%"><col style="width:6.5em"><col><col style="width:11.5em"></colgroup>
   <thead><tr><th class="l">${head}</th><th>Uses</th><th class="l">Effect</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const lu=n(S.used.lute)>=1;
  const items=`<section class="panel"><header><h2>Magic Item Powers</h2><span class="muted">Filled pips are spent</span><button class="btn" data-act="weekReset" style="margin-left:auto">New week: reset the flute</button></header>
   ${tbl('Item',[
    row('','Force Lute: Repelling Strum',0,'1 perf. round',`Standard action: a power chord at a target within 30 ft. deals 3d4 force; Fortitude DC 16 or it is pushed back 10 ft. ${perfLeft(C)} performance rounds left.${S.itemLast&&S.itemLast.k==='strum'?`<br><b>${esc(S.itemLast.txt)}</b>`:''}`,`<button class="btn" data-act="strum"${perfLeft(C)<1?' disabled':''}>Strum &amp; roll</button>`),
    row('lute','Force Lute: Acoustic Sphere',1,'1/day','Standard action: a modified <i>resilient sphere</i> around one target (a willing ally, or an enemy who gets a DC 16 Reflex save to dodge). The sphere has 75 HP and every kind of attack can harm it.',lu?'':'<button class="btn" data-act="sphere">Cast sphere</button>'),
    row('flute','Flute: healing song',1,'1/day',`Heals everyone within 30 ft. 1d10 ${sg(cha)} HP.`,n(S.used.flute)>=1?'':'<button class="btn" data-act="fluteHeal">Play &amp; roll</button>'),
    row('glove','Glove of Blasting',1,'1/day','Scorching ray: ranged touch '+C.O['spatk.ranged'].t+', 4d6 fire per ray.'),
    row('w.flute','Flute: tree stride',1,'1/week','Tree stride. Doesn’t reset on a long rest.'),
    row('','Earring of Whisper',0,'At will','Acts as the <i>message</i> cantrip: whispered two-way conversation at long range.'),
    row('','Cone of Clarity',0,'Swift','+2 DC on his spells with a verbal component.',`<button class="qt" data-act="cone" aria-pressed="${!!S.cone}">${S.cone?'In use':'Not in use'}</button>`),
    row('','Brooch of Shielding',0,`${n(S.brooch)} HP left`,'Absorbs magic missiles aimed at him. Type a magic missile hit and press Absorb.',`<div style="display:grid;gap:4px;justify-items:start"><input type="number" id="brooch-amt" placeholder="damage" aria-label="Magic missile damage" style="width:6em"><button class="btn" data-act="broochHit">Absorb</button><span class="charge"><button class="btn x" data-act="brooch" data-d="-1" aria-label="Remove 1 point">−</button>${num('brooch',{w:'4em',rr:1,label:'Brooch HP left'})}<button class="btn x" data-act="brooch" data-d="1" aria-label="Add 1 point">+</button></span></div>`),
    row('','Boots of Spider Climbing',0,'Always','Climb speed 20 ft. on walls and ceilings.'),
    row('','Ring of Feather Fall',0,'Always','Feather fall when he drops more than 5 ft.'),
    row('','Amulet of Endure Elements',0,'Always','Comfortable from −50 °F to 140 °F.'),
    row('','Message string to Maffei',0,'—','Acts as <i>sending</i> to Maffei: a message of 25 words or fewer, and Maffei can reply.'),
   ].join(''))}</section>`;
  const slas=`<section class="panel"><header><h2>Gnome Spell-Like Abilities</h2><span class="muted">Magical Linguist · caster level ${C.L.total}</span></header>
   ${tbl('Ability',[
    row('sla.mark','Arcane mark',1,'1/day','Inscribes his personal rune, visible or invisible, on an object or creature.'),
    row('sla.comp','Comprehend languages',1,'1/day','Understands all spoken and written languages for 10 min. per level.'),
    row('sla.msg','Message',1,'1/day','Whispered two-way conversation at long range.'),
    row('sla.read','Read magic',1,'1/day','Reads scrolls and spellbooks for 10 min. per level.'),
   ].join(''))}</section>`;
  return vest+`<div class="cols">${harp}${cape}</div>${items}${slas}`;
}

function acItemsPanel(){
  const L=S.acItems||[],IT=acItemBonuses();
  const applied=AC_TYPES.filter(([k])=>IT[k]).map(([k,l])=>`${l} ${sg(IT[k])}`);
  return `<section class="panel"><header><h2>Rings, Amulets &amp; Other AC Items</h2><span class="muted">Tick Worn to add the bonus to AC</span></header>
   <div class="scroll"><table class="geartbl acitems"><colgroup><col style="width:4.5em"><col class="c-item"><col style="width:9em"><col style="width:11em"><col style="width:5.5em"><col class="c-x"></colgroup>
   <thead><tr><th>Worn</th><th class="l">Item</th><th class="l">Slot</th><th class="l">Bonus type</th><th>Bonus</th><th></th></tr></thead><tbody>
   ${L.map((x,i)=>`<tr class="${x.on?'':'future'}"><td><input type="checkbox" class="cs" data-p="acItems.${i}.on" ${x.on?'checked':''} aria-label="Worn"></td>
     <td class="l">${txt(`acItems.${i}.name`,{label:'Item name'})}</td>
     <td class="l">${sel(`acItems.${i}.slot`,AC_SLOTS,{label:'Slot'})}</td>
     <td class="l">${sel(`acItems.${i}.type`,AC_TYPES,{label:'Bonus type'})}</td>
     <td>${num(`acItems.${i}.bonus`,{w:'3.6em',rr:1,label:'Bonus'})}</td>
     <td><button class="btn x" data-act="acDel" data-i="${i}" aria-label="Remove item">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No AC items.</td></tr>'}
   </tbody></table></div>
   <div class="row"><button class="btn" data-act="acAdd">Add item</button></div>
   <p class="note"><b>Applied to AC:</b> ${applied.length?applied.join(', '):'nothing'}. The paper sheet writes “+2” in the ring’s description but uses +4 in the AC line. He wears three rings (protection, feather fall, acid resistance) for two ring slots; check with the DM.</p>
  </section>`;
}
const MI_T=[['str','Strength'],['dex','Dexterity'],['con','Constitution'],['int','Intelligence'],['wis','Wisdom'],['cha','Charisma'],['save','All saves'],['fort','Fortitude'],['ref','Reflex'],['will','Will'],['atk','Attack rolls'],['dmg','Weapon damage'],['acNat','Natural armor'],['init','Initiative'],['speed','Speed (ft.)'],['cmb','CMB'],['cmd','CMD'],['skill','All skills'],['skillCha','Cha-based skills'],...SKILLS.map(s=>['sk.'+s.k,s.n])];
const MI_TY=[['enh','Enhancement'],['inherent','Inherent (tomes, wishes)'],['resistance','Resistance'],['competence','Competence'],['luck','Luck'],['insight','Insight'],['morale','Morale'],['sacred','Sacred'],['profane','Profane'],['circumstance','Circumstance'],['untyped','Untyped']];
const MI_SLOTS=['Belt','Headband','Neck','Shoulders','Body','Chest','Eyes','Head','Hands','Wrists','Ring','Feet','Slotless'];
const miLabel=k=>(MI_T.find(x=>x[0]===k)||[k,k])[1];
function miPanel(C){
  const L=S.mitems=S.mitems||[];
  const sum=L.filter(x=>x.on&&n(x.bonus)).map(x=>`${esc(x.name||'Unnamed')}: ${miLabel(x.target)} ${sg(n(x.bonus))} ${((MI_TY.find(t=>t[0]===x.type)||[,''])[1]).toLowerCase()}`);
  return `<section class="panel"><header><h2>Stat-Boosting Magic Items</h2><span class="muted">Tick Worn and the bonus flows into every tab</span></header>
   <div class="scroll"><table class="geartbl"><colgroup><col style="width:4.5em"><col class="c-item"><col style="width:8.5em"><col style="width:11em"><col style="width:5.5em"><col style="width:12em"><col class="c-x"></colgroup>
   <thead><tr><th>Worn</th><th class="l">Item</th><th class="l">Slot</th><th class="l">Raises</th><th>Bonus</th><th class="l">Bonus type</th><th></th></tr></thead><tbody>
   ${L.map((x,i)=>`<tr class="${x.on?'':'future'}"><td><input type="checkbox" class="cs" data-p="mitems.${i}.on" ${x.on?'checked':''} aria-label="Worn"></td>
     <td class="l">${txt(`mitems.${i}.name`,{label:'Item name'})}</td>
     <td class="l">${sel(`mitems.${i}.slot`,MI_SLOTS,{label:'Slot'})}</td>
     <td class="l">${sel(`mitems.${i}.target`,MI_T,{label:'What it raises'})}</td>
     <td>${num(`mitems.${i}.bonus`,{w:'3.6em',rr:1,label:'Bonus'})}</td>
     <td class="l">${sel(`mitems.${i}.type`,MI_TY,{label:'Bonus type'})}</td>
     <td><button class="btn x" data-act="miDel" data-i="${i}" aria-label="Remove item">✕</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No items yet.</td></tr>'}
   </tbody></table></div>
   <div class="row"><button class="btn" data-act="miAdd">Add item</button></div>
   <p class="note"><b>Now applied:</b> ${sum.length?sum.join(' · '):'nothing'}. Dexterity is <b>${C.ab.dex.sc}</b> (${sg(C.ab.dex.mod)}). Same-type bonuses don’t stack, so Cat’s Grace (+4 enhancement) replaces the belt’s +2 rather than adding to it.</p>
  </section>`;
}
function customList(key,title,hint){
  return `<section class="panel"><header><h2>${title}</h2>${hint?`<span class="muted">${hint}</span>`:''}</header><div>
   ${S[key].map((a,i)=>`<div class="custom"><div class="row">${txt(`${key}.${i}.name`,{cls:'nm',ph:'Name',label:'Name'})}
     ${key!=='feats'?`<label class="row"><small class="muted">Uses/day</small>${num(`${key}.${i}.uses`,{w:'3.4em',rr:1,label:'Uses per day'})}</label>${pips(`${key}.${i}`,n(a.uses))}`:''}
     <button class="btn x" data-act="delItem" data-k="${key}" data-i="${i}" aria-label="Remove">✕</button></div>${area(`${key}.${i}.desc`,{rows:2,label:'Description'})}</div>`).join('')||'<p class="muted">None yet.</p>'}
   </div><div class="row"><button class="btn" data-act="addItem" data-k="${key}">Add</button></div></section>`;
}
function pips(k,max){if(!max)return '';const used=n(S.used[k]);let h='<span class="pips" role="group" aria-label="Uses">';for(let i=0;i<Math.min(max,40);i++)h+=`<button class="pip" data-act="use" data-k="${k}" data-i="${i}" aria-pressed="${i<used}" aria-label="Use ${i+1}"></button>`;return h+'</span>';}
function pAbilities(){
  const L=levels();const A=autoAbilities(L);
  return `<section class="panel"><header><h2>Class Abilities</h2><span class="muted">Built from his Bard levels. Filled pips are spent uses.</span><button class="btn" data-act="rest" style="margin-left:auto">Rest: reset daily uses</button></header>
   <div class="ab-list">${A.map(a=>{const k='ov.'+ok(a.key);const hasNote=String(getP(k+'.note')||'').trim();return `<div class="ab"><div class="lv">Bard ${a.lvl}</div><div><span class="nm">${a.name}</span>${a.ty?`<span class="ty">(${a.ty})</span>`:''}${a.uses?pips(a.key,a.uses):''}${a.uses?` <small class="muted">${a.uses}/day</small>`:''}<div class="ds">${a.ds}</div>
    ${a.base?`<div class="ovr"><label class="row">Uses/day ${num(k+'.uses',{rr:1,label:a.name+' uses override'})}</label><span>rules say ${a.base}; leave blank to use that</span></div>`:''}
    ${a.key==='perf'?`<div class="ovr"><label class="row">Rounds/day ${num('ov.perf.uses',{rr:1,label:'Performance rounds override'})}</label><span>rules say ${4+compute(false).ab.cha.mod+2*(L.bard-1)}; paper sheet says 38; leave blank to use the rules</span></div>`:''}
    ${hasNote?`<div class="ovr" style="display:block">${area(k+'.note',{rows:2,label:a.name+' notes'})}</div>`:`<div class="ovr"><button class="btn x" data-act="addNote" data-k="${k}.note">+ Add note or DM ruling</button></div>`}</div></div>`}).join('')||'<p class="muted">Set a Bard level on the Overview tab to see abilities here.</p>'}</div></section>
  <div class="cols">${customList('racial','Racial Traits','Gnome (Magical Linguist, Gift of Tongues)')}${customList('talents','Other Abilities','')}</div>
  ${customList('feats','Feats','9 feats at character level 17: the paper sheet lists 8, so pick one more')}`;
}

function condCards(list,map){
  return list.map(c=>`<button class="cond${c.buff?' buffc':''}" data-act="cond" data-id="${c.id}" aria-pressed="${!!map[c.id]}"><span class="n">${cname(c)}</span><span class="e">${cdesc(c)}</span></button>`).join('');
}
function netSummary(){
  const M=gather(S.cond,S.neg);
  const lab={atk:'Attack rolls',atkMelee:'Melee attacks',atkRanged:'Ranged attacks',dmg:'Weapon damage',dmgRanged:'Ranged damage',ac:'AC',acDodge:'Dodge AC',acNat:'Natural armor',save:'All saves',fort:'Fortitude',ref:'Reflex',will:'Will',skill:'Skill checks',skillStrDex:'Str/Dex skills',ability:'Ability checks',init:'Initiative',cmd:'CMD',str:'Strength',dex:'Dexterity',con:'Constitution',wis:'Wisdom',cha:'Charisma',speed:'Speed (ft.)'};
  const rows=Object.entries(M.tot).filter(([,v])=>v).map(([k,v])=>`<div><span>${lab[k]||miLabel(k)}</span><span class="${v<0?'neg':'pos'}">${sg(v)}</span></div>`);
  const fl={loseDex:'Loses Dex bonus to AC',flatFooted:'Flat-footed: loses Dex to AC',dexZero:'Dex treated as 0',strZero:'Str treated as 0',halfSpeed:'Half speed',prone:'+4 AC vs ranged, −4 AC vs melee'};
  Object.keys(M.flags).forEach(f=>rows.push(`<div><span>${fl[f]||f}</span><span></span></div>`));
  if(M.neg)rows.push(`<div><span>Max HP</span><span class="neg">−${5*M.neg}</span></div>`);
  return rows.join('')||'<p class="muted">No active effects. Every value is at its base.</p>';
}
function pConditions(){
  return `<section class="panel"><header><h2>Conditions</h2><button class="btn" data-act="clearCond" style="margin-left:auto">Clear all</button></header>
   <p class="muted" style="margin:0">Tap a card to toggle it. Scores, AC, saves, skills and attacks on every tab update right away. Changed values turn red (worse) or blue (better). Worn items (belt, circlet) are always included.</p></section>
  <div class="cols" style="grid-template-columns:minmax(0,2.2fr) minmax(min(100%,260px),1fr)">
   <div class="page" style="margin:0">
    <section class="panel"><header><h2>Conditions</h2></header><div class="condgrid">${condCards(CONDS,S.cond)}</div></section>
    <section class="panel"><header><h2>Performances, Spells &amp; Situations</h2></header><div class="condgrid">${condCards(BUFFS,S.cond)}</div></section>
   </div>
   <section class="panel" style="position:sticky;top:60px"><header><h2>Net Effect</h2></header>
    <div class="row"><span class="lbl">Negative levels</span><span class="stepper"><button data-act="neg" data-d="-1" aria-label="Remove negative level">−</button><b>${n(S.neg)}</b><button data-act="neg" data-d="1" aria-label="Add negative level">+</button></span></div>
    <div class="net">${netSummary()}</div>
    <p class="note">Same-type bonuses don’t stack: Inspire Courage and Inspire Greatness are both competence bonuses on attacks, so only the higher counts. Shaken, frightened and panicked don’t stack with each other.</p>
   </section></div>`;
}

/* ---------- journal: an old leather-bound book. Page 0 is the title page; his pages follow. Two pages side by side, one on a phone ---------- */
let bookOpen=tab==='journal',bookT0=0,jFlipping=false;
let jAt=(()=>{const v=Math.floor(+ls.get('namfoodle-jpage'));return isFinite(v)&&v>=0?v:0})();
const jOne=()=>window.innerWidth<760;
const jList=()=>{S.journal=Array.isArray(S.journal)?S.journal:[];return [null,...S.journal]};
const jStep=()=>jOne()?1:2;
function jClamp(){const L=jList(),st=jStep();jAt=Math.max(0,Math.min(jAt-(jAt%st),Math.floor(Math.max(0,L.length-1)/st)*st));ls.set('namfoodle-jpage',String(jAt))}
function jPage(v,side){
  const L=jList(),cls=`jpage ${side}`;
  if(v===0)return `<div class="${cls} jtitlepage"><span class="t1">The Journal of</span><span class="t2">${esc(S.info.name||'Namfoodle Nackle')}</span>${S.info.nick?`<span class="t1">“${esc(S.info.nick)}”</span>`:''}
    <span class="orn">♪ ❦ ♪</span><span class="t3">Bard of the Belhaim Saviors</span><span class="t3">Realm of Tal’Dorei</span><span class="t4">If found, return to the Golden Grin, Emon.<br>Reward in song, and in gold.</span></div>`;
  if(v>=L.length)return `<div class="${cls} jblank"><span>A fresh page…</span><button data-act="jadd">+ Begin a new page</button></div>`;
  const i=v-1,p=L[v]||{};
  return `<div class="${cls}"><div class="jhead"><input class="jdate" data-p="journal.${i}.date" value="${esc(p.date)}" placeholder="Date…" aria-label="Page ${v} date"><input class="jtitle" data-p="journal.${i}.title" value="${esc(p.title)}" placeholder="Title of this entry" aria-label="Page ${v} title"></div>
    <textarea class="jtext" data-p="journal.${i}.text" placeholder="Write here…" aria-label="Page ${v} text">${esc(p.text)}</textarea>

function jTurn(to){

  const done=()=>{jAt=to;jClamp();if(pg)pg.innerHTML=jSpread();const bar=document.getElementById('jbar');if(bar)bar.innerHTML=jBar()};
  if(!book||matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}
  jFlipping=true;const leaf=document.createElement('div');leaf.className='leaf '+dir;leaf.innerHTML='<div class="f"></div><div class="b"></div>';book.appendChild(leaf);
  setTimeout(done,340);setTimeout(()=>{leaf.remove();jFlipping=false},720);
}

    s.bag=(s.bag||[]).filter(g=>!/^Potion of /.test(g.item||''));

      if(typeof d.treasure==='string'&&d.treasure.trim()&&d.treasure!==DEFAULT.treasure)s.boh.notes=(s.boh.notes+'\n'+d.treasure).trim();}
    s.v=4;}
  /* v5: Beads of Sustenance are 40 beads, not 40 lb.; the haversack's two wands join the wand list */
  if(d&&(d.v||1)<5){
    (s.boh.items||[]).forEach(x=>{if(/beads of sustenance/i.test(x.item||'')&&n(x.wt)===40&&!n(x.qty)){x.qty=40;x.wt=0;if(/weight column/.test(x.desc||''))x.desc=''}});
    s.charged=s.charged||[];['Wand of Stabilize','Bone wand of Enlarge/Reduce Person'].forEach(nm=>{if(!s.charged.some(c=>String(c.name||'').toLowerCase()===nm.toLowerCase()))s.charged.push(clone(DEFAULT.charged.find(c=>c.name===nm)))});
    s.v=5;}

}

/* level up: snapshot before/after so the summary lists exactly what changed */
let lastSummary='';
function snap(){const C=compute(false);return{lvl:C.L.total,bab:C.bab,base:{...C.base},avail:C.O['sk.avail'].n,hp:hpBase(),
  slots:[...Array(7).keys()].map(l=>slotInfo(l,C).total),known:[...Array(7).keys()].map(l=>knownBase(l,C.L.bard)),perf:perfMax(C),
  ab:autoAbilities(C.L).map(a=>a.name+(a.uses?` (${a.uses}/day)`:'')),L:C.L}}
function levelUp(){
  const $=id=>document.getElementById(id);const v=$('lu-cls').value,how=($('lu-hp')||{}).value||'avg',roll=n(($('lu-roll')||{}).value),fcb=$('lu-fcb').value;
  if(how==='roll'&&!(roll>=1)){setStatus('Enter the hit die roll first.');$('lu-roll').focus();return}

  else{added=true;S.classes.push(v.startsWith('preset:')?Object.assign({preset:v.slice(7),level:0},clone(PRESETS[v.slice(7)])):{preset:'Custom',level:0,name:'New class',hd:8,bab:'3/4',fort:'poor',ref:'poor',will:'good',prestige:false,sp:2,skills:''});idx=S.classes.length-1}
  const c=S.classes[idx];c.level=Math.floor(n(c.level))+1;
  const hd=Math.max(1,n(c.hd)||8);const die=how==='max'?hd:how==='roll'?Math.min(hd,Math.floor(roll)):avgHD(hd);
  if(fcb==='hp')S.fcbHp=n(S.fcbHp)+1; if(fcb==='skill')S.fcbSkill=n(S.fcbSkill)+1;
  let gain=0;
  if(S.hp.mode!=='auto'){gain=Math.max(1,die+conMod())+(fcb==='hp'?1:0);S.hp.max=n(S.hp.max)+gain;}
  const after=snap();const delta=after.hp-before.hp;S.hp.cur=n(S.hp.cur)+delta;
  (S.levelLog=S.levelLog||[]).push({row:idx,added,gain,delta,fcb});
  const li=[];const ch=(a,b)=>a===b?`${sg(b)} (no change)`:`${sg(a)} → <b>${sg(b)}</b>`;
  li.push(`Hit points ${before.hp} → <b>${after.hp}</b> (+${delta}${S.hp.mode!=='auto'?`: ${how==='avg'?'average':how==='max'?'max':'rolled'} ${die} + Con ${sg(conMod())}${fcb==='hp'?' + 1 favored class':''}`:''})`);
  li.push(`Base attack ${ch(before.bab,after.bab)}`);

  if(after.perf!==before.perf)li.push(`Performance rounds per day ${before.perf} → <b>${after.perf}</b>`);
  const sd=after.slots.map((x,l)=>x>before.slots[l]?`${l?ORD[l-1]:'cantrips'} ${before.slots[l]} → ${x}`:'').filter(Boolean);if(sd.length)li.push(`Spells per day: <b>${sd.join(', ')}</b>`);
  const kd=after.known.map((x,l)=>x>before.known[l]?`${l?ORD[l-1]:'cantrips'} ${before.known[l]} → ${x}`:'').filter(Boolean);if(kd.length)li.push(`Spells known: <b>${kd.join(', ')}</b>. Pick the new ones on the Spells tab.`);

  return{hit:C.O[`atk.${i}.hit`].n-5*it,db:C.O[`atk.${i}.dmg`].n,dmgT:C.O[`atk.${i}.dmg`].t,crit:a.crit};
}

  document.querySelectorAll('[data-rk]').forEach(el=>{const k=el.dataset.rk,info=rollInfo(k,C);if(!info)return;const r=rolls[k]||{};

    else A.innerHTML=`<span class="muted">${sg(info.hit)}</span>`;

    const di=el.querySelector(`[data-roll="${k}.dmg"]`);if(di){di.max=rg.max;di.min=rg.min;di.title=`${rg.txt}: ${rg.min}–${rg.max}`}
    if(r.dmg!==''&&r.dmg!=null){const dice=Math.floor(n(r.dmg));const tot=Math.max(1,dice*mult+info.db);
      D.innerHTML=`= <b>${tot}</b> damage${r.crit?' <em class="crit">critical</em>':''} <small class="muted">(dice ${dice}${mult>1?` ×${mult}`:''} ${sg(info.db)})</small>${r.capped?` <small class="miss">${esc(r.capped)}</small>`:''}`;}

function rowHit(k,C){const info=rollInfo(k,C),r=rolls[k]||{};if(!info||!(n(r.d20)>=1))return null;const d=Math.floor(n(r.d20));

function perfClearBuff(id){const p=perfDef(id);if(!p||!p.self)return;S.cond[p.self]=false;
  if(id==='greatness'&&n(S.perf.ghp)){const t=Math.min(n(S.hp.temp),n(S.perf.ghp));S.hp.temp=n(S.hp.temp)-t;if(t)hpLog(`Inspire Greatness ended: −${t} temp HP`);S.perf.ghp=0}}

  S.cond[p.self]=true;
  if(id==='greatness'&&!n(S.perf.ghp)){const cm=compute(true).ab.con.mod,r=Math.max(2,dice(2,10)+2*cm),old=n(S.hp.temp);S.hp.temp=Math.max(old,r);S.perf.ghp=S.hp.temp-old;
    hpLog(`Inspire Greatness: 2d10 ${sg(2*cm)} = ${r} temp HP`);}}

function perfStart(id,picked){
  const C=compute(true),p=perfDef(id);if(!p||levels().bard<p.lvl||p.free)return;const cost=p.cost||1;

  endAllPerf();   // a new performance ends the old one, and anything still lingering

  S.perf.cur=id;perfApplyBuff(id);dayLog(`Started ${p.n}${PICK[id]?` on ${tgOf(id).who.map(pname).join(', ')}`:''}`);

    S.used.perf=n(S.used.perf)+1;if(perfLeft(compute(true))<1)setStatus('That was his last performance round today.');return}

}

/* gray smoke for the Cape of the Mountebank */

  for(let i=0;i<16;i++){const p=document.createElement('div');p.className='fx-smoke';const a=Math.random()*Math.PI*2,r=20+Math.random()*60;

/* long rest: heals character level + Con mod, clears nonlethal, resets daily uses (hero points and weekly items kept), slots, performance, harp +1d10 */
function restHeal(){return Math.max(1,levels().total+conMod())}
function longRest(heal){
  let h=0;
  endAllPerf();
  if(heal){const mx=hpMaxNow();const before=n(S.hp.cur);S.hp.cur=Math.min(mx,before+restHeal());h=S.hp.cur-before;S.hp.nl=0;}
  const keep={};Object.keys(S.used).forEach(k=>{if(k==='hero'||/^w\./.test(k))keep[k]=S.used[k]});S.used=keep;
  S.cast={};S.cond.spiritspent=false;

   case 'broochHit':{const x=amt('brooch-amt');if(!x)return;const ab=Math.min(x,n(S.brooch)),thru=x-ab;S.brooch=n(S.brooch)-ab;
     if(thru){const tmp=n(S.hp.temp),use=Math.min(tmp,thru);S.hp.temp=tmp-use;S.hp.cur=n(S.hp.cur)-(thru-use);}
     hpLog(`Magic missile ${x}: brooch absorbed ${ab}${thru?`, took ${thru}`:''}`);dayLog(`Brooch of Shielding absorbed ${ab} (${S.brooch} left)`);render();break;}
   case 'chg':{const x=S.charged[i];if(!x)return;x.ch=Math.max(0,n(x.ch)+n(b.dataset.d));if(n(b.dataset.d)<0)dayLog(`${x.name}: 1 charge (${x.ch} left)`);render();break;}
   case 'chAdd':(S.charged=S.charged||[]).push({name:'',ch:0,notes:''});render();break;
   case 'chDel':S.charged.splice(i,1);render();break;
   case 'sdLogClear':S.sdLog=[];render();break;
   case 'rest':longRest(false);render();break;
   case 'addNote':setP(b.dataset.k,' ');render();{const el=document.getElementById('i-'+b.dataset.k.replace(/\W/g,'_'));if(el){el.value='';el.focus()}}break;
   case 'levelUp':levelUp();render();break;
   case 'undoLevel':undoLevel();render();break;
   case 'cone':S.cone=!S.cone;dayLog(S.cone?'Cone of Clarity in use (+2 DC on verbal spells)':'Put away the Cone of Clarity');render();break;
   case 'quick':{const id=b.dataset.id;S.cond[id]=!S.cond[id];if(id==='stormward')dayLog(S.cond[id]?'Playing the Harp of the Storm: Storm Ward':'Stopped playing the harp');render();break;}
   case 'dmg':{const d=amt(b.dataset.src||'hpamt');if(!d)return;
     const tmp=n(S.hp.temp),use=Math.min(tmp,d);S.hp.temp=tmp-use;S.hp.cur=n(S.hp.cur)-(d-use);
     hpLog(`Took ${d} damage`+(use?` (${use} from temp HP)`:''));render();break;}
   case 'clearLog':S.hpLog=[];render();break;
   case 'exportSheet':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const x=document.createElement('a');
     x.href=u;x.download=`${(S.info.name||'character').replace(/\W+/g,'-')}-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);setStatus('Backup downloaded');return;}
   case 'importSheet':document.getElementById('importfile').click();return;
   case 'miAdd':(S.mitems=S.mitems||[]).push({name:'',slot:'Slotless',target:'dex',bonus:2,type:'enh',on:true});render();break;
   case 'miDel':S.mitems.splice(i,1);render();break;
   case 'acAdd':(S.acItems=S.acItems||[]).push({name:'',slot:'Ring',type:'deflection',bonus:1,on:true});render();break;
   case 'acDel':S.acItems.splice(i,1);render();break;
   case 'potDrink':{const l=b.dataset.l||'potions',p=(getP(l)||[])[i];if(!p||n(p.qty)<1)return;const dl=diceIn(p.dice),lo=dl.reduce((a,[c])=>a+c,0),hi=dl.reduce((a,[c,s])=>a+c*s,0);
     const el=document.getElementById('pot-roll-'+l.replace(/\W/g,'_')+'-'+i);const x=Math.floor(n((el||{}).value));
     if(!(x>=lo&&x<=hi)){setStatus(`Type the ${p.dice} total (${lo}–${hi}).`);if(el)el.focus();return}
     const am=x+n(p.bonus),mx=hpMaxNow(),bf=n(S.hp.cur);S.hp.cur=Math.min(mx,bf+am);const h=S.hp.cur-bf;
     p.qty=n(p.qty)-1;hpLog(`Drank ${p.name}: ${x}+${n(p.bonus)} = ${am}, healed ${h}`);setTimeout(()=>setStatus(`${p.name}: healed ${h} HP`),800);render();break;}
   case 'potAdd':{const l=b.dataset.l||'potions';if(!Array.isArray(getP(l)))setP(l,[]);getP(l).push({name:'Cure Light Wounds',dice:'1d8',bonus:1,qty:1});render();break;}
   case 'potDel':{(getP(b.dataset.l||'potions')||[]).splice(i,1);render();break;}
   case 'clearRolls':Object.keys(rolls).forEach(k=>{if(k!=='ac')delete rolls[k]});render();return;
   case 'heal':{const src=b.dataset.src||'hpamt',mx=hpMaxNow();if(!amt(src))return;const bf=n(S.hp.cur);S.hp.cur=Math.min(mx,n(S.hp.cur)+amt(src));hpLog(`Healed ${S.hp.cur-bf}`);S.hp.nl=Math.max(0,n(S.hp.nl)-amt(src));render();break;}
   case 'full':{const h=longRest(true);hpLog(`Long rest, healed ${h}`);setTimeout(()=>setStatus(`Long rest: healed ${h} HP, daily uses reset`),800);render();break;}
   case 'cond':{const id=b.dataset.id;S.cond[id]=!S.cond[id];
     /* the performance cards and these buff cards stay in step */
     const pd=PERF.find(p=>p.self===id);if(pd&&!S.cond[id]&&perfActive(pd.id)){if(S.perf.cur===pd.id)S.perf.cur='';if(lingerOn(pd.id)){S.perf.linger=0;S.perf.lingerOf=''}perfClearBuff(pd.id)}
     render();break;}
   case 'neg':S.neg=Math.max(0,n(S.neg)+n(b.dataset.d));render();break;
   case 'clearCond':endAllPerf();S.cond={};S.neg=0;render();break;
   case 'artPick':document.getElementById('artfile').click();return;
   case 'artRemove':{const old=S.art&&S.art.id;S.art=false;if(old&&assets)assets.delete(old).catch(()=>{});renderArt();break;}
   default:return;
  }
  scheduleSave();});
document.getElementById('artfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)setArt(f)});
document.getElementById('importfile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.info||!d.classes)throw 0;S=load(d);render();scheduleSave(true);setStatus('Backup restored')}
    catch(err){setStatus('That file isn’t a character sheet backup.')}};r.readAsText(f)});
const artEl=document.getElementById('art');
artEl.addEventListener('dragover',e=>{e.preventDefault();artEl.classList.add('drag')});
artEl.addEventListener('dragleave',()=>artEl.classList.remove('drag'));
artEl.addEventListener('drop',e=>{e.preventDefault();artEl.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)setArt(f)});

boot();
})();
</script>
